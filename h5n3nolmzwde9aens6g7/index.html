<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f8ecdf">
<title>メモ</title>
<style>
:root{
  --ink:#4a3426; --ink2:#8d6d58; --ink3:#b39883; --card:rgba(255,251,246,.8); --line:rgba(255,255,255,.85);
  --warm1:#f7b26e; --warm2:#ec7f45; --bg:#f8ecdf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:none;-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 2px 6px}
.hbtns{display:flex;gap:6px}
.pill{height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.75);font-size:12.5px;font-weight:700;box-shadow:0 2px 10px rgba(120,70,30,.1)}
.pill:active{transform:scale(.96)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:12px;box-shadow:0 6px 24px rgba(120,70,30,.08)}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--ink2);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:600;letter-spacing:.02em;color:var(--ink3)}
.favs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{position:relative;flex:none;width:66px;height:66px;border-radius:14px;background:#ddd center/cover no-repeat;box-shadow:0 3px 10px rgba(120,70,30,.15)}
.fav span{position:absolute;left:4px;bottom:4px;padding:1px 6px;border-radius:8px;background:rgba(255,250,244,.85);font-size:10px;font-weight:800}
.fav .del{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;font-size:11px;font-weight:900;color:#b4462c;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18);font-style:normal}
.fav .del.sure{background:#b4462c;color:#fff}
.empty{font-size:12px;color:var(--ink3);padding:6px 2px}
.subacts{display:flex;gap:8px;margin-top:10px}
.subacts button{flex:1;height:38px;border-radius:19px;background:#fff;font-size:12.5px;font-weight:800;box-shadow:0 3px 10px rgba(120,70,30,.1)}
.bbtns{display:flex;gap:8px;width:100%;max-width:460px}
.bbtns button{flex:1;height:48px;border-radius:24px;background:#fff;font-size:14px;font-weight:800;box-shadow:0 3px 12px rgba(120,70,30,.12);
  -webkit-touch-callout:none}
.bbtns .main{background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  padding:10px 18px;border-radius:20px;background:rgba(74,52,38,.92);color:#fff;font-size:13px;font-weight:700;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;white-space:normal;max-width:88vw;width:max-content;text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
input[type=file]{display:none}
.ovl{position:fixed;inset:0;z-index:40;display:none}
.ovl.open{display:flex}
.sheet{flex-direction:column;background:rgba(248,236,223,.97);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding:calc(10px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom)}
.shead{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px;font-size:16px}
.shead small{font-size:12px;color:var(--ink3);font-weight:700}
.x{width:36px;height:36px;border-radius:18px;background:#fff;font-weight:900;box-shadow:0 2px 8px rgba(120,70,30,.12)}
.camO{background:#120d0a;flex-direction:column}
#camView{position:absolute;inset:0;display:grid;place-items:center}
#camView canvas{width:100%;height:100%;display:block}
.camTop{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;padding:0 10px}
.cbtn{flex:none;width:40px;height:40px;border-radius:20px;background:rgba(255,250,244,.78);font-size:16px;font-weight:900;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.cbtn.wide{width:auto;padding:0 14px;font-size:13px}
.cbtn.off{opacity:.5}
.camChips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.camChips::-webkit-scrollbar{display:none}
.cchip{flex:none;height:40px;display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;border-radius:20px;background:rgba(255,250,244,.7);
  font-size:12px;font-weight:800;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.cchip i{width:32px;height:32px;border-radius:16px;background:#ccc center/cover}
.cchip.on{background:#fff;box-shadow:0 0 0 2px #ec7f45}
.camBottom{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;padding:0 26px}
#camThumb{width:52px;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.2) center/cover}
#camShutter{width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35);position:relative}
#camShutter::after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fffaf0,#ffd6a6 45%,#f4a062 80%,#ee8a4a)}
#camShutter:active{transform:scale(.93)}
#camFlash{position:absolute;inset:0;background:#fff8ef;opacity:0;pointer-events:none}
#camFlash.go{animation:camflash .45s ease-out}
@keyframes camflash{0%{opacity:.85}100%{opacity:0}}
.camMsg{position:absolute;left:50%;top:45%;transform:translateX(-50%);color:#fff;font-size:14px;font-weight:700;text-align:center;max-width:80%;line-height:1.6}
.fbar{padding:0 16px 10px;display:flex;gap:8px}
.fbar button{height:38px;padding:0 16px;border-radius:19px;background:#fff;font-size:12.5px;font-weight:800;box-shadow:0 3px 10px rgba(120,70,30,.1)}
.fgrid{flex:1;overflow-y:auto;padding:0 12px 30px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.fgrid button{aspect-ratio:3/4;border-radius:10px;background:#ddd center/cover;padding:0}
.fgrid .empty{grid-column:1/-1}
.photoO{flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(248,236,223,.97);padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
.photoO img{max-width:100%;flex:1;min-height:0;object-fit:contain;border-radius:14px;-webkit-touch-callout:default}
.pinfo{font-size:11.5px;color:var(--ink2)}
.photoO .bbtns button.sure{background:#b4462c;color:#fff}
.seg2{flex:1;display:flex;padding:3px;border-radius:16px;background:rgba(255,255,255,.6);gap:2px}
.seg2 button{flex:1;height:28px;border-radius:13px;background:transparent;font-size:12px;font-weight:800;color:var(--ink2)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(150,90,40,.15)}
header{gap:10px}
.fav.sel{box-shadow:0 0 0 3px #ec7f45,0 3px 10px rgba(120,70,30,.15)}
.fav em{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:10px;background:#ec7f45;color:#fff;font-size:11px;font-weight:900;font-style:normal;display:grid;place-items:center}
header{gap:8px;padding-bottom:8px}
.pill.on{background:#ffd6a6}
.pill.dim{opacity:.5}
#viewBox{position:sticky;top:0;z-index:6;margin:0 -12px;padding:6px 12px 8px;background:var(--bg);box-shadow:0 8px 14px -12px rgba(120,70,30,.35)}
#viewArea{position:relative;height:46vh;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:#2a221d;touch-action:none}
#viewArea.big{height:72vh}
#viewIn{position:absolute;left:0;top:0;transform-origin:0 0}
#viewIn canvas{display:block}
#ov{position:absolute;left:0;top:0;pointer-events:none}
.vbar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;pointer-events:none}
.vbar>*{pointer-events:auto}
.mseg{display:flex;padding:3px;border-radius:15px;background:rgba(255,250,244,.82);gap:2px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mseg button{height:26px;padding:0 9px;border-radius:12px;background:transparent;font-size:11.5px;font-weight:800;color:var(--ink2)}
.mseg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(150,90,40,.18)}
.vchip{height:32px;padding:0 10px;border-radius:16px;background:rgba(255,250,244,.82);font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#diffTxt b{font-size:14px;color:#d8692e;font-variant-numeric:tabular-nums}
.vtop{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.empty2{position:absolute;inset:0;display:grid;place-items:center;color:#d9c4b2;font-size:14px;font-weight:800}
#noImg[hidden]{display:none}
.tbar{display:flex;gap:6px;margin-top:8px}
.tbar button{height:40px;border-radius:20px;background:#fff;font-size:12.5px;font-weight:800;box-shadow:0 3px 10px rgba(120,70,30,.1);padding:0 12px}
.tbar button:disabled{opacity:.35}
.tbar .grow{flex:1;position:relative;overflow:hidden}
.tbar .on{background:#ffd6a6}
#fitBar{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#f8cfa2,#ee8a4a);opacity:.55;transition:width .2s}
#fitTxt{position:relative}
.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:10px;box-shadow:0 4px 16px rgba(120,70,30,.06);overflow:hidden}
.gh{display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;height:46px}
.gh b{flex:1;font-size:13.5px;text-align:left}
.gh i{width:9px;height:9px;border-radius:3px}
.gh .gv{font-size:11px;color:var(--ink3);font-weight:700}
.gh button.rs{height:28px;padding:0 10px;border-radius:14px;background:#fff;font-size:11px;font-weight:800;color:var(--ink2);box-shadow:0 2px 6px rgba(120,70,30,.1)}
.gb{display:none;padding:0 10px 10px}
.grp.open .gb{display:block}
.row{display:grid;grid-template-columns:92px 26px 1fr 26px 50px;align-items:center;gap:4px;height:40px}
.row .lb{font-size:12px;font-weight:800;text-align:left;background:none;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.chg .lb{color:#d8692e}
.row .nb{height:26px;border-radius:13px;background:#fff;font-size:14px;font-weight:900;color:var(--ink2);box-shadow:0 1px 4px rgba(120,70,30,.12)}
.row .vl{font-size:11px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(120,80,50,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:11px;background:#fff;border:3px solid #ec7f45;margin-top:-9px;box-shadow:0 2px 6px rgba(120,70,30,.25)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(120,80,50,.18)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:11px;background:#fff;border:3px solid #ec7f45}
.subacts{display:flex;gap:8px;margin-top:4px}
.subacts button{flex:1;height:38px;border-radius:19px;background:#fff;font-size:12.5px;font-weight:800;box-shadow:0 3px 10px rgba(120,70,30,.1)}
.subacts button.sure{background:#b4462c;color:#fff}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--ink2);font-weight:700}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hbtns">
      <button class="pill" id="befBtn">加工前</button>
      <button class="pill" id="tgtBtn">見本</button>
    </div>
    <div class="hbtns">
      <button class="pill" id="saveBtn">保存</button>
      <button class="pill" id="camBtn">📷</button>
    </div>
  </header>
  <div id="viewBox">
    <div id="viewArea">
      <div id="viewIn"><canvas id="c"></canvas><canvas id="ov"></canvas></div>
      <div class="empty2" id="noImg">加工前 ・ 見本</div>
      <div class="vtop"><button class="vchip" id="sizeBtn">⤢</button><button class="vchip" id="origBtn">元</button></div>
      <div class="vbar">
        <div class="mseg" id="modeSeg"><button data-m="0" class="on">結果</button><button data-m="1">見本</button><button data-m="2">半分</button><button data-m="3">差</button></div>
        <span class="vchip" id="diffTxt">差 <b>-</b></span>
      </div>
    </div>
    <div class="tbar">
      <button id="undoBtn">↶</button><button id="redoBtn">↷</button>
      <button class="grow" id="fitBtn"><i id="fitBar"></i><span id="fitTxt">自動で合わせる</span></button>
      <button id="moveBtn">動かす</button>
      <button id="snapBtn">記録</button>
    </div>
  </div>
  <div id="groups"></div>
  <section class="card">
    <h2>記録</h2>
    <div class="favs" id="snaps"></div>
  </section>
  <section class="card">
    <div class="subacts">
      <button id="foldBtn">🗂 フォルダ</button>
      <button id="expBtn">書き出し</button>
      <button id="impBtn">読み込み</button>
      <button id="resetBtn">最初から</button>
    </div>
  </section>
</div>

<div id="cam" class="ovl camO">
  <div id="camView"></div>
  <div class="camTop">
    <button class="cbtn" id="camClose" aria-label="閉じる">✕</button>
    <div class="camChips" id="camChips"></div>
    <button class="cbtn" id="camFlip" aria-label="切替">⟲</button>
  </div>
  <div class="camBottom">
    <button id="camThumb" aria-label="フォルダ"></button>
    <button id="camShutter" aria-label="撮影"></button>
    <span style="width:52px"></span>
  </div>
  <div id="camFlash"></div>
  <div class="camMsg" id="camMsg"></div>
</div>
<div id="folder" class="ovl sheet">
  <div class="shead"><b>フォルダ <small id="fCount"></small></b><button class="x" data-close="folder">✕</button></div>
  <div class="fgrid" id="fgrid"></div>
</div>
<div id="photo" class="ovl photoO">
  <img id="photoImg" alt="">
  <div class="pinfo" id="pinfo"></div>
  <div class="bbtns">
    <button data-close="photo">もどる</button>
    <button id="pDel">削除</button>
    <button class="main" id="pShare">保存・共有</button>
  </div>
</div>

<input type="file" id="befFile" accept="image/*">
<input type="file" id="tgtFile" accept="image/*">
<input type="file" id="impFile" accept="application/json,.json">
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const toast = (t, ms = 1600) => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), ms); };
/* =====================================================================
   遺伝子（フィルターの設計図）: すべて 0〜1。n は「何もしない」値
   前半31個は以前と同じ並び。後半41個を追加（古いデータは中立で埋める）
   ===================================================================== */
const HUES8 = ['赤', '橙', '黄', '緑', '水色', '青', '紫', '赤紫'];
const HUE_CENTERS = [0, 30, 60, 120, 180, 240, 280, 320];
const GENES = [
  { k:'black', g:'tone', n:0,  label:'黒の浮き' },
  { k:'white', g:'tone', n:0,  label:'白の沈み' },
  { k:'mS',    g:'tone', n:.5, label:'暗部' },
  { k:'mM',    g:'tone', n:.5, label:'中間' },
  { k:'mH',    g:'tone', n:.5, label:'明部' },
  { k:'rS', g:'color', n:.5, label:'赤・暗部' }, { k:'rM', g:'color', n:.5, label:'赤・中間' }, { k:'rH', g:'color', n:.5, label:'赤・明部' },
  { k:'gS', g:'color', n:.5, label:'緑・暗部' }, { k:'gM', g:'color', n:.5, label:'緑・中間' }, { k:'gH', g:'color', n:.5, label:'緑・明部' },
  { k:'bS', g:'color', n:.5, label:'青・暗部' }, { k:'bM', g:'color', n:.5, label:'青・中間' }, { k:'bH', g:'color', n:.5, label:'青・明部' },
  { k:'sat',   g:'color', n:.6, label:'彩度' },
  { k:'f0', g:'tex', n:.5, label:'細かさ1' }, { k:'f1', g:'tex', n:.5, label:'細かさ2' }, { k:'f2', g:'tex', n:.5, label:'細かさ3' },
  { k:'f3', g:'tex', n:.5, label:'細かさ4' }, { k:'f4', g:'tex', n:.5, label:'細かさ5' }, { k:'f5', g:'tex', n:.5, label:'細かさ6' },
  { k:'bloom', g:'light', n:0, label:'滲み' }, { k:'bThr', g:'light', n:.5, label:'滲みの境目' },
  { k:'bSpr', g:'light', n:.5, label:'滲みの広がり' }, { k:'bTint', g:'light', n:.5, label:'滲みの色' },
  { k:'vig',   g:'place', n:0, label:'周辺減光' }, { k:'haze', g:'place', n:0, label:'端のかすみ' },
  { k:'eBlur', g:'place', n:0, label:'端のぼけ' }, { k:'eRad', g:'place', n:.5, label:'効き始め' },
  { k:'grain', g:'tex', n:0, label:'粒子' }, { k:'gSize', g:'tex', n:.3, label:'粒子の大きさ' },
  // ここから追加
  { k:'wbTemp', g:'color', n:.5, label:'色温度' }, { k:'wbTint', g:'color', n:.5, label:'色かぶり(WB)' },
  { k:'shadows', g:'tone', n:.5, label:'シャドウ' }, { k:'highlights', g:'tone', n:.5, label:'ハイライト' },
  { k:'vibrance', g:'color', n:.5, label:'自然な彩度' },
  ...HUES8.flatMap((h, i) => [
    { k:'h' + i + 'H', g:'hsl', n:.5, label:h + '・色相' },
    { k:'h' + i + 'S', g:'hsl', n:.5, label:h + '・彩度' },
    { k:'h' + i + 'L', g:'hsl', n:.5, label:h + '・明るさ' },
  ]),
  { k:'gsH', g:'grade', n:.55, cyc:true, label:'影の色' },  { k:'gsS', g:'grade', n:0, label:'影の強さ' },
  { k:'gmH', g:'grade', n:.1, cyc:true, label:'中間の色' }, { k:'gmS', g:'grade', n:0, label:'中間の強さ' },
  { k:'ghH', g:'grade', n:.08, cyc:true, label:'光の色' },  { k:'ghS', g:'grade', n:0, label:'光の強さ' },
  { k:'gdPos', g:'sky', n:.5, label:'空・位置' }, { k:'gdFeather', g:'sky', n:.5, label:'空・ぼかし幅' },
  { k:'gdExpo', g:'sky', n:.5, label:'空・明るさ' }, { k:'gdTemp', g:'sky', n:.5, label:'空・色温度' },
  { k:'gdAngle', g:'sky', n:.5, label:'空・傾き' },
  { k:'halation', g:'light', n:0, label:'ハレーション' },
];
const D = GENES.length;                 // 72
const D_OLD = 31;
const NEUTRAL = GENES.map(g => g.n);
const idx = Object.fromEntries(GENES.map((g, i) => [g.k, i]));
const CYC_GENES = new Set(GENES.map((g, i) => g.cyc ? i : -1).filter(i => i >= 0));
const GROUPS = [
  { k:'tone', label:'トーン', color:'#ee8a4a' }, { k:'color', label:'色', color:'#e06a5a' },
  { k:'hsl', label:'色ごと', color:'#d4537e' }, { k:'grade', label:'グレーディング', color:'#7f77dd' },
  { k:'tex', label:'質感', color:'#6f8fb8' }, { k:'light', label:'光', color:'#e8b931' },
  { k:'place', label:'周辺', color:'#a07cc0' }, { k:'sky', label:'空', color:'#3aa0c8' },
];
const GROUP_COLOR = Object.fromEntries(GROUPS.map(g => [g.k, g.color]));
// 古い（31個）データを72個にそろえる
const padZ = z => (z && z.length < D) ? z.concat(NEUTRAL.slice(z.length)) : z;

const hsv2rgb = (h, s, v) => { const f = n => { const k = (n + h * 6) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); }; return [f(5), f(3), f(1)]; };
const LUMA = [.2126, .7152, .0722];
const lumOf = c => c[0] * LUMA[0] + c[1] * LUMA[1] + c[2] * LUMA[2];
const tempMul = t => { const m = [1 + .22 * t, 1, 1 - .22 * t]; const l = lumOf(m); return m.map(v => v / l); };

// 遺伝子 → 実際の数値
function decode(z) {
  z = padZ(z);
  const G = k => z[idx[k]];
  const two = k => (G(k) - .5) * 2;
  const off = v => (v - .5) * .24;
  const m = [G('black') * .22, .25 + off(G('mS')), .5 + off(G('mM')), .75 + off(G('mH')), 1 - G('white') * .22];
  const ch = c => {
    const s = off(G(c + 'S')), mi = off(G(c + 'M')), h = off(G(c + 'H'));
    const y = [m[0] + s * .6, m[1] + s, m[2] + mi, m[3] + h, m[4] + h * .6].map(v => clamp(v, 0, 1));
    for (let i = 1; i < 5; i++) y[i] = Math.max(y[i], y[i - 1] + .004);
    return y.map(v => Math.min(v, 1));
  };
  const tintZ = G('bTint');
  const tint = tintZ >= .5
    ? [1, 1 - (tintZ - .5) * .8, 1 - (tintZ - .5) * 1.3]
    : [1 - (.5 - tintZ) * .6, 1 - (.5 - tintZ) * .3, 1];
  // ホワイトバランス（光の色で掛け算、明るさは保つ）
  const wt = two('wbTemp'), wn = two('wbTint');
  let wb = [1 + .22 * wt, (1 - .14 * wn), 1 - .22 * wt]; { const l = lumOf(wb); wb = wb.map(v => v / l); }
  // 色ごと（色相のずれ[回転の割合]・彩度の倍率・明るさ）
  const hsl = [];
  for (let i = 0; i < 8; i++) {
    const sz = G('h' + i + 'S');
    hsl.push(two('h' + i + 'H') * 30 / 360, sz < .5 ? sz * 2 : 1 + (sz - .5) * 2, two('h' + i + 'L'));
  }
  // カラーグレーディング（影・中間・光に色を足す）
  const grade = [];
  for (const [hk, sk] of [['gsH', 'gsS'], ['gmH', 'gmS'], ['ghH', 'ghS']]) {
    const c = hsv2rgb(G(hk), 1, 1), l = lumOf(c), s = G(sk) * .2;
    grade.push((c[0] - l) * s, (c[1] - l) * s, (c[2] - l) * s);
  }
  return {
    curves: [ch('r'), ch('g'), ch('b')],
    sat: .25 + G('sat') * 1.25,
    gains: [0, 1, 2, 3, 4, 5].map(i => Math.pow(2, (G('f' + i) - .5) * 2 * (i === 0 ? 1.1 : 1.3))),
    bloom: G('bloom') * 3, bThr: .9 - G('bThr') * .55, bSpr: .45 + G('bSpr') * .43, tint,
    vig: G('vig') * .6, haze: G('haze') * .7, eBlur: G('eBlur'), eRad: .3 + G('eRad') * .6,
    grain: G('grain') * .14, gSize: 1 + G('gSize') * 2,
    wb, sh: [two('shadows'), two('highlights')], vib: two('vibrance'), hsl, grade,
    gd: [.3 + G('gdPos') * .6, .04 + G('gdFeather') * .4, two('gdExpo') * 1.5, two('gdAngle') * .45],
    gdTemp: tempMul(two('gdTemp')), hal: G('halation') * 1.5,
  };
}

/* ---------- レンズ（位置で決まる部分的な効果）：ピント・プリズム・光の玉 ---------- */
const ORB0 = [[.72, .28], [.25, .5], [.62, .78], [.45, .62]];
const LENS = [
  { k:'fX', g:'focus', n:.5, label:'ピント 横' }, { k:'fY', g:'focus', n:.5, label:'ピント 縦' },

  { k:'pA', g:'prism', n:.25, cyc:true, label:'ずらす向き' }, { k:'pD', g:'prism', n:.3, label:'ずれ幅' },
  { k:'pS', g:'prism', n:0, label:'強さ' }, { k:'pB', g:'prism', n:.5, label:'ぼかし' },
  { k:'pMA', g:'prism', n:0, cyc:true, label:'出る側' }, { k:'pMP', g:'prism', n:.5, label:'出る範囲' }, { k:'pMF', g:'prism', n:.5, label:'境目の幅' },
  { k:'pH', g:'prism', n:.08, cyc:true, label:'色' }, { k:'pC', g:'prism', n:0, label:'色の濃さ' },
  ...[0, 1, 2, 3].flatMap(i => [
    { k:'o' + i + 'X', g:'orb' + i, n:ORB0[i][0], label:'横' }, { k:'o' + i + 'Y', g:'orb' + i, n:ORB0[i][1], label:'縦' },
    { k:'o' + i + 'R', g:'orb' + i, n:.3, label:'大きさ' }, { k:'o' + i + 'F', g:'orb' + i, n:.5, label:'ふちのぼかし' },
    { k:'o' + i + 'S', g:'orb' + i, n:0, label:'光る' }, { k:'o' + i + 'T', g:'orb' + i, n:0, label:'色をかける' }, { k:'o' + i + 'V', g:'orb' + i, n:0, label:'かすむ' },
    { k:'o' + i + 'H', g:'orb' + i, n:.07, cyc:true, label:'色' }, { k:'o' + i + 'C', g:'orb' + i, n:.8, label:'色の濃さ' },
  ]),

const LN = LENS.length, LENS0 = LENS.map(l => l.n), lidx = Object.fromEntries(LENS.map((l, i) => [l.k, i]));
function lensUniforms(U, L, aspect) {
  if (!L) { gl.uniform2f(U.uFoc2, 0, 1); gl.uniform4f(U.uPr, 0, 0, 0, 0); gl.uniform3fv(U.uOrbK, new Float32Array(12)); return; }
  const G = k => L[lidx[k]];
  gl.uniform4f(U.uFoc, G('fX'), G('fY'), .03 + G('fR') * .7, .02 + G('fF') * .6);
  gl.uniform2f(U.uFoc2, G('fA'), Math.pow(2, (G('fE') - .5) * 2));
  const a = G('pA') * Math.PI * 2, d = G('pD') * .12;
  gl.uniform4f(U.uPr, Math.cos(a) * d / aspect, Math.sin(a) * d, G('pS') * 1.5, G('pB'));
  gl.uniform4f(U.uPrM, G('pMA') * Math.PI * 2, (G('pMP') - .5) * 1.4, .02 + G('pMF') * .5, 0);
  const hc = hsv2rgb(G('pH'), 1, 1), pc = G('pC');
  gl.uniform3f(U.uPrT, 1 + (hc[0] - 1) * pc, 1 + (hc[1] - 1) * pc, 1 + (hc[2] - 1) * pc);
  const A = [], B = [], K = [];
  for (let i = 0; i < 4; i++) {
    const o = k => G('o' + i + k), col = hsv2rgb(o('H'), o('C'), 1);
    A.push(o('X'), o('Y'), .02 + o('R') * .5, 4 - o('F') * 3); B.push(col[0], col[1], col[2], 0); K.push(o('S') * 1.3, o('V'), o('T') * 1.2);
  }
  gl.uniform4fv(U.uOrbA, A); gl.uniform4fv(U.uOrbB, B); gl.uniform3fv(U.uOrbK, K);
}

// 単調な3次補間で256段のLUTを作る
const LUTDATA = new Uint8Array(256 * 4);
function buildLUT(curves) {
  const xs = [0, .25, .5, .75, 1];
  for (let c = 0; c < 3; c++) {
    const y = curves[c], n = 5, d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (xs[i + 1] - xs[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    for (let k = 0; k < 256; k++) {
      const x = k / 255; let i = Math.min(3, Math.floor(x * 4));
      const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h;
      const h00 = 2*t*t*t - 3*t*t + 1, h10 = t*t*t - 2*t*t + t, h01 = -2*t*t*t + 3*t*t, h11 = t*t*t - t*t;
      const v = h00 * y[i] + h10 * h * m[i] + h01 * y[i + 1] + h11 * h * m[i + 1];
      LUTDATA[k * 4 + c] = Math.round(clamp(v, 0, 1) * 255);
    }
  }
  for (let k = 0; k < 256; k++) LUTDATA[k * 4 + 3] = 255;
}

const canvas = $('#c');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:true, depth:false, stencil:false, premultipliedAlpha:false, preserveDrawingBuffer:false });

const VS = `#version 300 es
layout(location=0) in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*.5+.5; gl_Position = vec4(aPos,0.,1.); }`;
const HEAD = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
const vec3 LUMA = vec3(.2126,.7152,.0722);

const TENT = `
vec3 tent(sampler2D t, vec2 uv, vec2 tx){
  vec4 d = vec4(1.,1.,-1.,0.)*tx.xyxy;
  vec3 s = texture(t, uv - d.xy).rgb + texture(t, uv - d.zy).rgb + texture(t, uv + d.zy).rgb + texture(t, uv + d.xy).rgb;
  s += (texture(t, uv - d.wy).rgb + texture(t, uv + d.zw).rgb + texture(t, uv + d.xw).rgb + texture(t, uv + d.wy).rgb)*2.;
  s += texture(t, uv).rgb*4.;
  return s/16.;
}`;
const SRC_UV = `uniform vec4 uSrcCrop; uniform float uSrcMir;
vec2 srcUv(vec2 uv){ if(uSrcMir > .5) uv.x = 1. - uv.x; return uSrcCrop.xy + uv*uSrcCrop.zw; }`;
const FS_SRC = HEAD + SRC_UV + `uniform sampler2D uImg; void main(){ o = vec4(texture(uImg, srcUv(vUv)).rgb, 1.); }`;
const FS_DOWN = HEAD + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 s = texture(uTex, vUv)*4.;
  s += texture(uTex, vUv - uTexel); s += texture(uTex, vUv + uTexel);
  s += texture(uTex, vUv + vec2(uTexel.x,-uTexel.y)); s += texture(uTex, vUv + vec2(-uTexel.x, uTexel.y));
  o = s/8.;
}`;
const FS_REC = HEAD + TENT + `
uniform sampler2D uG, uGc, uRc; uniform vec2 uTc; uniform float uGain;
void main(){
  vec3 g = texture(uG, vUv).rgb;
  o = vec4(tent(uRc, vUv, uTc) + uGain*(g - tent(uGc, vUv, uTc)), 1.);
}`;
const FS_PRE = HEAD + `
uniform sampler2D uTex; uniform vec2 uTx; uniform float uThr, uEnc;
vec3 lin(vec3 c){ return pow(max(c, 0.), vec3(2.2)); }
void main(){
  vec2 d = uTx*.5;
  vec3 c = (lin(texture(uTex, vUv + vec2(-d.x,-d.y)).rgb) + lin(texture(uTex, vUv + vec2(d.x,-d.y)).rgb)
          + lin(texture(uTex, vUv + vec2(-d.x, d.y)).rgb) + lin(texture(uTex, vUv + vec2(d.x, d.y)).rgb))*.25;
  float br = max(c.r, max(c.g, c.b));
  float knee = uThr*.5 + 1e-4;
  float soft = clamp(br - uThr + knee, 0., 2.*knee); soft = soft*soft/(4.*knee);
  float k = max(soft, br - uThr)/max(br, 1e-4);
  o = vec4(c*k*(1. + 2.*smoothstep(.75, .98, br))*uEnc, 1.);
}`;
const FS_UP = HEAD + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 d = vec4(1.,1.,-1.,0.)*uTexel.xyxy;
  vec4 s = texture(uTex, vUv - d.xy) + texture(uTex, vUv - d.zy) + texture(uTex, vUv + d.zy) + texture(uTex, vUv + d.xy);
  s += (texture(uTex, vUv - d.wy) + texture(uTex, vUv + d.zw) + texture(uTex, vUv + d.xw) + texture(uTex, vUv + d.wy))*2.;
  s += texture(uTex, vUv)*4.;
  o = s/16.;
}`;
const FS_COMP = HEAD + TENT + SRC_UV + `
uniform sampler2D uR0, uLow, uBloom, uLut, uImg, uLoc;
uniform vec2 uLowTx, uLocTx;
uniform float uBypass, uAspect, uEnc, uBloomAmt, uSat, uVig, uHaze, uEBlur, uERad, uGrain, uGSize, uSeed;
uniform vec3 uTint;
uniform vec3 uWB; uniform vec2 uSH; uniform float uVib, uHal;
uniform vec3 uHsl[8];
uniform vec3 uGrade[3];
uniform vec4 uGd; uniform vec3 uGdTemp;
uniform float uLkOn, uLkSpr;
uniform vec4 uLk1, uLk2, uLkS, uLkC;
uniform vec3 uLkCore, uLkOuter;
uniform vec2 uLkN1;
uniform sampler2D uL5; uniform vec2 uL5Tx;
uniform vec4 uFoc; uniform vec2 uFoc2;
uniform vec4 uPr, uPrM; uniform vec3 uPrT;
uniform vec4 uOrbA[4], uOrbB[4]; uniform vec3 uOrbK[4];
const float HC[9] = float[9](0., 30./360., 60./360., 120./360., 180./360., 240./360., 280./360., 320./360., 1.);
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y); }
float fbm(vec2 p){ return .5*vnoise(p) + .25*vnoise(p*2.1 + 3.7) + .125*vnoise(p*4.3 + 1.3) + .125*vnoise(p*8.7 + 9.1); }
vec3 rgb2hsv(vec3 c){
  vec4 K = vec4(0., -1./3., 2./3., -1.);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  return vec3(abs(q.z + (q.w - q.y)/(6.*d + 1e-10)), d/(q.x + 1e-10), q.x);
}
vec3 hsv2rgb(vec3 c){ vec4 K = vec4(1., 2./3., 1./3., 3.); vec3 p = abs(fract(c.xxx + K.xyz)*6. - K.www); return c.z*mix(K.xxx, clamp(p - K.xxx, 0., 1.), c.y); }
// 色ごとの調整：色相環の8色の間をなめらかにつなぐ（灰色には効かない）
vec3 applyHsl(vec3 c){
  vec3 hsv = rgb2hsv(clamp(c, 0., 1.));
  int i = 0; for(int k = 1; k < 8; k++){ if(hsv.x >= HC[k]) i = k; }
  float t = clamp((hsv.x - HC[i])/(HC[i + 1] - HC[i]), 0., 1.);
  int j = i == 7 ? 0 : i + 1;
  vec3 adj = mix(uHsl[i], uHsl[j], t);
  float sf = smoothstep(.04, .22, hsv.y)*smoothstep(.02, .12, hsv.z);
  hsv.x = fract(hsv.x + adj.x*sf + 1.);
  hsv.y = clamp(hsv.y*mix(1., adj.y, sf), 0., 1.);
  vec3 r = hsv2rgb(hsv);
  return r*(1. + adj.z*.45*sf);
}
float leakMask(vec2 q, vec4 bd, out vec2 la){
  vec2 B = bd.xy, Dv = bd.zw, Pv = vec2(-Dv.y, Dv.x);
  vec2 r = q - B;
  r += (vec2(fbm(q*2.7 + B*7.), fbm(q*2.9 - B*5.)) - .5)*uLkC.z*.4;
  float along = dot(r, Dv), across = dot(r, Pv);

  float br = L*.55; vec2 cc = Dv*L*.2;

  return s < .5 ? mix(blob, streak, s*2.) : mix(streak, fall, (s - .5)*2.);

vec4 leakLight(vec2 uv){
  vec2 q = vec2(uv.x*uAspect, uv.y), la1, la2;
  float m1 = leakMask(q, uLk1, la1);
  float m2 = uLkS.w > .001 ? leakMask(q, uLk2, la2)*uLkS.w : 0.;
  float m = clamp(max(m1, m2) + min(m1, m2)*.5, 0., 1.6);
  vec3 col = mix(uLkOuter, uLkCore, smoothstep(.2, 1., m));
  vec3 light = col*m*uLkC.x;
  if(uLkSpr > .001){
    vec2 r = q - uLk1.xy, N = uLkN1, T = vec2(-N.y, N.x);
    float a = dot(r, N), b = dot(r, T);

vec3 tonemap(vec3 x){
  float m = max(x.r, max(x.g, x.b));

void main(){
  if(uBypass > .5){ o = vec4(texture(uImg, srcUv(vUv)).rgb, 1.); return; }
  vec3 c = texture(uR0, vUv).rgb;
  vec2 q = (vUv - .5)*2.;
  float e = smoothstep(uERad, uERad + .75, length(q));
  vec3 lowc = tent(uLow, vUv, uLowTx);
  c = mix(c, lowc, e*uEBlur);
  if(uFoc2.x > .001){
    // ピント：くっきりの場所から離れるほど強くぼかす（荒さ3段を混ぜる）
    vec2 fd = vUv - uFoc.xy; fd.x *= uAspect/uFoc2.y;
    float fm = smoothstep(uFoc.z, uFoc.z + uFoc.w, length(fd))*uFoc2.x*3.;

  vec3 lin = pow(max(c, 0.), vec3(2.2));

  lin *= uWB;
  // シャドウ・ハイライト（まわりの明るさで効き方を変える）
  float Lloc = dot(pow(max(tent(uLoc, vUv, uLocTx), 0.), vec3(2.2)), LUMA);

// どこがくっきり残っているか（細かい模様の残り具合）からピントの場所を決める

    const r = Math.min(1.5, dT[i] / dB[i]); rs += r; rn++;

  }
  const o = v.slice(); if (!rn || !sw) return o;
  const mr = rs / rn;
  o[lp('fX')] = r4((sx / sw + .5) / w); o[lp('fY')] = r4(1 - (sy / sw + .5) / h);
  o[lp('fA')] = r4(clamp((1 - mr) * 1.2, 0, 1)); o[lp('fR')] = .25;

}
async function autoFit() {
  if (fitting) { fitting.stop = true; return; }

  const btn = $('#fitBtn'); btn.classList.add('on'); $('#fitTxt').textContent = '中止';
  const before = pairLoss(V);

  pushUndo();
  let v = await cd(V, GLOBAL_IDS, 900, prog(0));
  if (!fitting.stop) { v = seedPrism(seedFocus(seedOrbs(v))); v = await cd(v, [...GLOBAL_IDS, ...LENS_IDS], 1600, prog(.5)); }
  const stopped = fitting.stop; fitting = null;

$('#fitBtn').addEventListener('click', autoFit);

/* =====================================================================
   記録（今の値を残す）・保存・書き出し
   ===================================================================== */
function thumb() {

}
let delArmed = null;
function renderSnaps() {

    const b = document.createElement('button'); b.className = 'fav'; b.style.backgroundImage = `url(${s.thumb})`;
    b.innerHTML = `<span>${s.id}</span><i class="del${delArmed === s.id ? ' sure' : ''}">${delArmed === s.id ? '消す' : '✕'}</i>`;

$('#snapBtn').addEventListener('click', () => { if (!imgTex) return; snaps.push({ id: snapId++, V: V.slice(), thumb: thumb(), t: Date.now() }); persist(); renderSnaps(); toast('記録' + (snapId - 1)); });
const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };

  download(blob, name);
}
$('#saveBtn').addEventListener('click', async () => {
  if (!imgTex) return;
  const s = Math.min(1, 3000 / Math.max(imgW, imgH)), w = Math.round(imgW * s), h = Math.round(imgH * s);
  srcTex = null; const c = renderToCanvas(Zof(V), w, h, 3, false, Lof(V)); need = true;
  shareOrSave(await new Promise(r => c.toBlob(r, 'image/jpeg', .93)), `img_${Date.now()}.jpg`, 'image/jpeg');
});
const exportData = () => ({ app: 'prismcam', v: 1, keys: PDEF.map(p => p.k), V, snaps: snaps.map(s => ({ id: s.id, V: s.V, t: s.t })) });
$('#expBtn').addEventListener('click', () => download(new Blob([JSON.stringify(exportData())], { type: 'application/json' }), 'prism-data.json'));
$('#impBtn').addEventListener('click', () => $('#impFile').click());
$('#impFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (!d.V || d.V.length !== NP) throw 0;
    pushUndo(); V = d.V; if (d.snaps) { snaps = d.snaps.map(s => ({ ...s, thumb: '' })); snapId = snaps.reduce((m, x) => Math.max(m, x.id), 0) + 1; snaps.forEach(s => { const k = V; V = s.V; s.thumb = imgTex ? thumb() : ''; V = k; }); }
    changed(true); renderSnaps(); toast('読み込みました');
  } catch (err) { toast('読み込めませんでした'); }
});
let resetArmed = false;
$('#resetBtn').addEventListener('click', () => {
  const b = $('#resetBtn');
  if (!resetArmed) { resetArmed = true; b.classList.add('sure'); b.textContent = 'もう一度'; setTimeout(() => { resetArmed = false; b.classList.remove('sure'); b.textContent = '最初から'; }, 2500); return; }
  resetArmed = false; b.classList.remove('sure'); b.textContent = '最初から';
  pushUndo(); V = PN.slice(); changed(true);
});

/* =====================================================================
   カメラ（今の値をそのまま）・フォルダ
   ===================================================================== */
let camOpen = false;
const cam = { stream: null, facing: 'environment', mirror: false, video: document.createElement('video'), tex: null, set: null, sel: 'now' };
cam.video.playsInline = true; cam.video.muted = true; cam.video.setAttribute('playsinline', '');
const camV = () => cam.sel === 'now' ? V : (snaps.find(s => s.id === cam.sel) || { V }).V;
function buildCamChips() {
  const box = $('#camChips'); box.innerHTML = '';
  const add = (key, label, th) => { const b = document.createElement('button'); b.className = 'cchip' + (cam.sel === key ? ' on' : ''); b.innerHTML = `<i style="background-image:url(${th || ''})"></i>${label}`; b.addEventListener('click', () => { cam.sel = key; buildCamChips(); }); box.appendChild(b); };
  add('now', 'いま', imgTex ? thumb() : '');
  snaps.slice().reverse().forEach(s => add(s.id, '記録' + s.id, s.thumb));
}
async function startCam() {
  if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
  cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: cam.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  cam.video.srcObject = cam.stream; await cam.video.play();
  const st = cam.stream.getVideoTracks()[0].getSettings ? cam.stream.getVideoTracks()[0].getSettings() : {};
  cam.mirror = st.facingMode ? st.facingMode === 'user' : cam.facing === 'user';
}
async function openCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('カメラが使えません'); return; }
  $('#cam').classList.add('open'); camOpen = true; $('#camMsg').textContent = '';
  $('#camView').appendChild(canvas); canvas.style.width = '100%'; canvas.style.height = '100%';
  buildCamChips(); updThumb();
  try { await startCam(); }
  catch (e) { $('#camMsg').textContent = !window.isSecureContext ? 'https で開いてください' : (e && e.name === 'NotAllowedError') ? 'カメラが許可されていません' : 'カメラを起動できませんでした'; }
}
function closeCam() {
  camOpen = false; $('#cam').classList.remove('open');
  if (cam.stream) { cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
  srcTex = null; srcCrop = [0, 0, 1, 1]; srcMirror = 0;
  $('#viewIn').insertBefore(canvas, $('#ov')); freeSet(cam.set); cam.set = null; layout();
}
const coverCrop = (vw, vh, ca) => { const va = vw / vh; if (va > ca) { const s = ca / va; return [(1 - s) / 2, 0, s, 1]; } const s = va / ca; return [0, (1 - s) / 2, 1, s]; };

  gl.bindTexture(gl.TEXTURE_2D, cam.tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

}

}
async function camShoot() {

  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .92));

}
async function updThumb() { try { const a = await dbAll('photos'); a.sort((x, y) => y.rec.t - x.rec.t); $('#camThumb').style.backgroundImage = a[0] ? `url(${a[0].thumb})` : ''; } catch (e) {} }
$('#camBtn').addEventListener('click', openCam);
$('#camClose').addEventListener('click', closeCam);
$('#camShutter').addEventListener('click', camShoot);
$('#camFlip').addEventListener('click', async () => { cam.facing = cam.facing === 'environment' ? 'user' : 'environment'; try { await startCam(); } catch (e) { toast('切り替えられませんでした'); } });
$('#camThumb').addEventListener('click', openFolder);
$('#foldBtn').addEventListener('click', openFolder);
$$('[data-close]').forEach(b => b.addEventListener('click', () => $('#' + b.dataset.close).classList.remove('open')));

let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('prismcam', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('img'); d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

}

const dbDel = (n, k) => dbTx(n, 'readwrite', s => s.delete(k));
let curP = null, curU = null;
async function openFolder() {
  $('#folder').classList.add('open');
  let ps = []; try { ps = (await dbAll('photos')).sort((a, b) => b.rec.t - a.rec.t); } catch (e) {}

  const g = $('#fgrid'); g.innerHTML = '';

}

  const d = new Date(p.rec.t); $('#pinfo').textContent = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  $('#pDel').classList.remove('sure'); $('#pDel').textContent = '削除'; $('#photo').classList.add('open');
}
$('#pDel').addEventListener('click', async () => { const b = $('#pDel'); if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'もう一度'; return; } await dbDel('photos', curP.id); $('#photo').classList.remove('open'); openFolder(); updThumb(); });
$('#pShare').addEventListener('click', () => { if (curP) shareOrSave(curP.blob, `img_${curP.rec.t}.jpg`, 'image/jpeg'); });

/* ---------- ループと起動 ---------- */
function frame() {
  requestAnimationFrame(frame);
  if (camOpen) { camFrame(); return; }
  if (need) { need = false; renderView(); }
}
window.addEventListener('unhandledrejection', e => console.error('UNHANDLED', e.reason && (e.reason.stack || e.reason)));
(async function boot() {

  try { const t = await dbGet('img', 'target'); if (t) setTarget(await blobImg(t)); } catch (e) {}
  if (!imgTex) $('#noImg').hidden = false;
  score();
})();
window.__p = { buildGroups, get V() { return V; }, set V(v) { V = v; changed(); }, setBefore, setTarget, pairLoss, autoFit, get fitting() { return fitting; }, PDEF, lidx, D, LN, renderToCanvas, Zof, Lof, seedOrbs, seedFocus, seedPrism, score, get mode() { return mode; } };

})();
