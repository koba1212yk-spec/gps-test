<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f8ecdf">
<title>メモ</title>
<style>
:root{
  --ink:#4a3426; --ink2:#8d6d58; --ink3:#b39883; --card:rgba(255,251,246,.8); --line:rgba(255,255,255,.85);
  --warm1:#f7b26e; --warm2:#ec7f45; --bg:#f8ecdf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:none;-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}

header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 2px 6px}
.hbtns{display:flex;gap:6px}
.pill{height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.75);font-size:12.5px;font-weight:700;box-shadow:0 2px 10px rgba(120,70,30,.1)}
.pill:active{transform:scale(.96)}

.lead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 8px;font-size:12px;color:var(--ink2)}
.lead b{font-size:13px;color:var(--ink)}
#gridBox{position:relative;display:flex;justify-content:center}
#gridIn{position:relative;transition:opacity .16s}
#gridIn.fade{opacity:.25}
#c{display:block}
.tile{position:absolute;padding:0;background:transparent;border-radius:12px;box-shadow:0 0 0 4px var(--bg);
  -webkit-touch-callout:none;touch-action:manipulation;transition:transform .12s}
.tile::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 0 rgba(236,127,69,0);transition:box-shadow .15s}
.tile.picked::after{box-shadow:inset 0 0 0 4px #ec7f45}
.tile:active{transform:scale(.985)}
.tile .rk{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:15px;display:none;place-items:center;
  background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff;font-size:15px;font-weight:900;box-shadow:0 3px 10px rgba(200,100,40,.4)}
.tile.ranked .rk{display:grid}
.tile.ranked::after{box-shadow:inset 0 0 0 3px #ec7f45}
.tile.last .rk{background:#b39883;box-shadow:none}
.tile.last::after{box-shadow:inset 0 0 0 3px #b39883}
.leadR{display:flex;align-items:center;gap:8px;flex:none}
.lead b{white-space:nowrap}
#topOnly{white-space:nowrap;height:26px;padding:0 10px;border-radius:13px;background:#fff;font-size:11.5px;font-weight:800;color:#d8692e;box-shadow:0 2px 8px rgba(120,70,30,.12)}
#topOnly[hidden]{display:none}

.tools{display:flex;gap:8px;margin-top:12px}
.tool{flex:1;height:46px;border-radius:23px;background:#fff;font-size:13.5px;font-weight:800;box-shadow:0 3px 12px rgba(120,70,30,.1)}
.tool.like{background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff;box-shadow:0 8px 20px rgba(236,127,69,.32)}
.tool:disabled{opacity:.4}
.tool:active{transform:scale(.97)}
#dna{display:block;width:100%;height:26px;margin-top:10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:12px;box-shadow:0 6px 24px rgba(120,70,30,.08)}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--ink2);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:600;letter-spacing:.02em;color:var(--ink3)}
.favs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{position:relative;flex:none;width:66px;height:66px;border-radius:14px;background:#ddd center/cover no-repeat;box-shadow:0 3px 10px rgba(120,70,30,.15)}
.fav span{position:absolute;left:4px;bottom:4px;padding:1px 6px;border-radius:8px;background:rgba(255,250,244,.85);font-size:10px;font-weight:800}
.fav .del{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;font-size:11px;font-weight:900;color:#b4462c;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18);font-style:normal}
.fav .del.sure{background:#b4462c;color:#fff}
.empty{font-size:12px;color:var(--ink3);padding:6px 2px}
.stats{font-size:12px;color:var(--ink2);line-height:1.8}
.stats b{color:var(--ink)}
.range{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);margin-top:2px}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(120,80,50,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#f8cfa2,#ee8a4a);transition:width .3s}
.subacts{display:flex;gap:8px;margin-top:10px}
.subacts button{flex:1;height:38px;border-radius:19px;background:#fff;font-size:12.5px;font-weight:800;box-shadow:0 3px 10px rgba(120,70,30,.1)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:10.5px;color:var(--ink3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:0}

#big{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));background:rgba(248,236,223,.94);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#big.open{display:flex}
#bigImg{position:relative;max-width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#bigImg{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#bigImg canvas{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 14px 40px rgba(120,70,30,.25)}
.bbtns{display:flex;gap:8px;width:100%;max-width:460px}
.bbtns button{flex:1;height:48px;border-radius:24px;background:#fff;font-size:14px;font-weight:800;box-shadow:0 3px 12px rgba(120,70,30,.12);
  -webkit-touch-callout:none}
.bbtns .main{background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  padding:10px 18px;border-radius:20px;background:rgba(74,52,38,.92);color:#fff;font-size:13px;font-weight:700;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;white-space:normal;max-width:88vw;width:max-content;text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
input[type=file]{display:none}
.tools.sub2{margin-top:10px}
.tool.soft{height:38px;font-size:12.5px;background:rgba(255,255,255,.6);color:var(--ink2);box-shadow:none;border:1px solid rgba(120,80,50,.12)}

.viewBtn{height:26px;padding:0 10px;border-radius:13px;background:#fff;font-size:11.5px;font-weight:800;color:var(--ink2);box-shadow:0 2px 8px rgba(120,70,30,.12);white-space:nowrap}
.tool.cam{flex:1.6;background:linear-gradient(135deg,#6b4a36,#4a3426);color:#fff;box-shadow:0 8px 20px rgba(74,52,38,.28)}
#gridBox.list{overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;border-radius:12px;scrollbar-width:none}
#gridBox.list::-webkit-scrollbar{display:none}
#gridBox.list .tile{scroll-snap-align:start}
.tile .pg{position:absolute;right:8px;bottom:8px;padding:2px 8px;border-radius:10px;background:rgba(255,250,244,.85);font-size:11px;font-weight:800;display:none}
#gridBox.list .tile .pg{display:block}
.ovl{position:fixed;inset:0;z-index:40;display:none}
.ovl.open{display:flex}
.sheet{flex-direction:column;background:rgba(248,236,223,.97);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding:calc(10px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom)}
.shead{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px;font-size:16px}
.shead small{font-size:12px;color:var(--ink3);font-weight:700}
.x{width:36px;height:36px;border-radius:18px;background:#fff;font-weight:900;box-shadow:0 2px 8px rgba(120,70,30,.12)}
.sbody{flex:1;overflow-y:auto;padding:0 14px 30px}
.sbody details{background:#fff;border-radius:16px;margin-bottom:10px;padding:2px 14px;box-shadow:0 3px 12px rgba(120,70,30,.07)}
.sbody summary{font-size:14px;font-weight:800;padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.sbody summary::after{content:"＋";color:#d8692e}
.sbody details[open] summary::after{content:"－"}
.sbody summary::-webkit-details-marker{display:none}
.sbody ol,.sbody ul{margin:0 0 10px;padding-left:20px;font-size:13px;line-height:1.75;color:var(--ink)}
.sbody li{margin-bottom:4px}
.sbody p{font-size:12.5px;line-height:1.7;color:var(--ink2);margin:0 0 12px}
.camO{background:#120d0a;flex-direction:column}
#camView{position:absolute;inset:0;display:grid;place-items:center}
#camView canvas{width:100%;height:100%;display:block}
.camTop{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;padding:0 10px}
.cbtn{flex:none;width:40px;height:40px;border-radius:20px;background:rgba(255,250,244,.78);font-size:16px;font-weight:900;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.cbtn.wide{width:auto;padding:0 14px;font-size:13px}
.cbtn.off{opacity:.5}
.camChips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.camChips::-webkit-scrollbar{display:none}
.cchip{flex:none;height:40px;display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;border-radius:20px;background:rgba(255,250,244,.7);
  font-size:12px;font-weight:800;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.cchip i{width:32px;height:32px;border-radius:16px;background:#ccc center/cover}
.cchip.on{background:#fff;box-shadow:0 0 0 2px #ec7f45}
.camBottom{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;padding:0 26px}
#camThumb{width:52px;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.2) center/cover}
#camShutter{width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35);position:relative}
#camShutter::after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fffaf0,#ffd6a6 45%,#f4a062 80%,#ee8a4a)}
#camShutter:active{transform:scale(.93)}
#camFlash{position:absolute;inset:0;background:#fff8ef;opacity:0;pointer-events:none}
#camFlash.go{animation:camflash .45s ease-out}
@keyframes camflash{0%{opacity:.85}100%{opacity:0}}
.camMsg{position:absolute;left:50%;top:45%;transform:translateX(-50%);color:#fff;font-size:14px;font-weight:700;text-align:center;max-width:80%;line-height:1.6}
.fbar{padding:0 16px 10px;display:flex;gap:8px}
.fbar button{height:38px;padding:0 16px;border-radius:19px;background:#fff;font-size:12.5px;font-weight:800;box-shadow:0 3px 10px rgba(120,70,30,.1)}
.fgrid{flex:1;overflow-y:auto;padding:0 12px 30px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.fgrid button{aspect-ratio:3/4;border-radius:10px;background:#ddd center/cover;padding:0}
.fgrid .empty{grid-column:1/-1}
.photoO{flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(248,236,223,.97);padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
.photoO img{max-width:100%;flex:1;min-height:0;object-fit:contain;border-radius:14px;-webkit-touch-callout:default}
.pinfo{font-size:11.5px;color:var(--ink2)}
.photoO .bbtns button.sure{background:#b4462c;color:#fff}

.baseRow{display:flex;align-items:center;gap:10px;margin:-2px 2px 10px;font-size:12px;font-weight:800;color:var(--ink2)}
.baseRow[hidden]{display:none}
.seg2{flex:1;display:flex;padding:3px;border-radius:16px;background:rgba(255,255,255,.6);gap:2px}
.seg2 button{flex:1;height:28px;border-radius:13px;background:transparent;font-size:12px;font-weight:800;color:var(--ink2)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(150,90,40,.15)}
#mapCard[hidden]{display:none}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mapBox{min-width:0}
.mapBox.wide{margin-top:12px}
.mapT{font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mapT select{font:inherit;font-size:11.5px;font-weight:800;color:var(--ink);border:none;border-radius:10px;padding:3px 6px;background:#fff;box-shadow:0 2px 6px rgba(120,70,30,.1)}
#posMap,#colMap{width:100%;aspect-ratio:1;display:block;touch-action:none;border-radius:12px}
#pairMap{width:100%;aspect-ratio:2/1;display:block;touch-action:none;border-radius:12px}

.stage{display:flex;padding:3px;border-radius:18px;background:rgba(255,255,255,.6);gap:2px;margin:0 0 10px}
.stage button{flex:1;height:32px;border-radius:15px;background:transparent;font-size:12.5px;font-weight:800;color:var(--ink2)}
.stage button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(150,90,40,.15)}
.rank{font-size:12px;color:var(--ink2);margin:-2px 0 8px;line-height:1.6}
.rank b{color:#d8692e}
.krow{display:grid;grid-template-columns:100px 1fr 40px;align-items:center;gap:8px;height:42px}
.kname{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;background:none;padding:0;text-align:left;color:var(--ink)}
.kname svg{width:13px;height:13px;flex:none;opacity:.28;transition:opacity .2s}
.krow.locked .kname svg{opacity:1}
.krow.locked .kname{color:#d8692e}
.kcv{width:100%;height:36px;touch-action:none;display:block}
.kval{font-size:11px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}


header{gap:10px}
.crit{flex:0 0 150px}
#refBar{position:sticky;top:0;z-index:6;margin:0 -12px 8px;padding:6px 12px 8px;background:var(--bg);box-shadow:0 8px 14px -12px rgba(120,70,30,.35)}
#refBar[hidden],#refTools[hidden],#cmpCard[hidden],#gchips[hidden],#bwRow[hidden],#gridBox[hidden],#bwEmpty[hidden]{display:none}
.tstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tstrip::-webkit-scrollbar{display:none}
.tg{position:relative;flex:none;height:72px;border-radius:12px;background:#ddd center/cover no-repeat;box-shadow:0 3px 10px rgba(120,70,30,.18)}
.tg.add{width:52px;background:#fff;font-size:22px;font-weight:700;color:#d8692e}
.tg .del{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#fff;font-size:10.5px;font-weight:900;color:#b4462c;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18);font-style:normal}
.tg .del.sure{background:#b4462c;color:#fff}
.rt{margin:0 0 10px}
#fitBtn{position:relative;overflow:hidden}
#fitBtn i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#f8cfa2,#ee8a4a);opacity:.55;transition:width .2s}
#fitBtn span{position:relative}
#fitBtn.run{color:#b4462c}
#simTxt b{color:#d8692e;font-size:14px}
.bwEmpty{height:180px;display:grid;place-items:center;border-radius:16px;border:2px dashed rgba(180,130,90,.35);color:var(--ink3);font-size:15px;font-weight:800}
.fav.sel{box-shadow:0 0 0 3px #ec7f45,0 3px 10px rgba(120,70,30,.15)}
.fav em{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:10px;background:#ec7f45;color:#fff;font-size:11px;font-weight:900;font-style:normal;display:grid;place-items:center}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.gchips button{height:30px;padding:0 11px;border-radius:15px;background:rgba(255,255,255,.55);font-size:12px;font-weight:800;color:var(--ink3);display:flex;align-items:center;gap:5px;border:1px solid rgba(120,80,50,.1)}
.gchips button i{width:8px;height:8px;border-radius:3px;opacity:.45}
.gchips button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(150,90,40,.15)}
.gchips button.on i{opacity:1}
.kname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kname .gdot{width:6px;height:6px;border-radius:2px;flex:none}
.krow{grid-template-columns:112px 1fr 44px}
.simRow{display:flex;align-items:center;gap:14px;margin-bottom:10px}
#simNum{font-size:34px;font-weight:900;color:#d8692e;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.simParts{flex:1;display:grid;gap:4px}
.sp{display:grid;grid-template-columns:46px 1fr 26px;align-items:center;gap:6px;font-size:11px;color:var(--ink2);font-weight:700}
.sp b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
#histCv{width:100%;height:70px;display:block;background:#fff;border-radius:12px;margin-bottom:10px}
.scopes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.scopes canvas{width:100%;aspect-ratio:1;display:block}
.sws{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;align-items:start}
.tsw{display:grid;grid-template-columns:28px 1fr 1fr;gap:4px;align-items:center;font-size:11px;font-weight:800;color:var(--ink2);margin-bottom:4px}
.tsw i,.hsw i{display:block;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw8{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.hsw{display:grid;gap:4px}
.hsw i.none{background:transparent;box-shadow:inset 0 0 0 1px rgba(120,80,50,.2)}
.swh{display:grid;grid-template-columns:28px 1fr 1fr;gap:4px;font-size:10px;color:var(--ink3);font-weight:800;margin-bottom:4px}
#bigImg{gap:8px}
#bigImg.stack{flex-direction:column}
#bigImg .own,#bigImg .tgt{position:relative}
#bigImg canvas{border-radius:16px}
#bigImg canvas{display:block}
.zcO{background:#120d0a;flex-direction:column}
#zwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:calc(6px + env(safe-area-inset-top)) 4px 0}
#zwrap.land{flex-direction:row}
.zpane{position:relative;flex:1;min-height:0;min-width:0;border-radius:12px;overflow:hidden;background:#1d1714}
.zpane canvas{width:100%;height:100%;display:block;touch-action:none}
.ztag{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:9px;background:rgba(255,250,244,.8);font-size:11px;font-weight:800;pointer-events:none}
.zbar{display:flex;justify-content:center;gap:8px;padding:10px 10px calc(12px + env(safe-area-inset-bottom))}
.zbar .cbtn.on{background:#ffd6a6}
.tool:disabled{opacity:.35}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seg2 crit" id="critSeg"><button data-v="pref" class="on">好み</button><button data-v="ref">お手本</button></div>
    <div class="hbtns">
      <button class="pill" id="pickBtn">画像</button>
      <button class="pill" id="saveBtn">保存</button>
    </div>
  </header>
  <div id="refBar" hidden><div class="tstrip" id="tstrip"></div></div>

  <div class="stage" id="stageSeg"><button data-v="macro" class="on">ざっくり</button><button data-v="fine">細かく</button><button data-v="leak">光漏れ</button><button data-v="betw">★の間</button></div>
  <div class="baseRow" id="baseRow" hidden><span>ベース</span><div class="seg2" id="baseSeg"><button data-v="orig" class="on">元の画像</button><button data-v="grade">今の色補正</button></div></div>
  <div class="baseRow" id="bwRow" hidden><div class="seg2" id="bwSeg"><button data-v="box" class="on">いいとこ取り</button><button data-v="mix">混ぜる</button></div></div>
  <div class="tools rt" id="refTools" hidden>
    <button class="tool" id="fitBtn"><i id="fitBar"></i><span id="fitTxt">自動で寄せる</span></button>
    <button class="tool" id="cmpBtn">見比べる</button>
  </div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const toast = (t, ms = 1600) => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), ms); };
/* =====================================================================
   遺伝子（フィルターの設計図）: すべて 0〜1。n は「何もしない」値
   前半31個は以前と同じ並び。後半41個を追加（古いデータは中立で埋める）
   ===================================================================== */
const HUES8 = ['赤', '橙', '黄', '緑', '水色', '青', '紫', '赤紫'];
const HUE_CENTERS = [0, 30, 60, 120, 180, 240, 280, 320];
const GENES = [
  { k:'black', g:'tone', n:0,  label:'黒の浮き' },
  { k:'white', g:'tone', n:0,  label:'白の沈み' },
  { k:'mS',    g:'tone', n:.5, label:'暗部' },
  { k:'mM',    g:'tone', n:.5, label:'中間' },
  { k:'mH',    g:'tone', n:.5, label:'明部' },
  { k:'rS', g:'color', n:.5, label:'赤・暗部' }, { k:'rM', g:'color', n:.5, label:'赤・中間' }, { k:'rH', g:'color', n:.5, label:'赤・明部' },
  { k:'gS', g:'color', n:.5, label:'緑・暗部' }, { k:'gM', g:'color', n:.5, label:'緑・中間' }, { k:'gH', g:'color', n:.5, label:'緑・明部' },
  { k:'bS', g:'color', n:.5, label:'青・暗部' }, { k:'bM', g:'color', n:.5, label:'青・中間' }, { k:'bH', g:'color', n:.5, label:'青・明部' },
  { k:'sat',   g:'color', n:.6, label:'彩度' },
  { k:'f0', g:'tex', n:.5, label:'細かさ1' }, { k:'f1', g:'tex', n:.5, label:'細かさ2' }, { k:'f2', g:'tex', n:.5, label:'細かさ3' },
  { k:'f3', g:'tex', n:.5, label:'細かさ4' }, { k:'f4', g:'tex', n:.5, label:'細かさ5' }, { k:'f5', g:'tex', n:.5, label:'細かさ6' },
  { k:'bloom', g:'light', n:0, label:'滲み' }, { k:'bThr', g:'light', n:.5, label:'滲みの境目' },
  { k:'bSpr', g:'light', n:.5, label:'滲みの広がり' }, { k:'bTint', g:'light', n:.5, label:'滲みの色' },
  { k:'vig',   g:'place', n:0, label:'周辺減光' }, { k:'haze', g:'place', n:0, label:'端のかすみ' },
  { k:'eBlur', g:'place', n:0, label:'端のぼけ' }, { k:'eRad', g:'place', n:.5, label:'効き始め' },
  { k:'grain', g:'tex', n:0, label:'粒子' }, { k:'gSize', g:'tex', n:.3, label:'粒子の大きさ' },
  // ここから追加
  { k:'wbTemp', g:'color', n:.5, label:'色温度' }, { k:'wbTint', g:'color', n:.5, label:'色かぶり(WB)' },
  { k:'shadows', g:'tone', n:.5, label:'シャドウ' }, { k:'highlights', g:'tone', n:.5, label:'ハイライト' },
  { k:'vibrance', g:'color', n:.5, label:'自然な彩度' },
  ...HUES8.flatMap((h, i) => [
    { k:'h' + i + 'H', g:'hsl', n:.5, label:h + '・色相' },
    { k:'h' + i + 'S', g:'hsl', n:.5, label:h + '・彩度' },
    { k:'h' + i + 'L', g:'hsl', n:.5, label:h + '・明るさ' },
  ]),
  { k:'gsH', g:'grade', n:.55, cyc:true, label:'影の色' },  { k:'gsS', g:'grade', n:0, label:'影の強さ' },
  { k:'gmH', g:'grade', n:.1, cyc:true, label:'中間の色' }, { k:'gmS', g:'grade', n:0, label:'中間の強さ' },
  { k:'ghH', g:'grade', n:.08, cyc:true, label:'光の色' },  { k:'ghS', g:'grade', n:0, label:'光の強さ' },
  { k:'gdPos', g:'sky', n:.5, label:'空・位置' }, { k:'gdFeather', g:'sky', n:.5, label:'空・ぼかし幅' },
  { k:'gdExpo', g:'sky', n:.5, label:'空・明るさ' }, { k:'gdTemp', g:'sky', n:.5, label:'空・色温度' },
  { k:'gdAngle', g:'sky', n:.5, label:'空・傾き' },
  { k:'halation', g:'light', n:0, label:'ハレーション' },
];
const D = GENES.length;                 // 72
const D_OLD = 31;
const NEUTRAL = GENES.map(g => g.n);
const idx = Object.fromEntries(GENES.map((g, i) => [g.k, i]));
const CYC_GENES = new Set(GENES.map((g, i) => g.cyc ? i : -1).filter(i => i >= 0));
const GROUPS = [
  { k:'tone', label:'トーン', color:'#ee8a4a' }, { k:'color', label:'色', color:'#e06a5a' },
  { k:'hsl', label:'色ごと', color:'#d4537e' }, { k:'grade', label:'グレーディング', color:'#7f77dd' },
  { k:'tex', label:'質感', color:'#6f8fb8' }, { k:'light', label:'光', color:'#e8b931' },
  { k:'place', label:'周辺', color:'#a07cc0' }, { k:'sky', label:'空', color:'#3aa0c8' },
];
const GROUP_COLOR = Object.fromEntries(GROUPS.map(g => [g.k, g.color]));
// 古い（31個）データを72個にそろえる
const padZ = z => (z && z.length < D) ? z.concat(NEUTRAL.slice(z.length)) : z;

const hsv2rgb = (h, s, v) => { const f = n => { const k = (n + h * 6) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); }; return [f(5), f(3), f(1)]; };
const LUMA = [.2126, .7152, .0722];
const lumOf = c => c[0] * LUMA[0] + c[1] * LUMA[1] + c[2] * LUMA[2];
const tempMul = t => { const m = [1 + .22 * t, 1, 1 - .22 * t]; const l = lumOf(m); return m.map(v => v / l); };

// 遺伝子 → 実際の数値
function decode(z) {
  z = padZ(z);
  const G = k => z[idx[k]];
  const two = k => (G(k) - .5) * 2;
  const off = v => (v - .5) * .24;
  const m = [G('black') * .22, .25 + off(G('mS')), .5 + off(G('mM')), .75 + off(G('mH')), 1 - G('white') * .22];
  const ch = c => {
    const s = off(G(c + 'S')), mi = off(G(c + 'M')), h = off(G(c + 'H'));
    const y = [m[0] + s * .6, m[1] + s, m[2] + mi, m[3] + h, m[4] + h * .6].map(v => clamp(v, 0, 1));
    for (let i = 1; i < 5; i++) y[i] = Math.max(y[i], y[i - 1] + .004);
    return y.map(v => Math.min(v, 1));
  };
  const tintZ = G('bTint');
  const tint = tintZ >= .5
    ? [1, 1 - (tintZ - .5) * .8, 1 - (tintZ - .5) * 1.3]
    : [1 - (.5 - tintZ) * .6, 1 - (.5 - tintZ) * .3, 1];
  // ホワイトバランス（光の色で掛け算、明るさは保つ）
  const wt = two('wbTemp'), wn = two('wbTint');
  let wb = [1 + .22 * wt, (1 - .14 * wn), 1 - .22 * wt]; { const l = lumOf(wb); wb = wb.map(v => v / l); }
  // 色ごと（色相のずれ[回転の割合]・彩度の倍率・明るさ）
  const hsl = [];
  for (let i = 0; i < 8; i++) {
    const sz = G('h' + i + 'S');
    hsl.push(two('h' + i + 'H') * 30 / 360, sz < .5 ? sz * 2 : 1 + (sz - .5) * 2, two('h' + i + 'L'));
  }
  // カラーグレーディング（影・中間・光に色を足す）
  const grade = [];
  for (const [hk, sk] of [['gsH', 'gsS'], ['gmH', 'gmS'], ['ghH', 'ghS']]) {
    const c = hsv2rgb(G(hk), 1, 1), l = lumOf(c), s = G(sk) * .2;
    grade.push((c[0] - l) * s, (c[1] - l) * s, (c[2] - l) * s);
  }
  return {
    curves: [ch('r'), ch('g'), ch('b')],
    sat: .25 + G('sat') * 1.25,
    gains: [0, 1, 2, 3, 4, 5].map(i => Math.pow(2, (G('f' + i) - .5) * 2 * (i === 0 ? 1.1 : 1.3))),
    bloom: G('bloom') * 3, bThr: .9 - G('bThr') * .55, bSpr: .45 + G('bSpr') * .43, tint,
    vig: G('vig') * .6, haze: G('haze') * .7, eBlur: G('eBlur'), eRad: .3 + G('eRad') * .6,
    grain: G('grain') * .14, gSize: 1 + G('gSize') * 2,
    wb, sh: [two('shadows'), two('highlights')], vib: two('vibrance'), hsl, grade,
    gd: [.3 + G('gdPos') * .6, .04 + G('gdFeather') * .4, two('gdExpo') * 1.5, two('gdAngle') * .45],
    gdTemp: tempMul(two('gdTemp')), hal: G('halation') * 1.5,
  };
}

// 単調な3次補間で256段のLUTを作る
const LUTDATA = new Uint8Array(256 * 4);
function buildLUT(curves) {
  const xs = [0, .25, .5, .75, 1];
  for (let c = 0; c < 3; c++) {
    const y = curves[c], n = 5, d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (xs[i + 1] - xs[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    for (let k = 0; k < 256; k++) {
      const x = k / 255; let i = Math.min(3, Math.floor(x * 4));
      const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h;
      const h00 = 2*t*t*t - 3*t*t + 1, h10 = t*t*t - 2*t*t + t, h01 = -2*t*t*t + 3*t*t, h11 = t*t*t - t*t;
      const v = h00 * y[i] + h10 * h * m[i] + h01 * y[i + 1] + h11 * h * m[i + 1];
      LUTDATA[k * 4 + c] = Math.round(clamp(v, 0, 1) * 255);
    }
  }
  for (let k = 0; k < 256; k++) LUTDATA[k * 4 + 3] = 255;
}

/* =====================================================================
   WebGL
   ===================================================================== */
const canvas = $('#c');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:true, depth:false, stencil:false, premultipliedAlpha:false, preserveDrawingBuffer:false });
if (!gl) { document.body.innerHTML = '<p style="padding:40px;text-align:center">WebGL2が使えません</p>'; return; }
const LV = 6, BL = 7;
let FMT, ENC = 1;

const VS = `#version 300 es
layout(location=0) in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*.5+.5; gl_Position = vec4(aPos,0.,1.); }`;
const HEAD = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
const vec3 LUMA = vec3(.2126,.7152,.0722);
`;
const TENT = `
vec3 tent(sampler2D t, vec2 uv, vec2 tx){
  vec4 d = vec4(1.,1.,-1.,0.)*tx.xyxy;
  vec3 s = texture(t, uv - d.xy).rgb + texture(t, uv - d.zy).rgb + texture(t, uv + d.zy).rgb + texture(t, uv + d.xy).rgb;
  s += (texture(t, uv - d.wy).rgb + texture(t, uv + d.zw).rgb + texture(t, uv + d.xw).rgb + texture(t, uv + d.wy).rgb)*2.;
  s += texture(t, uv).rgb*4.;
  return s/16.;
}`;
const SRC_UV = `uniform vec4 uSrcCrop; uniform float uSrcMir;
vec2 srcUv(vec2 uv){ if(uSrcMir > .5) uv.x = 1. - uv.x; return uSrcCrop.xy + uv*uSrcCrop.zw; }`;
const FS_SRC = HEAD + SRC_UV + `uniform sampler2D uImg; void main(){ o = vec4(texture(uImg, srcUv(vUv)).rgb, 1.); }`;
const FS_DOWN = HEAD + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 s = texture(uTex, vUv)*4.;
  s += texture(uTex, vUv - uTexel); s += texture(uTex, vUv + uTexel);
  s += texture(uTex, vUv + vec2(uTexel.x,-uTexel.y)); s += texture(uTex, vUv + vec2(-uTexel.x, uTexel.y));
  o = s/8.;
}`;
const FS_REC = HEAD + TENT + `
uniform sampler2D uG, uGc, uRc; uniform vec2 uTc; uniform float uGain;
void main(){
  vec3 g = texture(uG, vUv).rgb;
  o = vec4(tent(uRc, vUv, uTc) + uGain*(g - tent(uGc, vUv, uTc)), 1.);
}`;
const FS_PRE = HEAD + `
uniform sampler2D uTex; uniform vec2 uTx; uniform float uThr, uEnc;
vec3 lin(vec3 c){ return pow(max(c, 0.), vec3(2.2)); }
void main(){
  vec2 d = uTx*.5;
  vec3 c = (lin(texture(uTex, vUv + vec2(-d.x,-d.y)).rgb) + lin(texture(uTex, vUv + vec2(d.x,-d.y)).rgb)
          + lin(texture(uTex, vUv + vec2(-d.x, d.y)).rgb) + lin(texture(uTex, vUv + vec2(d.x, d.y)).rgb))*.25;
  float br = max(c.r, max(c.g, c.b));
  float knee = uThr*.5 + 1e-4;
  float soft = clamp(br - uThr + knee, 0., 2.*knee); soft = soft*soft/(4.*knee);
  float k = max(soft, br - uThr)/max(br, 1e-4);
  o = vec4(c*k*(1. + 2.*smoothstep(.75, .98, br))*uEnc, 1.);
}`;
const FS_UP = HEAD + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 d = vec4(1.,1.,-1.,0.)*uTexel.xyxy;
  vec4 s = texture(uTex, vUv - d.xy) + texture(uTex, vUv - d.zy) + texture(uTex, vUv + d.zy) + texture(uTex, vUv + d.xy);
  s += (texture(uTex, vUv - d.wy) + texture(uTex, vUv + d.zw) + texture(uTex, vUv + d.xw) + texture(uTex, vUv + d.wy))*2.;
  s += texture(uTex, vUv)*4.;
  o = s/16.;
}`;
const FS_COMP = HEAD + TENT + SRC_UV + `
uniform sampler2D uR0, uLow, uBloom, uLut, uImg, uLoc;
uniform vec2 uLowTx, uLocTx;
uniform float uBypass, uAspect, uEnc, uBloomAmt, uSat, uVig, uHaze, uEBlur, uERad, uGrain, uGSize, uSeed;
uniform vec3 uTint;
uniform vec3 uWB; uniform vec2 uSH; uniform float uVib, uHal;
uniform vec3 uHsl[8];
uniform vec3 uGrade[3];
uniform vec4 uGd; uniform vec3 uGdTemp;
uniform float uLkOn, uLkSpr;
uniform vec4 uLk1, uLk2, uLkS, uLkC;
uniform vec3 uLkCore, uLkOuter;
uniform vec2 uLkN1;
const float HC[9] = float[9](0., 30./360., 60./360., 120./360., 180./360., 240./360., 280./360., 320./360., 1.);
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y); }
float fbm(vec2 p){ return .5*vnoise(p) + .25*vnoise(p*2.1 + 3.7) + .125*vnoise(p*4.3 + 1.3) + .125*vnoise(p*8.7 + 9.1); }
vec3 rgb2hsv(vec3 c){
  vec4 K = vec4(0., -1./3., 2./3., -1.);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);

  $('#favCount').textContent = store.favs.length + '';
  const betw = S.stage === 'betw';
  for (const f of store.favs.slice().reverse()) {
    const b = document.createElement('button'), si = betw ? S.bw.ids.indexOf(f.id) : -1;
    b.className = 'fav' + (si >= 0 ? ' sel' : '');
    b.style.backgroundImage = `url(${f.thumb})`;
    b.innerHTML = `<span>${favTag(f)}</span><i class="del${delArmed === f.id ? ' sure' : ''}">${delArmed === f.id ? '消す' : '✕'}</i>${si >= 0 ? `<em>${si + 1}</em>` : ''}`;
    b.addEventListener('click', e => {
      if (e.target.classList.contains('del')) {
        if (delArmed === f.id) {
          store.favs = store.favs.filter(x => x.id !== f.id); delArmed = null;
          for (const k of ['pref', 'ref']) CTX[k].S.bw.ids = CTX[k].S.bw.ids.filter(id => id !== f.id);
          bwCache.key = null;
          if (S.stage === 'betw') { bwSync(); makeRound(); computeAnalysis(); }
          persist(); renderFavs(); toast(`★${f.id} を消しました`);
        } else { delArmed = f.id; renderFavs(); }
        return;
      }
      delArmed = null;
      if (betw) {
        const k = S.bw.ids.indexOf(f.id);
        if (k >= 0) S.bw.ids.splice(k, 1); else if (S.bw.ids.length < 5) S.bw.ids.push(f.id); else { toast('5個まで'); return; }
        bwCache.key = null; bwSync(); makeRound(); computeAnalysis(); persist(); renderFavs(); return;
      }
      if (f.leak) {
        S.lBest = f.leak.slice(); S.leakUsed = true; S.zBest = padZ(f.z).slice(); S.base = distPlain(S.zBest, NEUTRAL) < 1e-3 ? 'orig' : 'grade'; S.stage = 'leak';
      } else if (S.stage === 'leak') {
        S.zBest = padZ(f.z).slice(); if (f.u) S.uBest = f.u.slice(); S.base = 'grade';
      } else {
        if (f.u && f.u.length === KD) S.uBest = f.u.slice();
        S.zBest = padZ(f.z).slice();
        if (!f.u && S.stage === 'macro') S.stage = 'fine';

}

/* =====================================================================
   お手本：写真の「見た目の統計」（Lab色空間）
   同じ景色でなくても比べられるように、場所ではなく分布で比べる

const S2L = (() => { const t = new Float32Array(256); for (let i = 0; i < 256; i++) { const c = i / 255; t[i] = c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); } return t; })();

const DEG = 57.29578;
function histQ(hist, N, p, bw) {
  const tgt = p * N; let cum = 0;
  for (let i = 0; i < hist.length; i++) { const c = hist[i]; if (c && cum + c >= tgt) return (i + (tgt - cum) / c) * bw; cum += c; }
  return hist.length * bw;
}
function computeStats(px, w, h, bottomUp) {

  const LH = new Float32Array(404), CH = new Float32Array(302), H64 = new Float32Array(64);
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    const r = S2L[px[p]], g = S2L[px[p + 1]], b = S2L[px[p + 2]];
    const fx = flab((.4124 * r + .3576 * g + .1805 * b) / .95047), fy = flab(.2126 * r + .7152 * g + .0722 * b), fz = flab((.0193 * r + .1192 * g + .9505 * b) / 1.08883);
    const l = 116 * fy - 16, a = 500 * (fx - fy), bb = 200 * (fy - fz);
    L[i] = l; A[i] = a; B[i] = bb;
    LH[Math.min(403, Math.max(0, (l * 4) | 0))]++;
    CH[Math.min(301, (Math.hypot(a, bb) * 2) | 0)]++;
    H64[Math.min(63, Math.max(0, (l * .64) | 0))]++;
  }
  const Lq = QP.map(p => histQ(LH, N, p, .25)), Cq = CQ.map(p => histQ(CH, N, p, .5));
  const t1 = Lq[2], t2 = Lq[4];

  const hb = HB_C.map(() => ({ n: 0, L: 0, C: 0, sx: 0, sy: 0 }));

  for (let y = 0; y < h; y++) {
    const yt = bottomUp ? h - 1 - y : y, fy2 = (yt + .5) / h, qy = fy2 * 2 - 1;
    for (let x = 0; x < w; x++) {
      const i = y * w + x, l = L[i], a = A[i], b = B[i];
      const bd = l <= t1 ? band[0] : l >= t2 ? band[2] : band[1]; bd.n++; bd.L += l; bd.a += a; bd.b += b;
      const C = Math.hypot(a, b);
      if (C > 6) { let hd = Math.atan2(b, a) * DEG; if (hd < 0) hd += 360; const o = hb[HB_LUT[Math.min(359, hd | 0)]]; o.n++; o.L += l; o.C += C; o.sx += a; o.sy += b; }
      const qx = (x + .5) / w * 2 - 1, r = Math.hypot(qx, qy);
      if (r < .5) { cN++; cL += l; } else if (r > 1.05) { eN++; eL += l; }
      if (fy2 < .3) { tN++; tL += l; ta += a; tb += b; } else if (fy2 > .38 && fy2 < .62) { mN++; mL += l; ma += a; mb += b; }
      if (x > 1 && y > 1 && x < w - 2 && y < h - 2) { lc += Math.abs(l - (L[i - 2] + L[i + 2] + L[i - 2 * w] + L[i + 2 * w]) * .25); lcN++; }

  }

    Lq, Cq,
    band: band.map(o => ({ L: dv(o.L, o.n), a: dv(o.a, o.n), b: dv(o.b, o.n) })),
    hb: hb.map(o => ({ f: o.n / N, L: dv(o.L, o.n), C: dv(o.C, o.n), h: ((Math.atan2(o.sy, o.sx) * DEG) + 360) % 360 })),
    rad: dv(eL, eN) - dv(cL, cN),
    vt: { L: dv(tL, tN) - dv(mL, mN), a: dv(ta, tN) - dv(ma, mN), b: dv(tb, tN) - dv(mb, mN) },
    lc: dv(lc, lcN), H64: Array.from(H64, v => v / N), samp,

}
// お手本が何枚かあるときは平均の「雰囲気」にする
function avgStats(list) {
  if (list.length === 1) return list[0];
  const n = list.length, av = f => list.reduce((s, t) => s + f(t), 0) / n;
  return {
    Lq: QP.map((_, i) => av(t => t.Lq[i])), Cq: CQ.map((_, i) => av(t => t.Cq[i])),
    band: [0, 1, 2].map(k => ({ L: av(t => t.band[k].L), a: av(t => t.band[k].a), b: av(t => t.band[k].b) })),
    hb: HB_C.map((_, k) => {
      const ws = list.reduce((s, t) => s + t.hb[k].f, 0) || 1e-9, wv = g => list.reduce((s, t) => s + g(t) * t.hb[k].f, 0) / ws;
      const hx = wv(t => Math.cos(t.hb[k].h / DEG)), hy = wv(t => Math.sin(t.hb[k].h / DEG));
      return { f: ws / n, L: wv(t => t.hb[k].L), C: wv(t => t.hb[k].C), h: ((Math.atan2(hy, hx) * DEG) + 360) % 360 };
    }),
    rad: av(t => t.rad), vt: { L: av(t => t.vt.L), a: av(t => t.vt.a), b: av(t => t.vt.b) }, lc: av(t => t.lc),
    H64: list[0].H64.map((_, i) => av(t => t.H64[i])),
    samp: list.flatMap(t => { const k = Math.max(1, Math.round(n)), o = []; for (let i = 0; i < t.samp.length; i += 5 * k) o.push(...t.samp.slice(i, i + 5)); return o; }),
  };
}
// ずれ（小さいほど似ている）。部分ごとにも出す
// 場所の統計（周辺の暗さ・上と下の差）は景色の中身で大きく変わるので比べない（人の目で詰める）
let HUEF_W = .05;
function statLoss(s, t) {
  const P = { tone: [0, 0], color: [0, 0], hue: [0, 0] };
  const add = (k, w, d) => { P[k][0] += w * d * d; P[k][1] += w; };
  const QW = [.5, 1, 1, 1, 1, 1, .5];
  for (let i = 0; i < 7; i++) add('tone', QW[i], (s.Lq[i] - t.Lq[i]) / 4);
  for (let k = 0; k < 3; k++) { add('color', 1.2, (s.band[k].a - t.band[k].a) / 3); add('color', 1.2, (s.band[k].b - t.band[k].b) / 3); }
  for (let i = 0; i < 4; i++) add('color', .8, (s.Cq[i] - t.Cq[i]) / 4);
  for (let k = 0; k < 8; k++) {
    const a = s.hb[k], b = t.hb[k], w = clamp(Math.min(a.f, b.f) * 12, 0, 1);
    if (w > .02) {

      add('hue', 1.2 * w, dh / 8 * Math.min(1, Math.min(a.C, b.C) / 20));
      add('hue', w, (a.C - b.C) / 5); add('hue', .6 * w, (a.L - b.L) / 6);

  for (const k in P) { a += P[k][0]; b += P[k][1]; parts[k] = P[k][0] / P[k][1]; }

const simOf = l => Math.round(100 * Math.exp(-l / 3));
function lab2rgb(L, a, b) {
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const inv = f => f > .206893 ? f * f * f : (f - 16 / 116) / 7.787;

/* ---------- 自分の写真にフィルターをかけたときの統計（小さく描いて読む） ---------- */
let statSet = null, statOut = null, ownStat = null;

const statDims = (w0, h0) => { const a = w0 / h0; return a >= 1 ? [128, Math.max(8, Math.round(128 / a))] : [Math.max(8, Math.round(128 * a)), 128]; };
function ownStats(z) {

function downscale(src, w, h) {

  while (cw / 2 >= w * 1.5) {

    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, c.width, c.height); cur = c; cw = c.width; ch = c.height;

// 候補選び：AIの予想が高いものから、お手本に近いものを優先する（選んだ回数が増えるほど弱める）
function refRerank(cand, st, gp) {
  cand.sort((a, b) => b.acq - a.acq);
  const top = [];
  for (const c of cand) { if (top.length >= 28) break; if (top.every(t => distPlain(t.x, c.x) > 1e-3)) top.push(c); }
  const w = 1.2 / (1 + gp.C.length / 30);
  top.forEach(c => { c.loss = statLoss(ownStats(st.z(c.x)), tStats).loss; c.acq -= w * c.loss; });
  return top;
}

/* ---------- 比較カード ---------- */

function updateSim() {

  ownStat = ownStats(curView().z);

  $('#pinfo').textContent = `${d.getMonth() + 1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}・${p.rec.label}${p.rec.leak ? '＋光漏れ' : ''}`;
  $('#pDel').classList.remove('sure'); $('#pDel').textContent = '削除';
  openOvl('photo');
}
const photoName = p => { const d = new Date(p.rec.t); return `img_${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}_${p.id}.jpg`; };

$('#pShare').addEventListener('click', async () => {

$('#folderBtn').addEventListener('click', openFolder);

// ZIP（無圧縮）：写真＋フィルターの数値＋お手本＋学習データ
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [], now = new Date(); let offset = 0;
  const dosT = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosD = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dosT, true); h.setUint16(12, dosD, true); h.setUint32(14, crc, true); h.setUint32(18, size, true); h.setUint32(22, size, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dosT, true); c.setUint16(14, dosD, true); c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + size;
  }
  const cSize = central.reduce((s, p) => s + p.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/zip' });
}
$('#zipBtn').addEventListener('click', async () => {
  const photos = (await dbAll('photos')).sort((a, b) => a.rec.t - b.rec.t), enc = new TextEncoder(), files = [], recipes = [];
  for (const p of photos) {
    const name = 'photos/' + photoName(p), z = padZ(p.rec.z);
    files.push({ name, data: new Uint8Array(await p.blob.arrayBuffer()) });
    recipes.push({ file: name, label: p.rec.label, date: new Date(p.rec.t).toISOString(), genes: Object.fromEntries(GENES.map((g, i) => [g.k, z[i]])),
      leak: p.rec.leak ? Object.fromEntries(LEAKS.map((l, i) => [l.k, p.rec.leak[i]])) : null });
  }
  try { for (const t of await dbAll('targets')) files.push({ name: `targets/target_${t.id}.jpg`, data: new Uint8Array(await t.blob.arrayBuffer()) }); } catch (e) {}
  files.push({ name: 'recipes.json', data: enc.encode(JSON.stringify(recipes, null, 1)) });
  files.push({ name: 'filter-data.json', data: enc.encode(JSON.stringify(exportData())) });
  const blob = makeZip(files), d = new Date(), name = `folder_${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}.zip`;
  const file = new File([blob], name, { type: 'application/zip' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  download(blob, name);
});

/* ---------- ループと起動 ---------- */
function frame(now) {
  requestAnimationFrame(frame);
  if (camOpen) { camFrame(now); return; }
  if (dirty && imgTex && geo) { drawGrid(); dirty = false; }
}
(function boot() {
  buildTiles(); buildPairSelects(); updateStageUI(); renderTStrip();
  const saved = localStorage.getItem('filtlab-img');
  const go = src => {
    setImage(src); fitAll();
    if (S.stage === 'betw') bwSync();
    makeRound(); computeAnalysis(); updateStats(); requestAnimationFrame(frame);
    loadTargets().then(() => { if (ctxKey === 'ref') makeRound(); refreshCompare(); });
  };
  if (saved) { const img = new Image(); img.onload = () => go(img); img.onerror = () => go(sampleImage()); img.src = saved; }
  else go(sampleImage());
})();

window.__lab = { cam, openCam, closeCam, camShoot, dbAll, makeZip, get view() { return view; }, get S() { return S; }, get SPACE() { return SPACE; }, CTX, useCtx, get ctxKey() { return ctxKey; },
  KNOBS, LEAKS, LEAK0, GENES, NEUTRAL, idx, knobsToGenes, get tiles() { return tiles; }, choose, undo, distPlain, makeRound, computeAnalysis, get curves() { return curves; }, get maps() { return maps; },
  U0, renderToCanvas, renderPixels, makeSet, target, RGBA8, decode, padZ, computeStats, statLoss, statsOfImage, ownStats, avgStats, fitTo, simOf, get TG() { return TG; }, setTG(l) { TG = l; updateTStats(); renderTStrip(); }, get tStats() { return tStats; },
  updateTStats, targetsChanged, bwModel, bwOut, bwSync, curView, camBest, store, persist, exportData, FIT_IDS, REGW, setHueF(v) { HUEF_W = v; }, setImage, freeStat, autoFit, get fitting() { return fitting; }, openZoom, ZC, knobSet };

$('#legend').innerHTML = GROUPS.map(g => `<span><i style="background:${g.color}"></i>${g.label}</span>`).join('');
})();
