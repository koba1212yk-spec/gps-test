<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6ece0">
<title>にじみカメラ</title>
<style>
:root{
  --ink:#4a3426; --ink2:#8d6d58; --glass:rgba(255,249,242,.62); --line:rgba(255,255,255,.72);
  --warm1:#f7b26e; --warm2:#ec7f45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f4e9dc;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#v{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.glass{background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}

.round{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;padding:0}
.round svg{width:22px;height:22px}
.round:active{transform:scale(.94)}

/* 主役の目印 */
#ring{position:fixed;left:0;top:0;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;pointer-events:none;
  border:1.5px solid rgba(255,255,255,.95);box-shadow:0 0 18px rgba(255,190,120,.85),inset 0 0 14px rgba(255,210,160,.6);
  opacity:0;transition:opacity .4s}
#ring.show{opacity:1}

/* ---------- panel ---------- */
.panel{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  max-width:460px;margin:0 auto;padding:14px 16px 16px;border-radius:30px;
  box-shadow:0 10px 40px rgba(120,70,30,.18)}
.opts{display:flex;gap:8px}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:38px;border-radius:19px;
  border:none;background:rgba(255,255,255,.42);color:var(--ink2);font-size:13px;font-weight:700;
  letter-spacing:.04em;white-space:nowrap;transition:background .25s,color .25s,box-shadow .25s}
.chip i{width:13px;height:13px;border-radius:50%;flex:none;opacity:.55;transition:opacity .25s}
.chip.on{background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(150,90,40,.18)}
.chip.on i{opacity:1}
.sw-leak{background:linear-gradient(135deg,#ffd27a,#ff8a4c 55%,#ff5f6d)}
.sw-subj{background:radial-gradient(circle,#ffb35c 0 38%,transparent 40%),radial-gradient(circle,transparent 58%,#f0a868 60% 72%,transparent 74%)}

.row{display:flex;align-items:center;gap:12px;margin:10px 4px 4px}
.row+.row{margin-top:2px}
.row label{font-size:13px;font-weight:700;letter-spacing:.12em;flex:none}
.row output{font-size:12px;width:2.2em;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:30px;margin:0;background:transparent;--p:50%}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,#f8cfa2,#ee8a4a) 0/var(--p) 100% no-repeat,rgba(120,80,50,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;
  background:#fff;box-shadow:0 2px 8px rgba(120,70,30,.3),0 0 0 5px rgba(255,190,120,.32)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(120,80,50,.16)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:linear-gradient(90deg,#f8cfa2,#ee8a4a)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:none;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(120,70,30,.3),0 0 0 5px rgba(255,190,120,.32)}

.shot{display:flex;align-items:center;justify-content:space-between;padding:0 6px;margin-top:8px}
#thumb{width:50px;height:50px;border-radius:15px;border:2px solid rgba(255,255,255,.95);
  background:rgba(255,255,255,.38) center/cover no-repeat;box-shadow:0 3px 12px rgba(120,70,30,.18);padding:0}
#thumb:disabled{opacity:.55}
#shutter{width:76px;height:76px;border-radius:50%;border:none;background:#fff;position:relative;padding:0;
  box-shadow:0 0 0 5px rgba(255,255,255,.6),0 8px 26px rgba(214,118,48,.38);transition:transform .12s}
#shutter::after{content:"";position:absolute;inset:7px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fffaf0 0%,#ffd6a6 45%,#f4a062 80%,#ee8a4a 100%);
  box-shadow:0 0 18px rgba(255,170,90,.75)}
#shutter:active{transform:scale(.92)}
#flip{width:50px;height:50px;border-radius:50%;border:none;background:rgba(255,255,255,.55);
  display:grid;place-items:center;padding:0;box-shadow:0 3px 12px rgba(120,70,30,.14)}
#flip svg{width:24px;height:24px}

.tag{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);
  padding:8px 16px;border-radius:18px;font-size:12.5px;font-weight:700;letter-spacing:.06em;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.tag.show{opacity:1}
#flash{position:fixed;inset:0;background:#fff8ef;opacity:0;pointer-events:none}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

/* ---------- start ---------- */
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 28%,#fff9f0 0%,#f8e5cf 52%,#efcfac 100%);transition:opacity .6s}
#start.hide{opacity:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.75;animation:drift 14s ease-in-out infinite alternate}
.orb.a{width:260px;height:260px;left:-60px;top:12%;background:#ffc58f}
.orb.b{width:220px;height:220px;right:-50px;top:46%;background:#ff9f7a;animation-duration:17s}
.orb.c{width:180px;height:180px;left:30%;bottom:-40px;background:#ffe0a8;animation-duration:12s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-26px) scale(1.15)}}
#start .in{position:relative}
#start h1{margin:0 0 14px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;
  font-size:34px;letter-spacing:.2em;padding-left:.2em;color:#5a3a26;
  text-shadow:0 0 22px rgba(255,170,90,.9),0 0 48px rgba(255,190,120,.7)}
#start .sub{margin:0 0 44px;font-size:14px;letter-spacing:.16em;color:var(--ink2)}
.btn{height:56px;padding:0 38px;border-radius:28px;border:none;color:#fff;font-size:16px;font-weight:700;letter-spacing:.12em;
  background:linear-gradient(135deg,var(--warm1),var(--warm2));box-shadow:0 10px 30px rgba(236,127,69,.38)}
.btn:active{transform:scale(.97)}
#start .note{margin-top:18px;font-size:12px;color:var(--ink2);line-height:1.7}
#start .err{color:#b4462c;font-weight:700}

/* ---------- viewer ---------- */
#viewer{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  background:rgba(250,240,228,.88);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
#viewer.open{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#viewer img{max-width:100%;max-height:calc(100dvh - 170px);border-radius:18px;box-shadow:0 16px 50px rgba(120,70,30,.25);
  -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.vbtns{display:flex;gap:12px;margin-top:22px}
.vbtns .btn{height:50px;padding:0 30px;font-size:15px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 18px rgba(120,70,30,.14)}
.vhint{margin-top:12px;font-size:11.5px;color:var(--ink2)}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="ring"></div>
<div id="flash"></div>
<div class="tag glass" id="tag"></div>

<button class="round glass" id="cmp" aria-label="押している間、元の映像">
  <svg viewBox="0 0 24 24" fill="none" stroke="#4a3426" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
  </svg>
</button>

<div class="panel glass" id="panel">
  <div class="opts">
    <button class="chip" id="subjBtn"><i class="sw-subj"></i><span id="subjLabel">主役：自動</span></button>
    <button class="chip" id="leakBtn"><i class="sw-leak"></i>光漏れ</button>
  </div>
  <div class="row">
    <label for="amt">滲み</label>
    <input type="range" id="amt" min="0" max="100" value="60">
    <output id="amtVal">60</output>
  </div>
  <div class="row">
    <label for="mem">記憶</label>
    <input type="range" id="mem" min="0" max="100" value="65">
    <output id="memVal">65</output>
  </div>
  <div class="shot">
    <button id="thumb" aria-label="撮った写真" disabled></button>
    <button id="shutter" aria-label="撮影"></button>
    <button id="flip" aria-label="カメラ切替">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4a3426" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9a8 8 0 0 1 14.2-3.6L20 7.5"/><path d="M20 3.5v4h-4"/>
        <path d="M20 15a8 8 0 0 1-14.2 3.6L4 16.5"/><path d="M4 20.5v-4h4"/>
      </svg>
    </button>
  </div>
</div>

<div id="start">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="in">
    <h1>にじみカメラ</h1>
    <p class="sub">記憶みたいに、光が滲む。</p>
    <button class="btn" id="go">カメラをひらく</button>
    <div class="note" id="note">カメラの使用を許可してください</div>
  </div>
</div>

<div id="viewer">
  <img id="vimg" alt="撮った写真">
  <div class="vbtns">
    <button class="btn ghost" id="vclose">もどる</button>
    <button class="btn" id="vsave">保存する</button>
  </div>
  <div class="vhint">保存できないときは、写真を長押ししても保存できます</div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const video = $('#v'), canvas = $('#c');
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ================= settings ================= */
// 光の質感は1種類（暖かいミスト）。「滲み」で光の量、「記憶」で褪せ・ぼけ・残像・端のかすみをまとめて調整
const LOOK = { thr:.58, knee:.55, hot:2.2, intensity:2.0, scatter:.78, tint:[1,.8,.6], tintAmt:.45,
               warm:.5, grain:.05, leak:.75 };
const set = { amount:.6, memory:.65, leak:true };
try {
  const s = JSON.parse(localStorage.getItem('nijimi-memory') || '{}');
  if (typeof s.a === 'number') set.amount = clamp(s.a, 0, 1);
  if (typeof s.m === 'number') set.memory = clamp(s.m, 0, 1);
  if (typeof s.l === 'boolean') set.leak = s.l;
} catch (e) {}
const saveSet = () => { try { localStorage.setItem('nijimi-memory', JSON.stringify({ a:set.amount, m:set.memory, l:set.leak })); } catch (e) {} };

function params() {
  const p = LOOK, k = set.amount;
  const mult = k < .5 ? k * 2 : 1 + (k - .5) * 2 * 1.7;
  const thr = clamp(p.thr - (k - .5) * .36, .2, .95);
  const thrLin = Math.pow(thr, 2.2);
  const tl = p.tint[0]*.2126 + p.tint[1]*.7152 + p.tint[2]*.0722;
  const norm = 1 + (tl - 1) * .6;
  return {
    thr: thrLin, knee: thrLin * p.knee, hot: p.hot, intensity: p.intensity * mult,
    scatter: clamp(p.scatter + (k - .5) * .32, .35, .9),
    tint: p.tint.map(v => v / norm), tintAmt: p.tintAmt, warm: p.warm, grain: p.grain,
    leak: set.leak ? p.leak : 0, memory: set.memory,
    ghost: .12 + .6 * set.memory,              // 残像の濃さ
    tau: .08 + .62 * set.memory,               // 残像が消えるまでの時間（秒）
  };
}

/* ================= 主役 ================= */
let subject = null;           // {x,y(画面uv, y上向き), ref:[cr,cb] or null}
const off = [0, 0];
const scan = document.createElement('canvas'), sctx = scan.getContext('2d', { willReadFrequently:true });
const trk = document.createElement('canvas'), tctx = trk.getContext('2d', { willReadFrequently:true });
const SW = 160, TW = 80;
let SH = 0, TH = 0, gray = null, rgbData = null, selAspect = 0;
const chroma = (r, g, b) => { const y = .2126*r + .7152*g + .0722*b, m = Math.max(r, g, b, .06); return [(r - y) / m, (b - y) / m]; };

/* ================= WebGL ================= */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, stencil:false,
  premultipliedAlpha:false, preserveDrawingBuffer:false, powerPreference:'high-performance' });
const LEVELS = 7;
let FMT = null, ENC = 1;

const VS = `#version 300 es
layout(location=0) in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*.5+.5; gl_Position = vec4(aPos,0.,1.); }`;
const COMMON = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
const vec3 LUMA = vec3(.2126,.7152,.0722);
`;
const CAM = `
uniform sampler2D uVideo; uniform vec4 uCrop; uniform float uMirror;
vec3 cam(vec2 uv){ if(uMirror > .5) uv.x = 1. - uv.x; return texture(uVideo, uCrop.xy + uv*uCrop.zw).rgb; }
`;

// 残像：前のフレームの記憶に今を少しずつ混ぜる（表示色のまま保存）
const FS_ACC = COMMON + CAM + `
uniform sampler2D uPrev; uniform float uK;
void main(){ o = vec4(mix(texture(uPrev, vUv).rgb, cam(vUv), uK), 1.); }`;

// 「記憶の映像」＝今と残像の混ざり（半分サイズ、ぼかし用のミップマップの元）
const FS_RH = COMMON + CAM + `
uniform sampler2D uAcc; uniform float uGhost; uniform vec2 uDst;
vec3 R(vec2 uv){ return mix(cam(uv), texture(uAcc, uv).rgb, uGhost); }
void main(){
  vec2 d = uDst*.25;
  o = vec4((R(vUv+vec2(-d.x,-d.y)) + R(vUv+vec2(d.x,-d.y)) + R(vUv+vec2(-d.x,d.y)) + R(vUv+vec2(d.x,d.y)))*.25, 1.);
}`;

// 明るいところだけ抜き出す
const FS_PRE = COMMON + `
uniform sampler2D uRh; uniform vec3 uThr; uniform float uEnc;
void main(){
  vec3 col = pow(texture(uRh, vUv).rgb, vec3(2.2));
  float br = max(col.r, max(col.g, col.b));
  float thr = uThr.x, knee = max(uThr.y, 1e-4);
  float soft = clamp(br - thr + knee, 0., 2.*knee); soft = soft*soft/(4.*knee);
  float contrib = max(soft, br - thr)/max(br, 1e-4);
  float hot = 1. + uThr.z*smoothstep(.72, .98, br);
  o = vec4(col*contrib*hot*uEnc, 1.);
}`;

const FS_DOWN = COMMON + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 s = texture(uTex, vUv)*4.;
  s += texture(uTex, vUv - uTexel);
  s += texture(uTex, vUv + uTexel);
  s += texture(uTex, vUv + vec2(uTexel.x,-uTexel.y));
  s += texture(uTex, vUv + vec2(-uTexel.x, uTexel.y));
  o = s/8.;
}`;
const FS_UP = COMMON + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 d = vec4(1.,1.,-1.,0.)*uTexel.xyxy;
  vec4 s = texture(uTex, vUv - d.xy);
  s += texture(uTex, vUv - d.wy)*2.;
  s += texture(uTex, vUv - d.zy);
  s += texture(uTex, vUv + d.zw)*2.;
  s += texture(uTex, vUv)*4.;
  s += texture(uTex, vUv + d.xw)*2.;
  s += texture(uTex, vUv + d.zy);
  s += texture(uTex, vUv + d.wy)*2.;
  s += texture(uTex, vUv + d.xy);
  o = s/16.;
}`;

const FS_COMP = COMMON + CAM + `
uniform sampler2D uAcc, uRh, uBloom, uAvg;
uniform vec2 uRhTexel;
uniform float uGhost, uEnc, uBypass, uTime, uSeed, uAdapt, uAspect;
uniform float uIntensity, uTintAmt, uWarm, uGrain, uLeak, uMem;
uniform vec3 uTint;
uniform vec3 uSubj; uniform vec2 uRef;     // 主役 (x, y, mode) mode 0:自動(中心) 1:色で追う 2:場所だけ
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 tonemap(vec3 x){
  float m = max(x.r, max(x.g, x.b));
  float mc = m < .8 ? m : .8 + .2*(1. - exp(-(m - .8)/.2));
  vec3 y = x*(mc/max(m, 1e-5));
  return mix(y, vec3(mc), smoothstep(1., 3.5, m)*.4);
}
float brightArea(){
  vec3 s = vec3(0.);
  for(int j = 0; j < 3; j++) for(int i = 0; i < 3; i++)
    s += texture(uAvg, vec2(.2 + .3*float(i), .2 + .3*float(j))).rgb;
  return dot(s/9., LUMA);
}
float blob(vec2 p, vec2 c, vec2 s, float r){ vec2 q = (p-c)*s; return exp(-dot(q,q)/r); }
vec3 leakCol(vec2 uv, float t){
  vec2 p = (uv - .5)*vec2(uAspect, 1.);
  float a = .5*uAspect;
  vec3 acc = vec3(0.);
  acc += vec3(1.,.42,.12) * blob(p, vec2(-a-.06, .12 + .2*sin(t*.21)), vec2(1.,.55), .07) * (.7 + .3*sin(t*.53));
  acc += vec3(1.,.72,.30) * blob(p, vec2( a+.05,-.16 + .22*sin(t*.17+2.)), vec2(1.,.5), .055) * (.65 + .35*sin(t*.41+1.3));
  acc += vec3(1.,.32,.24) * blob(p, vec2(.3*a*sin(t*.13), .56), vec2(.7,1.2), .045) * (.55 + .25*sin(t*.29+.7));
  vec2 dir = normalize(vec2(.55, -1.));
  vec2 o0 = vec2(-a*.6 + .08*sin(t*.11), .5);
  float side = dot(p - o0, vec2(-dir.y, dir.x));
  float along = dot(p - o0, dir);
  acc += vec3(1.,.82,.55) * exp(-side*side/.006) * smoothstep(.9, 0., along) * smoothstep(-.05, .1, along) * (.25 + .15*sin(t*.37));
  return acc*.85;
}
// 主役らしさ（1=そのまま残す、0=褪せる）
float keepAt(vec2 uv, vec3 col){
  vec2 d = (uv - uSubj.xy)*vec2(uAspect, 1.);
  float dd = dot(d, d);
  if(uSubj.z < .5) return .85*exp(-dd/.13);
  float narrow = exp(-dd/.022);
  if(uSubj.z > 1.5) return narrow;
  float y = dot(col, LUMA), mx = max(col.r, max(col.g, col.b));
  vec2 ch = vec2(col.r - y, col.b - y)/max(mx, .06);
  vec2 dc = ch - uRef;
  float sim = exp(-dot(dc, dc)/.02)*smoothstep(.03, .1, length(ch));
  return clamp(max(exp(-dd/.2)*sim, narrow*.6), 0., 1.);
}
vec3 blurred(vec2 uv){
  float lod = 2.6;
  vec2 t = uRhTexel*exp2(lod)*.75;
  vec3 s = textureLod(uRh, uv, lod).rgb*.4;
  s += textureLod(uRh, uv + vec2( t.x, t.y), lod).rgb*.15;
  s += textureLod(uRh, uv + vec2(-t.x, t.y), lod).rgb*.15;
  s += textureLod(uRh, uv + vec2( t.x,-t.y), lod).rgb*.15;
  s += textureLod(uRh, uv + vec2(-t.x,-t.y), lod).rgb*.15;
  return s;
}
void main(){
  vec2 uv = vUv;
  vec3 cur = cam(uv);
  if(uBypass > .5){ o = vec4(cur, 1.); return; }
  vec3 Rd = mix(cur, texture(uAcc, uv).rgb, uGhost);   // 今と少し前が混ざった映像

  float keep = keepAt(uv, Rd);
  float bg = 1. - keep;
  vec2 q = (uv - .5)*2.;
  float edge = smoothstep(.75, 1.45, length(q));

  // 細部が抜ける：主役以外と端をぼかす
  float blurAmt = uMem*clamp(bg*.85 + edge*.6, 0., 1.);
  vec3 Dd = mix(Rd, blurred(uv), blurAmt*.9);

  // 光の滲み
  vec3 base = pow(Dd, vec3(2.2));
  vec3 b = texture(uBloom, uv).rgb/uEnc;
  vec3 bc = mix(b, dot(b, LUMA)*uTint, uTintAmt*(1. - .6*keep));
  float eff = uIntensity/(1. + uAdapt*brightArea()/uEnc);
  // 主役の中は自分の光で白く飛ばないように抑え、周りに滲ませる

function compile(type, src) {

}

const RGBA8 = () => ({ internal: gl.RGBA8, format: gl.RGBA, type: gl.UNSIGNED_BYTE });

// 1つの出力サイズに必要なバッファ一式
function makeSet(w, h) {
  const chain = [];
  let cw = Math.max(1, Math.round(w / 2)), ch = Math.max(1, Math.round(h / 2));
  const rh = makeTarget(cw, ch, RGBA8(), true);
  for (let i = 0; i < LEVELS; i++) {
    chain.push(makeTarget(cw, ch));
    cw = Math.max(1, Math.round(cw / 2)); ch = Math.max(1, Math.round(ch / 2));

}
function freeSet(s) { if (!s) return; s.chain.forEach(freeTarget); freeTarget(s.rh); }

let P_ACC, P_RH, P_PRE, P_DOWN, P_UP, P_COMP, vidTex, live = null, acc = [null, null], accIdx = 0, accFresh = true;

function initGL() {
  if (!gl) throw new Error('webgl');
  vsObj = compile(gl.VERTEX_SHADER, VS);
  P_ACC = program(FS_ACC); P_RH = program(FS_RH); P_PRE = program(FS_PRE);
  P_DOWN = program(FS_DOWN); P_UP = program(FS_UP); P_COMP = program(FS_COMP);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);

  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

}

function uploadVideo() {
  gl.bindTexture(gl.TEXTURE_2D, vidTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}
function cropFor(outW, outH) {
  const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  const va = vw / vh, ca = outW / outH;
  if (va > ca) { const s = ca / va; return [(1 - s) / 2, 0, s, 1]; }

function camUniforms(U, crop) {

}

// 残像を1フレーム進める（ライブ表示のときだけ）
function stepAccum(P, dt) {
  const crop = cropFor(canvas.width, canvas.height);
  const prev = acc[accIdx], next = acc[1 - accIdx];

  gl.useProgram(P_ACC.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, vidTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, prev.tex);
  camUniforms(P_ACC.u, crop);
  gl.uniform1i(P_ACC.u.uPrev, 1);
  gl.uniform1f(P_ACC.u.uK, accFresh ? 1 : 1 - Math.exp(-dt / P.tau));
  drawTri();
  accFresh = false; accIdx = 1 - accIdx;
  gl.activeTexture(gl.TEXTURE0);
}

function render(targetFbo, outW, outH, S, P, t, seed) {
  const crop = cropFor(outW, outH), aspect = outW / outH, accTex = acc[accIdx].tex;
  gl.disable(gl.BLEND);

  gl.useProgram(P_RH.p);

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, accTex);
  camUniforms(P_RH.u, crop);
  gl.uniform1i(P_RH.u.uAcc, 1);

  // 光の抜き出し

  gl.useProgram(P_PRE.p);

  gl.uniform1i(P_PRE.u.uRh, 0);

    gl.bindTexture(gl.TEXTURE_2D, s.tex);

  const U = P_COMP.u;

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, accTex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, S.rh.tex);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, L0.tex);

}

/* ================= camera ================= */
let stream = null, facing = 'environment', mirror = false, bypass = false;
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomedia');
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false, video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
  });
  video.srcObject = stream;
  await video.play();
  const tr = stream.getVideoTracks()[0];
  const s = tr.getSettings ? tr.getSettings() : {};
  mirror = s.facingMode ? s.facingMode === 'user' : facing === 'user';
  accFresh = true;
}

/* ================= 主役の追跡 ================= */
function setupTracking(aspect) {
  selAspect = aspect;
  SH = Math.max(8, Math.round(SW / aspect)); scan.width = SW; scan.height = SH;
  TH = Math.max(8, Math.round(TW / aspect)); trk.width = TW; trk.height = TH;
  clearSubject();
}
function drawScan() {
  const vw = video.videoWidth, vh = video.videoHeight, c = cropFor(canvas.width, canvas.height);
  sctx.setTransform(mirror ? -1 : 1, 0, 0, 1, mirror ? SW : 0, 0);
  sctx.drawImage(video, c[0] * vw, c[1] * vh, c[2] * vw, c[3] * vh, 0, 0, SW, SH);
  sctx.setTransform(1, 0, 0, 1, 0, 0);
}
function readTrack() {
  tctx.drawImage(scan, 0, 0, TW, TH);
  const d = tctx.getImageData(0, 0, TW, TH).data;
  const g = new Float32Array(TW * TH);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (.2126 * d[j] + .7152 * d[j+1] + .0722 * d[j+2]) / 255;
  gray = g; rgbData = d;
}
let key = null, keyH = null, keyOff = [0, 0], lastD = [0, 0], prevOff = [0, 0];
function resetTracking() { key = null; keyH = null; lastD = [0, 0]; off[0] = off[1] = 0; prevOff = [0, 0]; }
function half(A, w, h) {
  const hw = w >> 1, hh = h >> 1, out = new Float32Array(hw * hh);
  for (let y = 0; y < hh; y++) for (let x = 0; x < hw; x++) {
    const i = (y * 2) * w + x * 2;
    out[y * hw + x] = (A[i] + A[i + 1] + A[i + w] + A[i + w + 1]) * .25;
  }
  return out;
}
function sad(A, B, w, h, dx, dy, m) {
  let s = 0;
  for (let y = m; y < h - m; y++) {
    const ya = y * w, yb = (y + dy) * w + dx;
    for (let x = m; x < w - m; x++) s += Math.abs(A[ya + x] - B[yb + x]);
  }
  return s;
}
function parab(a, b, c) { const den = a - 2 * b + c; return den > 1e-9 ? clamp(.5 * (a - c) / den, -.5, .5) : 0; }
function motionStep() {
  if (!key) { key = gray.slice(); keyH = half(key, TW, TH); keyOff = off.slice(); lastD = [0, 0]; prevOff = off.slice(); return; }
  const hw = TW >> 1, hh = TH >> 1, curH = half(gray, TW, TH);
  const pcx = Math.round(lastD[0] / 2), pcy = Math.round(lastD[1] / 2);
  let best = Infinity, bx = 0, by = 0;
  for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) {
    const X = clamp(pcx + i, -4, 4), Y = clamp(pcy + j, -4, 4);
    const s = sad(keyH, curH, hw, hh, X, Y, 5);
    if (s < best) { best = s; bx = X; by = Y; }
  }
  const M = 10, F = (X, Y) => sad(key, gray, TW, TH, X, Y, M);
  let fb = Infinity, fx = 0, fy = 0;
  for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) {
    const X = clamp(bx * 2 + i, -8, 8), Y = clamp(by * 2 + j, -8, 8);
    const s = F(X, Y);
    if (s < fb) { fb = s; fx = X; fy = Y; }
  }
  if (fb / ((TW - 2 * M) * (TH - 2 * M)) > .09) { key = gray.slice(); keyH = curH; keyOff = off.slice(); lastD = [0, 0]; return; }
  const sx = Math.abs(fx) < 9 ? parab(F(fx - 1, fy), fb, F(fx + 1, fy)) : 0;
  const sy = Math.abs(fy) < 9 ? parab(F(fx, fy - 1), fb, F(fx, fy + 1)) : 0;

function chromaPx(i) { return chroma(rgbData[i*4] / 255, rgbData[i*4+1] / 255, rgbData[i*4+2] / 255); }
function trackSubject() {
  const S = subject;
  let px = S.x * TW + (off[0] - prevOff[0]) * TW, py = (1 - S.y) * TH - (off[1] - prevOff[1]) * TH;
  prevOff[0] = off[0]; prevOff[1] = off[1];
  if (S.ref) {
    // 主役と同じ色のまとまりの中心へ寄せる
    const R = 10;
    let sw = 0, sx = 0, sy = 0;
    for (let y = Math.max(0, Math.floor(py - R)); y <= Math.min(TH - 1, Math.ceil(py + R)); y++)
      for (let x = Math.max(0, Math.floor(px - R)); x <= Math.min(TW - 1, Math.ceil(px + R)); x++) {
        const c = chromaPx(y * TW + x), dc0 = c[0] - S.ref[0], dc1 = c[1] - S.ref[1];
        const w = Math.exp(-(dc0 * dc0 + dc1 * dc1) / .02) * (Math.hypot(c[0], c[1]) > .05 ? 1 : 0)
                * Math.exp(-((x - px) ** 2 + (y - py) ** 2) / (2 * 36));
        sw += w; sx += x * w; sy += y * w;
      }
    if (sw > 1.5) { px += (sx / sw - px) * .5; py += (sy / sw - py) * .5; }
  }

}
function setSubjectAt(u, v) {
  drawScan(); readTrack();
  const px = Math.round(u * TW), py = Math.round((1 - v) * TH);
  let r = 0, g = 0, b = 0, n = 0;
  for (let y = py - 1; y <= py + 1; y++) for (let x = px - 1; x <= px + 1; x++) {
    if (x < 0 || y < 0 || x >= TW || y >= TH) continue;
    const i = (y * TW + x) * 4; r += rgbData[i]; g += rgbData[i+1]; b += rgbData[i+2]; n++;
  }
  const ref = n ? chroma(r / n / 255, g / n / 255, b / n / 255) : [0, 0];
  subject = { x: u, y: v, ref: Math.hypot(ref[0], ref[1]) > .06 ? ref : null };
  resetTracking();

}
function clearSubject() { subject = null; resetTracking(); updateSubjectUI(false); }

/* ================= loop ================= */
let running = false, viewerOpen = false, lastT = 0, ringUntil = 0;
const ring = $('#ring');
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  const cap = 1800, m = Math.max(w, h);
  if (m > cap) { w = Math.round(w * cap / m); h = Math.round(h * cap / m); }
  if (w < 2 || h < 2) return;
  if (canvas.width !== w || canvas.height !== h || !live) {
    canvas.width = w; canvas.height = h;
    freeSet(live); live = makeSet(w, h);
    freeTarget(acc[0]); freeTarget(acc[1]);
    acc = [makeTarget(w, h), makeTarget(w, h)]; accIdx = 0; accFresh = true;
    const a = w / h;
    if (!selAspect || Math.abs(a / selAspect - 1) > .04) setupTracking(a);
  }
}
function loop(now) {
  if (!running) return;
  requestAnimationFrame(loop);
  if (document.hidden || viewerOpen || video.readyState < 2 || !video.videoWidth) { lastT = 0; return; }
  resize();
  const dt = lastT ? Math.min(.1, (now - lastT) / 1000) : 1 / 30; lastT = now;
  if (subject) { drawScan(); readTrack(); motionStep(); trackSubject(); }
  const P = params();
  uploadVideo();
  stepAccum(P, dt);
  render(null, canvas.width, canvas.height, live, P, now / 1000, Math.random() * 100);
  // 主役の目印
  const showRing = subject && now < ringUntil;
  ring.classList.toggle('show', !!showRing);
  if (subject) {
    const r = canvas.getBoundingClientRect();
    ring.style.transform = `translate(${r.left + subject.x * r.width}px, ${r.top + (1 - subject.y) * r.height}px)`;
  }
}

/* ================= capture ================= */
let lastBlob = null, lastURL = null;
async function capture() {
  if (!video.videoWidth || !live) return;
  const fl = $('#flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  const vw = video.videoWidth, vh = video.videoHeight, ca = canvas.width / canvas.height;
  let w, h;
  if (vw / vh > ca) { h = vh; w = Math.round(vh * ca); } else { w = vw; h = Math.round(vw / ca); }
  if (w * h < canvas.width * canvas.height) { w = canvas.width; h = canvas.height; }
  const maxSide = Math.min(2560, gl.getParameter(gl.MAX_TEXTURE_SIZE));
  const sc = Math.min(1, maxSide / Math.max(w, h));
  w = Math.round(w * sc); h = Math.round(h * sc);

  const out = makeTarget(w, h, RGBA8());
  const S = makeSet(w, h);
  const wasBypass = bypass; bypass = false;
  uploadVideo();
  render(out.fbo, w, h, S, params(), performance.now() / 1000, Math.random() * 100);
  bypass = wasBypass;
  const px = new Uint8Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, out.fbo);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  freeTarget(out); freeSet(S);

  const img = new ImageData(w, h), row = w * 4;
  for (let y = 0; y < h; y++) img.data.set(px.subarray((h - 1 - y) * row, (h - y) * row), y * row);
  const c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
  c2.getContext('2d').putImageData(img, 0, 0);
  const blob = await new Promise(r => c2.toBlob(r, 'image/jpeg', .92));
  if (!blob) return;
  lastBlob = blob;
  if (lastURL) URL.revokeObjectURL(lastURL);
  lastURL = URL.createObjectURL(blob);
  const th = $('#thumb'); th.style.backgroundImage = `url(${lastURL})`; th.disabled = false;
}
function fileName() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return `nijimi_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.jpg`;
}
async function saveLast() {
  if (!lastBlob) return;
  const name = fileName();
  const file = new File([lastBlob], name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = lastURL; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ================= UI ================= */
const tag = $('#tag'); let tagTimer = 0;
function showTag(text, ms) {
  tag.textContent = text; tag.classList.add('show');
  clearTimeout(tagTimer);
  if (ms) tagTimer = setTimeout(() => tag.classList.remove('show'), ms);
}
const hideTag = () => { clearTimeout(tagTimer); tag.classList.remove('show'); };

function bindSlider(id, outId, get, put) {
  const el = $(id), out = $(outId);
  const show = v => { el.value = v; out.textContent = v; el.style.setProperty('--p', v + '%'); };
  show(Math.round(get() * 100));
  el.addEventListener('input', () => { put(+el.value / 100); show(+el.value); saveSet(); });
  return show;
}
const showAmt = bindSlider('#amt', '#amtVal', () => set.amount, v => { set.amount = v; });
const showMem = bindSlider('#mem', '#memVal', () => set.memory, v => { set.memory = v; });

const leakBtn = $('#leakBtn');
const showLeak = () => leakBtn.classList.toggle('on', set.leak);
leakBtn.addEventListener('click', () => { set.leak = !set.leak; showLeak(); saveSet(); });
showLeak();

function updateSubjectUI(justSet) {
  $('#subjLabel').textContent = subject ? '主役：選択中 ✕' : '主役：自動';
  $('#subjBtn').classList.toggle('on', !!subject);
  if (justSet) ringUntil = performance.now() + 1400;
}
$('#subjBtn').addEventListener('click', () => {
  if (subject) { clearSubject(); showTag('主役は画面の中心になりました', 1800); }
  else showTag('主役にしたいものをタップしてください', 2400);
});

$('#shutter').addEventListener('click', capture);
$('#flip').addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCamera(); } catch (e) { facing = facing === 'environment' ? 'user' : 'environment'; }
  clearSubject();
});
$('#thumb').addEventListener('click', () => {
  if (!lastURL) return;
  $('#vimg').src = lastURL; $('#viewer').classList.add('open'); viewerOpen = true;
});
$('#vclose').addEventListener('click', () => { $('#viewer').classList.remove('open'); viewerOpen = false; });
$('#vsave').addEventListener('click', saveLast);

// 比較ボタン（押している間だけ元の映像）
const cap1 = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (_) {} };
const cmp = $('#cmp');
cmp.addEventListener('pointerdown', e => { cap1(cmp, e); bypass = true; showTag('元の映像'); });
['pointerup', 'pointercancel'].forEach(ev => cmp.addEventListener(ev, () => { bypass = false; hideTag(); }));

// 画面タップ：主役を選ぶ（主役の上をもう一度タップで解除）
const toUV = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
let down = null;
canvas.addEventListener('pointerdown', e => { cap1(canvas, e); down = toUV(e); });
canvas.addEventListener('pointerup', e => {
  if (!down || !video.videoWidth || !TW) { down = null; return; }
  const p = toUV(e), a = canvas.width / canvas.height;
  if (Math.hypot(p[0] - down[0], p[1] - down[1]) < .04) {
    if (subject && Math.hypot((p[0] - subject.x) * a, p[1] - subject.y) < .08) { clearSubject(); showTag('主役は画面の中心になりました', 1800); }
    else { setSubjectAt(p[0], p[1]); hideTag(); }
  }
  down = null;
});
canvas.addEventListener('pointercancel', () => { down = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && stream && video.paused) video.play().catch(() => {});
  accFresh = true;
});
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); running = false; });
canvas.addEventListener('webglcontextrestored', () => location.reload());

/* ================= start ================= */
const note = $('#note');
$('#go').addEventListener('click', async () => {
  note.classList.remove('err'); note.textContent = 'カメラを準備しています…';
  try { if (!P_ACC) initGL(); }
  catch (e) { note.classList.add('err'); note.textContent = 'この端末ではWebGL2が使えないため動かせません'; console.error(e); return; }
  try { await startCamera(); }
  catch (e) {
    note.classList.add('err');
    if (!window.isSecureContext) note.textContent = 'https のページで開いてください（カメラが使えません）';
    else if (e && e.name === 'NotAllowedError') note.textContent = 'カメラが許可されませんでした。ブラウザの設定から許可してください';
    else if (e && e.name === 'NotFoundError') note.textContent = 'カメラが見つかりませんでした';
    else note.textContent = 'カメラを起動できませんでした';
    console.error(e); return;
  }
  $('#start').classList.add('hide');
  running = true; requestAnimationFrame(loop);
  setTimeout(() => showTag('主役にしたいものをタップしてください', 3200), 900);
});

// テスト用
window.__nijimi = {
  capture, setSubjectAt, clearSubject,
  set(a, m, l) { if (a != null) { set.amount = a; showAmt(Math.round(a * 100)); } if (m != null) { set.memory = m; showMem(Math.round(m * 100)); } if (l != null) { set.leak = l; showLeak(); } },
  get fmt() { return FMT && FMT.type === gl.HALF_FLOAT ? 'half' : 'rgba8'; },
  get state() { return { subject: subject && { ...subject }, off: off.slice() }; },
};
})();
</script>
</body>
