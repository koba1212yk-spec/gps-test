<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6ece0">
<title>にじみカメラ</title>
<style>
:root{
  --ink:#4a3426; --ink2:#8d6d58; --glass:rgba(255,249,242,.62); --line:rgba(255,255,255,.72);
  --warm1:#f7b26e; --warm2:#ec7f45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f4e9dc;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#v{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.glass{background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}

/* ---------- top bar ---------- */
.topbar{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));
  display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.seg{display:flex;padding:3px;border-radius:20px;gap:2px}
.seg button{border:none;background:transparent;height:34px;padding:0 16px;border-radius:17px;
  font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(150,90,40,.16)}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0}
.round svg{width:22px;height:22px}
.round:active{transform:scale(.94)}

/* ---------- panel ---------- */
.panel{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  max-width:460px;margin:0 auto;padding:14px 16px 16px;border-radius:30px;
  box-shadow:0 10px 40px rgba(120,70,30,.18)}
.tools{display:none;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid rgba(120,80,50,.12)}
.sel .tools{display:block}
.toolrow{display:flex;gap:6px}
.tool{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;
  border:none;border-radius:16px;background:rgba(255,255,255,.36);color:var(--ink2);font-size:11px;font-weight:700;
  transition:background .2s,color .2s}
.tool svg{width:19px;height:19px}
.tool.on{background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(150,90,40,.16)}
.tool .badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff;font-size:9.5px;line-height:15px;font-style:normal;display:none}
.tool.has .badge{display:block}
.tool.reset{flex:.8}
.sub{display:none;align-items:center;justify-content:center;gap:10px;margin-top:8px;min-height:30px;flex-wrap:wrap}
.sub.on{display:flex}
.seg.sm{background:rgba(255,255,255,.36);border:none}
.seg.sm button{height:28px;padding:0 13px;font-size:12px;border-radius:14px}
.tip{font-size:11.5px;color:var(--ink2);letter-spacing:.03em}

.presets{display:flex;gap:8px}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:38px;border-radius:19px;
  border:none;background:rgba(255,255,255,.42);color:var(--ink2);font-size:13.5px;font-weight:700;
  letter-spacing:.04em;white-space:nowrap;transition:background .25s,color .25s,box-shadow .25s}
.chip i{width:13px;height:13px;border-radius:50%;flex:none}
.chip.on{background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(150,90,40,.18)}
.sw-mist{background:radial-gradient(circle at 40% 35%,#fff,#f6dcc0 60%,#e9bf98)}
.sw-film{background:radial-gradient(circle at 40% 35%,#fff1dc,#ff7a45 55%,#c23a22)}
.sw-leak{background:linear-gradient(135deg,#ffd27a,#ff8a4c 55%,#ff5f6d)}

.row{display:flex;align-items:center;gap:12px;margin:14px 4px 12px}
.row label{font-size:13px;font-weight:700;letter-spacing:.12em;flex:none}
.row output{font-size:12px;width:2.2em;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:30px;margin:0;background:transparent;--p:50%}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,#f8cfa2,#ee8a4a) 0/var(--p) 100% no-repeat,rgba(120,80,50,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;
  background:#fff;box-shadow:0 2px 8px rgba(120,70,30,.3),0 0 0 5px rgba(255,190,120,.32)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(120,80,50,.16)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:linear-gradient(90deg,#f8cfa2,#ee8a4a)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:none;border-radius:50%;background:#fff;
  box-shadow:0 2px 8px rgba(120,70,30,.3),0 0 0 5px rgba(255,190,120,.32)}

.shot{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
#thumb{width:50px;height:50px;border-radius:15px;border:2px solid rgba(255,255,255,.95);
  background:rgba(255,255,255,.38) center/cover no-repeat;box-shadow:0 3px 12px rgba(120,70,30,.18);padding:0}
#thumb:disabled{opacity:.55}
#shutter{width:76px;height:76px;border-radius:50%;border:none;background:#fff;position:relative;padding:0;
  box-shadow:0 0 0 5px rgba(255,255,255,.6),0 8px 26px rgba(214,118,48,.38);transition:transform .12s}
#shutter::after{content:"";position:absolute;inset:7px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fffaf0 0%,#ffd6a6 45%,#f4a062 80%,#ee8a4a 100%);
  box-shadow:0 0 18px rgba(255,170,90,.75)}
#shutter:active{transform:scale(.92)}
#flip{width:50px;height:50px;border-radius:50%;border:none;background:rgba(255,255,255,.55);
  display:grid;place-items:center;padding:0;box-shadow:0 3px 12px rgba(120,70,30,.14)}
#flip svg{width:24px;height:24px}

.tag{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);
  padding:8px 16px;border-radius:18px;font-size:12.5px;font-weight:700;letter-spacing:.06em;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.tag.show{opacity:1}
#flash{position:fixed;inset:0;background:#fff8ef;opacity:0;pointer-events:none}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

/* ---------- start ---------- */
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 28%,#fff9f0 0%,#f8e5cf 52%,#efcfac 100%);transition:opacity .6s}
#start.hide{opacity:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.75;animation:drift 14s ease-in-out infinite alternate}
.orb.a{width:260px;height:260px;left:-60px;top:12%;background:#ffc58f}
.orb.b{width:220px;height:220px;right:-50px;top:46%;background:#ff9f7a;animation-duration:17s}
.orb.c{width:180px;height:180px;left:30%;bottom:-40px;background:#ffe0a8;animation-duration:12s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-26px) scale(1.15)}}
#start .in{position:relative}
#start h1{margin:0 0 14px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;
  font-size:34px;letter-spacing:.2em;padding-left:.2em;color:#5a3a26;
  text-shadow:0 0 22px rgba(255,170,90,.9),0 0 48px rgba(255,190,120,.7)}
#start .sub{margin:0 0 44px;font-size:14px;letter-spacing:.16em;color:var(--ink2)}
.btn{height:56px;padding:0 38px;border-radius:28px;border:none;color:#fff;font-size:16px;font-weight:700;letter-spacing:.12em;
  background:linear-gradient(135deg,var(--warm1),var(--warm2));box-shadow:0 10px 30px rgba(236,127,69,.38)}
.btn:active{transform:scale(.97)}
#start .note{margin-top:18px;font-size:12px;color:var(--ink2);line-height:1.7}
#start .err{color:#b4462c;font-weight:700}

/* ---------- viewer ---------- */
#viewer{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  background:rgba(250,240,228,.88);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
#viewer.open{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#viewer img{max-width:100%;max-height:calc(100dvh - 170px);border-radius:18px;box-shadow:0 16px 50px rgba(120,70,30,.25);
  -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.vbtns{display:flex;gap:12px;margin-top:22px}
.vbtns .btn{height:50px;padding:0 30px;font-size:15px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 18px rgba(120,70,30,.14)}
.vhint{margin-top:12px;font-size:11.5px;color:var(--ink2)}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="flash"></div>
<div class="tag glass" id="tag"></div>

<div class="topbar">
  <div class="seg glass" id="modeSeg">
    <button data-m="all" class="on">全体</button>
    <button data-m="sel">選択</button>
  </div>
  <button class="round glass" id="cmp" aria-label="押している間、元の映像">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4a3426" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
    </svg>
  </button>
</div>

<div class="panel glass" id="panel">
  <div class="tools">
    <div class="toolrow" id="toolrow">
      <button class="tool" data-t="light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.6"/><path d="M12 3v3.2M12 17.8V21M3 12h3.2M17.8 12H21M5.6 5.6l2.2 2.2M16.2 16.2l2.2 2.2M5.6 18.4l2.2-2.2M16.2 7.8l2.2-2.2"/></svg>
        光<i class="badge" id="bLight"></i></button>
      <button class="tool" data-t="paint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.2L16.3 4.5a2.1 2.1 0 0 1 3 3L8 18.8z"/><path d="M14.5 6.3l3 3"/></svg>
        塗る<i class="badge"></i></button>
      <button class="tool" data-t="person">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2c1.2-4.1 4-6 7.2-6s6 1.9 7.2 6"/></svg>
        人物<i class="badge"></i></button>
      <button class="tool" data-t="shape">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 2.6"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>
        範囲<i class="badge"></i></button>
      <button class="tool reset" id="reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4v4h4"/></svg>
        リセット</button>
    </div>
    <div class="sub" data-for="light"><span class="tip">光をタップで追加／もう一度タップで解除</span></div>
    <div class="sub" data-for="paint">
      <div class="seg sm" id="paintMode"><button data-v="add" class="on">塗る</button><button data-v="erase">消す</button></div>
      <div class="seg sm" id="brush"><button data-v="s">小</button><button data-v="m" class="on">中</button><button data-v="l">大</button></div>
    </div>
    <div class="sub" data-for="person">
      <div class="seg sm" id="segMode"><button data-v="0" class="on">オフ</button><button data-v="1">人だけ</button><button data-v="2">背景だけ</button></div>
      <span class="tip" id="segStatus"></span>
    </div>
    <div class="sub" data-for="shape"><span class="tip">指でドラッグして囲む</span></div>
  </div>

  <div class="presets" id="presets">
    <button class="chip" data-k="mist"><i class="sw-mist"></i>ミスト</button>
    <button class="chip" data-k="film"><i class="sw-film"></i>フィルム</button>
    <button class="chip" data-k="leak"><i class="sw-leak"></i>光漏れ</button>
  </div>
  <div class="row">
    <label for="amt">滲み</label>
    <input type="range" id="amt" min="0" max="100" value="60">
    <output id="amtVal">60</output>
  </div>
  <div class="shot">
    <button id="thumb" aria-label="撮った写真" disabled></button>
    <button id="shutter" aria-label="撮影"></button>
    <button id="flip" aria-label="カメラ切替">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4a3426" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9a8 8 0 0 1 14.2-3.6L20 7.5"/><path d="M20 3.5v4h-4"/>
        <path d="M20 15a8 8 0 0 1-14.2 3.6L4 16.5"/><path d="M4 20.5v-4h4"/>
      </svg>
    </button>
  </div>
</div>

<div id="start">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="in">
    <h1>にじみカメラ</h1>
    <p class="sub">光が、やわらかく滲む。</p>
    <button class="btn" id="go">カメラをひらく</button>
    <div class="note" id="note">カメラの使用を許可してください</div>
  </div>
</div>

<div id="viewer">
  <img id="vimg" alt="撮った写真">
  <div class="vbtns">
    <button class="btn ghost" id="vclose">もどる</button>
    <button class="btn" id="vsave">保存する</button>
  </div>
  <div class="vhint">保存できないときは、写真を長押ししても保存できます</div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const video = $('#v'), canvas = $('#c');
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ================= presets ================= */
const PRESETS = {
  mist: { thr:.58, knee:.55, hot:2.2, intensity:2.1, scatter:.78, tint:[1,.87,.74], tintAmt:.35,
          warm:.35, contrast:.96, sat:.97, lift:.03, vig:.22, grain:.045, leak:0 },
  film: { thr:.66, knee:.4,  hot:3.0, intensity:2.6, scatter:.62, tint:[1,.32,.12], tintAmt:.85,
          warm:.55, contrast:1.03, sat:.9, lift:.055, vig:.36, grain:.10, leak:0 },
  leak: { thr:.62, knee:.5,  hot:2.4, intensity:1.7, scatter:.76, tint:[1,.68,.4], tintAmt:.5,
          warm:.6,  contrast:.98, sat:.97, lift:.045, vig:.2, grain:.075, leak:.9 },
};
let presetKey = 'mist', amount = .6;
try {
  const s = JSON.parse(localStorage.getItem('nijimi-cam') || '{}');
  if (PRESETS[s.p]) presetKey = s.p;
  if (typeof s.a === 'number') amount = clamp(s.a, 0, 1);
} catch (e) {}
const saveState = () => { try { localStorage.setItem('nijimi-cam', JSON.stringify({p:presetKey, a:amount})); } catch (e) {} };

function params() {
  const p = PRESETS[presetKey], k = amount;
  const mult = k < .5 ? k * 2 : 1 + (k - .5) * 2 * 1.7;
  const thr = clamp(p.thr - (k - .5) * .36, .2, .95);
  const thrLin = Math.pow(thr, 2.2);
  const tl = p.tint[0]*.2126 + p.tint[1]*.7152 + p.tint[2]*.0722;
  const norm = 1 + (tl - 1) * .6;
  return {
    thr: thrLin, knee: thrLin * p.knee, hot: p.hot,
    intensity: p.intensity * mult,
    scatter: clamp(p.scatter + (k - .5) * .32, .35, .9),
    tint: p.tint.map(v => v / norm), tintAmt: p.tintAmt,
    warm: p.warm, contrast: p.contrast, sat: p.sat, lift: p.lift, vig: p.vig, grain: p.grain, leak: p.leak,
  };
}

/* ================= selection state ================= */
const sel = { on:false, tool:'light', paintMode:'add', brush:'m', segMode:0 };
const lights = [];            // {x,y(画面uv, y上向き), lum, rad(追跡px)}
let shape = null;             // {cx,cy,rx,ry}（ワールド座標）
const off = [0, 0];           // 映像の動き（画面uv）。塗りと範囲はこれだけずらして表示
let hasPaint = false, paintDirty = true, maskShowUntil = 0, touching = false;
const MAX_LIGHTS = 8;
const BRUSH = { s:.045, m:.085, l:.15 };

// 塗り用キャンバス（ワールド座標 -1〜2 の3画面分）
const pc = document.createElement('canvas'), pctx = pc.getContext('2d');
let PW = 0, PH = 0;
// 解析用の縮小フレーム（画面と同じ切り抜き・左右反転）
const scan = document.createElement('canvas'), sctx = scan.getContext('2d', { willReadFrequently:true });
const trk = document.createElement('canvas'), tctx = trk.getContext('2d', { willReadFrequently:true });
const SW = 160, TW = 80;
let SH = 0, TH = 0, gray = null, selAspect = 0;

/* ================= WebGL ================= */
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, stencil:false,
  premultipliedAlpha:false, preserveDrawingBuffer:false, powerPreference:'high-performance' });

const LEVELS = 7;
let FMT = null, ENC = 1;

const VS = `#version 300 es
layout(location=0) in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*.5+.5; gl_Position = vec4(aPos,0.,1.); }`;

const COMMON = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
const vec3 LUMA = vec3(.2126,.7152,.0722);
`;

// 選択マスク（光源・塗り・人物・範囲の和集合）
const MASK = `
uniform float uSelect, uSegMode, uAspect;
uniform sampler2D uPaint, uSeg;
uniform vec2 uOff;
uniform vec4 uLights[8];
uniform vec4 uShape;
float maskAt(vec2 uv){
  float m = texture(uPaint, (uv - uOff + 1.)/3.).a;
  if(uSegMode > .5){
    float s = texture(uSeg, vec2(uv.x, 1. - uv.y)).r;
    s = smoothstep(.25, .75, s);
    m = max(m, uSegMode < 1.5 ? s : 1. - s);
  }
  for(int i = 0; i < 8; i++){
    vec4 L = uLights[i];
    if(L.w > .5){ vec2 d = (uv - L.xy)*vec2(uAspect, 1.); m = max(m, exp(-dot(d,d)/(L.z*L.z))); }
  }
  if(uShape.z > 0.){
    vec2 d = (uv - (uShape.xy + uOff))/uShape.zw;
    m = max(m, 1. - smoothstep(.78, 1.08, length(d)));
  }
  return clamp(m, 0., 1.);
}
`;

const FS_PRE = COMMON + MASK + `
uniform sampler2D uVideo; uniform vec4 uCrop; uniform float uMirror; uniform vec2 uDst;
uniform vec3 uThr; uniform float uEnc;
vec3 fetch(vec2 p){ return pow(texture(uVideo,p).rgb, vec3(2.2)); }
void main(){
  vec2 uv = vUv; if(uMirror > .5) uv.x = 1. - uv.x;
  vec2 v = uCrop.xy + uv*uCrop.zw;
  vec2 d = uCrop.zw*uDst*.25;
  vec3 a = fetch(v+vec2(-d.x,-d.y)), b = fetch(v+vec2(d.x,-d.y));
  vec3 c = fetch(v+vec2(-d.x, d.y)), e = fetch(v+vec2(d.x, d.y));
  float wa = 1./(1.+dot(a,LUMA)), wb = 1./(1.+dot(b,LUMA)), wc = 1./(1.+dot(c,LUMA)), we = 1./(1.+dot(e,LUMA));
  vec3 col = (a*wa+b*wb+c*wc+e*we)/(wa+wb+wc+we);
  float br = max(col.r, max(col.g, col.b));
  float thr = uThr.x, knee = max(uThr.y, 1e-4);
  float soft = clamp(br - thr + knee, 0., 2.*knee); soft = soft*soft/(4.*knee);
  float contrib = max(soft, br - thr)/max(br, 1e-4);
  float hot = 1. + uThr.z*smoothstep(.72, .98, br);
  float m = uSelect > .5 ? maskAt(vUv) : 1.;
  o = vec4(col*contrib*hot*uEnc*m, m);
}`;

const FS_DOWN = COMMON + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 s = texture(uTex, vUv)*4.;
  s += texture(uTex, vUv - uTexel);
  s += texture(uTex, vUv + uTexel);
  s += texture(uTex, vUv + vec2(uTexel.x,-uTexel.y));

uniform vec4 uCrop; uniform float uMirror, uEnc, uBypass, uTime, uSeed, uAdapt, uShowMask;

/* ================= camera ================= */
let stream = null, facing = 'environment', mirror = false, bypass = false;

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomedia');
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },

  video.srcObject = stream;

  const tr = stream.getVideoTracks()[0];
  const s = tr.getSettings ? tr.getSettings() : {};

/* ================= 解析フレーム ================= */

/* ---- 映像全体の動き（キーフレームとのずれをブロック照合） ---- */

/* ---- 光源の追跡 ---- */

}
function toggleLightAt(u, v) {
  const a = canvas.width / canvas.height;
  for (let i = 0; i < lights.length; i++) {
    const L = lights[i], r = (L.rad * 2.2 + 2.5) / TH;
    if (Math.hypot((u - L.x) * a, v - L.y) < Math.max(r, .05)) { lights.splice(i, 1); updateBadges(); return; }
  }
  if (lights.length >= MAX_LIGHTS) { showTag('光は' + MAX_LIGHTS + 'つまでです', 1800); return; }
  if (!gray) { drawScan(); readTrack(); }
  const px = u * TW, py = (1 - v) * TH;
  // タップした近くで一番明るい点に吸い付く
  let bx = px, by = py, peak = -1;
  const R = 6;
  for (let y = Math.max(0, Math.floor(py - R)); y <= Math.min(TH - 1, Math.ceil(py + R)); y++)
    for (let x = Math.max(0, Math.floor(px - R)); x <= Math.min(TW - 1, Math.ceil(px + R)); x++) {
      if (Math.hypot(x - px, y - py) > R) continue;
      const g = gray[y * TW + x];
      if (g > peak) { peak = g; bx = x; by = y; }
    }
  let L;
  if (peak > .3) {
    const b = blobAt(bx, by, 6, peak * .75);
    L = { x: b.x / TW, y: 1 - b.y / TH, lum: peak, rad: Math.max(1, Math.sqrt(b.cnt / Math.PI)) };
  } else {
    L = { x: u, y: v, lum: peak, rad: 3 };
  }
  lights.push(L);
  if (!key) { prevOff = off.slice(); }
  updateBadges();
}

/* ---- 塗る ---- */
function stamp(cx, cy, r) {
  const g = pctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, 'rgba(255,255,255,.55)');
  g.addColorStop(.55, 'rgba(255,255,255,.35)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  pctx.fillStyle = g;
  pctx.beginPath(); pctx.arc(cx, cy, r, 0, Math.PI * 2); pctx.fill();
}
function paintStroke(a, b) {
  const toC = p => [((p[0] - off[0]) + 1) / 3 * PW, (1 - ((p[1] - off[1]) + 1) / 3) * PH];
  const A = toC(a), B = toC(b), r = BRUSH[sel.brush] * PW / 3;
  pctx.globalCompositeOperation = sel.paintMode === 'erase' ? 'destination-out' : 'source-over';
  const dist = Math.hypot(B[0] - A[0], B[1] - A[1]), step = Math.max(1, r * .25);
  const n = Math.max(1, Math.ceil(dist / step));
  for (let i = 0; i <= n; i++) stamp(A[0] + (B[0] - A[0]) * i / n, A[1] + (B[1] - A[1]) * i / n, r);
  pctx.globalCompositeOperation = 'source-over';
  if (sel.paintMode === 'add') hasPaint = true;
  paintDirty = true;
  if (!key) prevOff = off.slice();
}

/* ---- 範囲 ---- */
function setShape(a, b) {
  shape = {
    cx: (a[0] + b[0]) / 2 - off[0], cy: (a[1] + b[1]) / 2 - off[1],
    rx: Math.max(Math.abs(b[0] - a[0]) / 2, .03), ry: Math.max(Math.abs(b[1] - a[1]) / 2, .02),
  };
}

function clearSelection(withSeg = true) {
  lights.length = 0; shape = null; hasPaint = false;
  if (PW) { pctx.clearRect(0, 0, PW, PH); paintDirty = true; }
  off[0] = off[1] = 0; prevOff = [0, 0]; resetTracking();
  if (withSeg) setSegMode(0);
  updateBadges();
}

/* ---- 人物（MediaPipe） ---- */
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const SEG_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
let segmenter = null, segLoading = false, segTs = 0, segData = null, frameNo = 0;
async function loadSeg() {
  if (segmenter || segLoading) return;
  segLoading = true; $('#segStatus').textContent = '読み込み中…';
  try {
    const vision = await import(MP + '/vision_bundle.mjs');
    const fs = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
    const opts = d => ({ baseOptions: { modelAssetPath: SEG_MODEL, delegate: d }, runningMode: 'VIDEO',
      outputCategoryMask: false, outputConfidenceMasks: true });
    try { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('GPU')); }
    catch (e) { segmenter = await vision.ImageSegmenter.createFromOptions(fs, opts('CPU')); }
    $('#segStatus').textContent = '';
  } catch (e) {
    console.error(e); $('#segStatus').textContent = '読み込めませんでした';
  }
  segLoading = false;
}
function runSeg() {
  segTs = Math.max(segTs + 1, Math.round(performance.now()));
  segmenter.segmentForVideo(scan, segTs, res => {
    const ms = res.confidenceMasks;
    if (!ms || !ms.length) return;
    const m = ms[0], inv = ms.length > 1;      // 複数チャンネルなら0番が背景
    const arr = m.getAsFloat32Array(), w = m.width, h = m.height;
    if (!segData || segData.length !== w * h) segData = new Uint8Array(w * h);
    for (let i = 0; i < arr.length; i++) {
      const p = inv ? 1 - arr[i] : arr[i];
      segData[i] = segData[i] * .35 + clamp(p, 0, 1) * 255 * .65;
    }
    gl.bindTexture(gl.TEXTURE_2D, segTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, segData);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  });
}

function selectionStep() {
  const needTrack = hasPaint || !!shape || lights.length > 0;
  const needSeg = sel.segMode > 0 && segmenter;
  if (!needTrack && !needSeg) return;
  drawScan();
  if (needTrack) { readTrack(); motionStep(); trackLights(); }
  if (needSeg && (frameNo++ & 1) === 0) { try { runSeg(); } catch (e) { console.error(e); } }
}

/* ================= loop ================= */
let running = false, viewerOpen = false;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  const cap = 1800, m = Math.max(w, h);
  if (m > cap) { w = Math.round(w * cap / m); h = Math.round(h * cap / m); }
  if (w < 2 || h < 2) return;
  if (canvas.width !== w || canvas.height !== h || !chain) {
    canvas.width = w; canvas.height = h;
    freeChain(chain); chain = makeChain(w, h);
    const a = w / h;
    if (!selAspect || Math.abs(a / selAspect - 1) > .04) setupSelection(a);
  }
}
function maskVisibility(now) {
  if (!sel.on) return 0;
  if (touching) return 1;
  return clamp((maskShowUntil - now) / 500, 0, 1);
}
function loop(now) {
  if (!running) return;
  requestAnimationFrame(loop);
  if (document.hidden || viewerOpen || video.readyState < 2 || !video.videoWidth) return;
  resize();
  if (sel.on) selectionStep();
  uploadVideo(); uploadPaint();
  render(null, canvas.width, canvas.height, chain, params(), now / 1000, Math.random() * 100, maskVisibility(now));
}

/* ================= capture ================= */
let lastBlob = null, lastURL = null;
async function capture() {
  if (!video.videoWidth || !chain) return;
  const fl = $('#flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');

  const vw = video.videoWidth, vh = video.videoHeight, ca = canvas.width / canvas.height;
  let w, h;
  if (vw / vh > ca) { h = vh; w = Math.round(vh * ca); } else { w = vw; h = Math.round(vw / ca); }
  if (w * h < canvas.width * canvas.height) { w = canvas.width; h = canvas.height; }
  const maxSide = Math.min(2560, gl.getParameter(gl.MAX_TEXTURE_SIZE));
  const sc = Math.min(1, maxSide / Math.max(w, h));
  w = Math.round(w * sc); h = Math.round(h * sc);

  const out = makeTarget(w, h, RGBA8());
  const ch = makeChain(w, h);
  const wasBypass = bypass; bypass = false;
  uploadVideo(); uploadPaint();
  render(out.fbo, w, h, ch, params(), performance.now() / 1000, Math.random() * 100, 0);
  bypass = wasBypass;
  const px = new Uint8Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, out.fbo);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  freeTarget(out); freeChain(ch);

  const img = new ImageData(w, h), row = w * 4;
  for (let y = 0; y < h; y++) img.data.set(px.subarray((h - 1 - y) * row, (h - y) * row), y * row);
  const c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
  c2.getContext('2d').putImageData(img, 0, 0);
  const blob = await new Promise(r => c2.toBlob(r, 'image/jpeg', .92));
  if (!blob) return;
  lastBlob = blob;
  if (lastURL) URL.revokeObjectURL(lastURL);
  lastURL = URL.createObjectURL(blob);
  const th = $('#thumb'); th.style.backgroundImage = `url(${lastURL})`; th.disabled = false;
}
function fileName() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return `nijimi_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.jpg`;
}
async function saveLast() {
  if (!lastBlob) return;
  const name = fileName();
  const file = new File([lastBlob], name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = lastURL; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ================= UI ================= */
const tag = $('#tag'); let tagTimer = 0;
function showTag(text, ms) {
  tag.textContent = text; tag.classList.add('show');
  clearTimeout(tagTimer);
  if (ms) tagTimer = setTimeout(() => tag.classList.remove('show'), ms);
}
const hideTag = () => { clearTimeout(tagTimer); tag.classList.remove('show'); };

function setPreset(k) {
  presetKey = k;
  $$('.chip').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  saveState();
}
const amt = $('#amt'), amtVal = $('#amtVal');
function setAmount(v) {
  amount = v / 100;
  amt.value = v; amtVal.textContent = v; amt.style.setProperty('--p', v + '%');
}
amt.addEventListener('input', () => { setAmount(+amt.value); saveState(); });
$('#presets').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) setPreset(b.dataset.k); });
setPreset(presetKey); setAmount(Math.round(amount * 100));

const TOOL_TIPS = { light:'光をタップして選んでください', paint:'指でなぞって塗ってください', person:'人だけ／背景だけを選んでください', shape:'指でドラッグして囲んでください' };
function hasAnySelection() { return lights.length > 0 || hasPaint || !!shape || sel.segMode > 0; }
function setMode(m) {
  sel.on = m === 'sel';
  $$('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#panel').classList.toggle('sel', sel.on);
  if (sel.on) { maskShowUntil = performance.now() + 1500; if (!hasAnySelection()) showTag(TOOL_TIPS[sel.tool], 2600); }
  else hideTag();
}
function setTool(t) {
  sel.tool = t;
  $$('.tool[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $$('.sub').forEach(s => s.classList.toggle('on', s.dataset.for === t));
  maskShowUntil = performance.now() + 1500;
  if (!hasAnySelection()) showTag(TOOL_TIPS[t], 2400);
}
function setSegMode(v) {
  sel.segMode = v;
  $$('#segMode button').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  if (v > 0) loadSeg();
  maskShowUntil = performance.now() + 1500;
  updateBadges();
}
function updateBadges() {
  const bl = $('#bLight');
  bl.textContent = lights.length || '';
  $('.tool[data-t="light"]').classList.toggle('has', lights.length > 0);
  $('.tool[data-t="paint"]').classList.toggle('has', hasPaint);
  $('.tool[data-t="person"]').classList.toggle('has', sel.segMode > 0);
  $('.tool[data-t="shape"]').classList.toggle('has', !!shape);
}
const bindSeg = (id, fn) => $(id).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  $$(id + ' button').forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v);
});
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); });
$('#toolrow').addEventListener('click', e => { const b = e.target.closest('.tool[data-t]'); if (b) setTool(b.dataset.t); });
bindSeg('#paintMode', v => { sel.paintMode = v; });
bindSeg('#brush', v => { sel.brush = v; });
$('#segMode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSegMode(+b.dataset.v); });
$('#reset').addEventListener('click', () => { clearSelection(true); maskShowUntil = performance.now() + 800; });
setTool('light');

$('#shutter').addEventListener('click', capture);
$('#flip').addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCamera(); } catch (e) { facing = facing === 'environment' ? 'user' : 'environment'; }
  clearSelection(false);
});
$('#thumb').addEventListener('click', () => {
  if (!lastURL) return;
  $('#vimg').src = lastURL; $('#viewer').classList.add('open'); viewerOpen = true;
});
$('#vclose').addEventListener('click', () => { $('#viewer').classList.remove('open'); viewerOpen = false; });
$('#vsave').addEventListener('click', saveLast);

// 比較ボタン（押している間だけ元の映像）
const cmp = $('#cmp');
const cmpOn = () => { bypass = true; showTag('元の映像'); };
const cmpOff = () => { if (bypass) { bypass = false; hideTag(); } };
const capture1 = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (_) {} };
cmp.addEventListener('pointerdown', e => { capture1(cmp, e); cmpOn(); });
['pointerup', 'pointercancel'].forEach(ev => cmp.addEventListener(ev, cmpOff));

// 画面のタッチ：全体モードは長押しで比較、選択モードは各ツール
const toUV = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
let ptr = null;
canvas.addEventListener('pointerdown', e => {
  capture1(canvas, e);
  const p = toUV(e);
  if (!sel.on) { ptr = { type:'hold' }; cmpOn(); return; }
  if (!PW) return;
  touching = true; hideTag();
  if (sel.tool === 'paint') { ptr = { type:'paint', last:p }; paintStroke(p, p); updateBadges(); }
  else if (sel.tool === 'shape') { ptr = { type:'shape', start:p }; setShape(p, p); updateBadges(); }
  else if (sel.tool === 'light') { ptr = { type:'tap', start:p }; }
  else ptr = null;
});
canvas.addEventListener('pointermove', e => {
  if (!ptr) return;
  const p = toUV(e);
  if (ptr.type === 'paint') { paintStroke(ptr.last, p); ptr.last = p; }
  else if (ptr.type === 'shape') setShape(ptr.start, p);
});
const endPtr = e => {
  if (!ptr) { touching = false; return; }
  if (ptr.type === 'hold') cmpOff();
  else if (ptr.type === 'tap' && e.type === 'pointerup') {
    const p = toUV(e);
    if (Math.hypot(p[0] - ptr.start[0], p[1] - ptr.start[1]) < .04) toggleLightAt(p[0], p[1]);
  }
  ptr = null; touching = false; maskShowUntil = performance.now() + 1200; updateBadges();
};
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && stream && video.paused) video.play().catch(() => {});
});
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); running = false; });
canvas.addEventListener('webglcontextrestored', () => location.reload());

/* ================= start ================= */
const note = $('#note');
$('#go').addEventListener('click', async () => {
  note.classList.remove('err'); note.textContent = 'カメラを準備しています…';
  try { if (!P_PRE) initGL(); }
  catch (e) { note.classList.add('err'); note.textContent = 'この端末ではWebGL2が使えないため動かせません'; console.error(e); return; }
  try { await startCamera(); }
  catch (e) {
    note.classList.add('err');
    if (!window.isSecureContext) note.textContent = 'https のページで開いてください（カメラが使えません）';
    else if (e && e.name === 'NotAllowedError') note.textContent = 'カメラが許可されませんでした。ブラウザの設定から許可してください';
    else if (e && e.name === 'NotFoundError') note.textContent = 'カメラが見つかりませんでした';
    else note.textContent = 'カメラを起動できませんでした';
    console.error(e); return;
  }
  $('#start').classList.add('hide');
  running = true; requestAnimationFrame(loop);
  setTimeout(() => showTag('目のボタンを押している間、元の映像', 3200), 900);
});

// テスト用
window.__nijimi = {
  capture, setPreset, setAmount, setMode, setTool, setSegMode, toggleLightAt, paintStroke, setShape, clearSelection,
  get fmt() { return FMT && FMT.type === gl.HALF_FLOAT ? 'half' : 'rgba8'; },
  get state() { return { off: off.slice(), lights: lights.map(l => ({...l})), hasPaint, shape, seg: !!segmenter, segLoading }; },
};
})();
</script>
</body>
</html>
