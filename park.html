<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>公園グラフィティ</title>
    <style>
      :root {
        --bg: #101014; --panel: #1b1b21; --ink: #f2f2f5; --ink-dim: #a7a7b3;
        --line: #33333d; --accent: #ff2e88; --accent-ink: #ffffff;
        --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: var(--sans); -webkit-tap-highlight-color: transparent;
      }
      #app { display: flex; flex-direction: column; min-height: 100dvh; max-width: 640px; margin: 0 auto; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); gap: 10px; }
      h1 { font-size: 18px; margin: 2px 0 0; }
      .status { font-size: 13px; color: var(--ink-dim); line-height: 1.6; min-height: 1.6em; margin: 0; }
      .status b { color: var(--ink); }
      #stageWrap { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
      #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #draw { position: absolute; inset: 0; width: 100%; height: 100%; }
      #banner {
        position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
        background: rgba(0,0,0,.65); color: #fff; font-size: 13px; font-weight: 700;
        padding: 6px 12px; border-radius: 999px; display: none; white-space: nowrap;
      }
      #banner.on { display: block; }
      .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button {
        font: inherit; font-size: 15px; font-weight: 600; min-height: 2.8rem;
        border: 1px solid var(--line); background: var(--panel); color: var(--ink);
        border-radius: 10px; padding: 8px 14px; cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      button.on { background: #2c2c35; border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: .45; }
      button:active { transform: translateY(1px); }
      .chip {
        width: 38px; height: 38px; min-height: 38px; border-radius: 50%; padding: 0;
        border: 3px solid transparent;
      }
      .chip.on { border-color: #fff; }
      .small { font-size: 11.5px; color: var(--ink-dim); }
      .g-item { border-top: 1px solid var(--line); padding: 9px 2px; font-size: 13.5px; line-height: 1.65; }
      .g-item button { min-height: 2.1rem; padding: 4px 10px; font-size: 12.5px; }
      h2 { font-size: 14px; margin: 6px 0 0; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>公園グラフィティ</h1>
      <p class="status" id="status">読み込み中…</p>

      <div id="stageWrap">
        <video id="cam" playsinline muted autoplay></video>
        <canvas id="draw"></canvas>
        <div id="banner"></div>
      </div>

      <div class="btn-row">
        <button id="modeDraw" class="on" type="button">描く</button>
        <button id="modeView" type="button">見る</button>
        <button id="camBtn" class="primary" type="button">カメラ開始</button>
      </div>

      <div id="drawPanel">
        <div class="btn-row" id="colors"></div>
        <div class="btn-row" style="margin-top:8px">
          <button id="undoBtn" type="button">1本戻す</button>
          <button id="clearBtn" type="button">全部消す</button>
          <button id="saveBtn" class="primary" type="button">ここに貼る</button>
        </div>
        <p class="small">つまむ（親指と人差し指をくっつける）と線が引けます。離すとペンが上がります。指先の丸がペンの位置です。</p>
      </div>

      <div id="viewPanel" class="hidden">
        <p class="small" id="viewInfo">近くの落書きを探しています…</p>
        <h2>保存した落書き</h2>
        <div id="gList"></div>
      </div>
    </div>

    <script type="module">
      import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/dist/vision_bundle.mjs";

      const $ = (id) => document.getElementById(id);
      const status = (t) => { $("status").innerHTML = t; };

      /* ================= storage ================= */
      const G_KEY = "gyosen-graffiti-v1";
      let graffiti = [];
      try {
        const s = JSON.parse(localStorage.getItem(G_KEY) || "[]");
        if (Array.isArray(s)) graffiti = s;
      } catch (e) { graffiti = []; }
      function saveStore() {
        try { localStorage.setItem(G_KEY, JSON.stringify(graffiti)); } catch (e) { /* ignore */ }
      }

      /* ================= helpers ================= */
      function haversineM(a, b) {
        const R = 6371000, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
        const s = Math.sin(dLat / 2) ** 2 +
          Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(s));
      }
      const pad2 = (n) => (n < 10 ? "0" : "") + n;
      function fmtDate(iso) {
        const d = new Date(iso);
        return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      /* ================= state ================= */
      const COLORS = ["#ff2e88", "#ff7a00", "#ffd400", "#2ee66b", "#00b7ff", "#8a5cff", "#ffffff", "#16161c"];
      let color = COLORS[0];
      let mode = "draw";               // draw | view
      let strokes = [];                // current drawing [{color, w, pts:[[x,y]...]}] (normalized)
      let curStroke = null;
      let smooth = null;               // smoothed fingertip {x,y}
      let pinch = false;
      let myPos = null;                // {lat,lng,acc}
      let viewTarget = null;           // graffiti shown on camera
      let viewIsPreview = false;
      let watchId = null;

      /* ================= colors UI ================= */
      const colorsEl = $("colors");
      COLORS.forEach((c) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip" + (c === color ? " on" : "");
        b.style.background = c; b.setAttribute("aria-label", "色 " + c);
        b.addEventListener("click", () => {
          color = c;
          colorsEl.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === b));
        });
        colorsEl.appendChild(b);
      });

      /* ================= camera + hand tracking ================= */
      const video = $("cam");
      const canvas = $("draw");
      const ctx = canvas.getContext("2d");
      let landmarker = null;
      let camStarted = false;

      async function initLandmarker() {
        const fileset = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        const opts = (delegate) => ({
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate
          },
          runningMode: "VIDEO", numHands: 1
        });
        try { landmarker = await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
        catch (e) { landmarker = await HandLandmarker.createFromOptions(fileset, opts("CPU")); }
      }

      async function startCam() {
        if (camStarted) return;
        camStarted = true;
        $("camBtn").disabled = true;
        status("カメラと手の認識を準備中…（初回は少し時間がかかります）");
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 960 } },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
        } catch (e) {
          status("カメラを開けませんでした。Chromeのカメラ許可を確認してね");
          camStarted = false; $("camBtn").disabled = false;
          return;
        }
        try {
          await initLandmarker();
          status(mode === "draw"
            ? "準備OK。カメラに手をかざして、つまんで描いてみて"
            : "準備OK。落書きのある場所に近づくと浮かびます");
        } catch (e) {
          status("手の認識を読み込めませんでした。通信状態を確認して、再読み込みしてね");
          return;
        }
        requestAnimationFrame(loop);
      }
      $("camBtn").addEventListener("click", startCam);

      let lastVideoTime = -1;
      function loop() {
        requestAnimationFrame(loop);
        if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          try {
            const res = landmarker.detectForVideo(video, performance.now());
            handleHands(res);
          } catch (e) { /* transient */ }
        }
        render();
      }

      function handleHands(res) {
        const lms = res && res.landmarks && res.landmarks[0];
        if (!lms) {
          pinch = false; curStroke = null; smooth = null;
          return;
        }
        const tip = lms[8], thumb = lms[4];
        const d = Math.hypot(tip.x - thumb.x, tip.y - thumb.y);
        pinch = d < 0.055;
        if (!smooth) smooth = { x: tip.x, y: tip.y };
        smooth.x += (tip.x - smooth.x) * 0.45;
        smooth.y += (tip.y - smooth.y) * 0.45;
        if (mode !== "draw") return;
        if (pinch) {
          if (!curStroke) {
            curStroke = { color, w: 0.03, pts: [[smooth.x, smooth.y]] };
            strokes.push(curStroke);
          } else {
            const last = curStroke.pts[curStroke.pts.length - 1];
            if (Math.hypot(smooth.x - last[0], smooth.y - last[1]) > 0.004) {
              curStroke.pts.push([smooth.x, smooth.y]);
            }
          }
        } else {
          curStroke = null;
        }
      }

      /* ================= rendering ================= */
      function drawStroke(s, W, H) {
        if (s.pts.length < 2) {
          // dot
          ctx.beginPath();
          ctx.arc(s.pts[0][0] * W, s.pts[0][1] * H, s.w * W * 0.5, 0, Math.PI * 2);
          ctx.fillStyle = s.color; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1;
          return;
        }
        const passes = [[2.1, 0.13], [1.0, 0.9]];
        for (const [mult, alpha] of passes) {
          ctx.beginPath();
          s.pts.forEach(([x, y], i) => {
            const px = x * W, py = y * H;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          });
          ctx.strokeStyle = s.color;
          ctx.lineWidth = Math.max(2, s.w * W * mult);
          ctx.globalAlpha = alpha;
          ctx.lineJoin = "round"; ctx.lineCap = "round";
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      function render() {
        const W = canvas.clientWidth, H = canvas.clientHeight;
        if (!W) return;
        const dpr = window.devicePixelRatio || 1;
        if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
          canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        const show = mode === "draw" ? strokes : (viewTarget ? viewTarget.strokes : []);
        show.forEach((s) => drawStroke(s, W, H));
        // fingertip cursor
        if (smooth && landmarker) {
          ctx.beginPath();
          ctx.arc(smooth.x * W, smooth.y * H, pinch ? 13 : 9, 0, Math.PI * 2);
          ctx.strokeStyle = pinch ? "#ff2e88" : "rgba(255,255,255,.9)";
          ctx.lineWidth = 3; ctx.stroke();
          if (pinch) {
            ctx.beginPath();
            ctx.arc(smooth.x * W, smooth.y * H, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = "#ff2e88"; ctx.fill();
          }
        }
      }
      window.addEventListener("resize", render);

      /* ================= draw actions ================= */
      $("undoBtn").addEventListener("click", () => { strokes.pop(); curStroke = null; });
      $("clearBtn").addEventListener("click", () => { strokes = []; curStroke = null; });
      $("saveBtn").addEventListener("click", () => {
        if (!strokes.length) { status("まだ何も描いてないよ"); return; }
        if (!("geolocation" in navigator)) { status("このブラウザはGPSに未対応です"); return; }
        status("位置を取っています…");
        navigator.geolocation.getCurrentPosition((pos) => {
          const g = {
            id: Date.now(),
            lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy),
            date: new Date().toISOString(),
            strokes: strokes.map((s) => ({
              color: s.color, w: s.w,
              pts: s.pts.map(([x, y]) => [Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000])
            }))
          };
          graffiti.unshift(g);
          if (graffiti.length > 50) graffiti.length = 50;
          saveStore();
          strokes = []; curStroke = null;
          myPos = { lat: g.lat, lng: g.lng, acc: g.acc };
          status("貼りました！（精度 ±" + g.acc + "m）「見る」で近づくと浮かびます");
          renderList();
        }, () => {
          status("位置を取れませんでした。空が見える場所でもう一回試してね");
        }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
      });

      /* ================= view mode ================= */
      function setMode(m) {
        mode = m;
        $("modeDraw").classList.toggle("on", m === "draw");
        $("modeView").classList.toggle("on", m === "view");
        $("drawPanel").classList.toggle("hidden", m !== "draw");
        $("viewPanel").classList.toggle("hidden", m !== "view");
        curStroke = null;
        if (m === "view") {
          startWatch();
          renderList();
          status("見るモード。落書きのある場所に近づくと、カメラに浮かびます");
        } else {
          stopWatch();
          viewTarget = null; viewIsPreview = false;
          $("banner").classList.remove("on");
          status("描くモード。カメラに手をかざして、つまんで描いてみて");
        }
      }
      $("modeDraw").addEventListener("click", () => setMode("draw"));
      $("modeView").addEventListener("click", () => setMode("view"));

      function startWatch() {
        if (watchId !== null || !("geolocation" in navigator)) return;
        watchId = navigator.geolocation.watchPosition((pos) => {
          myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
          updateNearby();
        }, () => { $("viewInfo").textContent = "位置を取れていません。許可と電波を確認してね"; },
          { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
      }
      function stopWatch() {
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      }
      function nearest() {
        if (!myPos) return null;
        let best = null, bestD = Infinity;
        graffiti.forEach((g) => {
          const d = haversineM(myPos, g);
          if (d < bestD) { bestD = d; best = g; }
        });
        return best ? { g: best, d: bestD } : null;
      }
      function updateNearby() {
        const n = nearest();
        if (!viewIsPreview) {
          if (n && n.d <= 25) {
            viewTarget = n.g;
            $("banner").textContent = "落書きが浮かんでる！（" + fmtDate(n.g.date) + "）";
            $("banner").classList.add("on");
          } else {
            viewTarget = null;
            $("banner").classList.remove("on");
          }
        }
        $("viewInfo").textContent = !graffiti.length
          ? "まだ落書きがありません。「描く」で描いて貼ってね"
          : n
            ? "一番近い落書きまで約 " + Math.round(n.d) + " m（25m以内で浮かびます）・精度 ±" + Math.round(myPos.acc) + "m"
            : "位置を取り中…";
        renderList();
      }
      function renderList() {
        const box = $("gList");
        box.innerHTML = "";
        if (!graffiti.length) {
          box.innerHTML = '<p class="small">まだありません。</p>';
          return;
        }
        const sorted = graffiti.slice().sort((a, b) => {
          if (!myPos) return b.id - a.id;
          return haversineM(myPos, a) - haversineM(myPos, b);
        });
        sorted.forEach((g) => {
          const d = myPos ? Math.round(haversineM(myPos, g)) : null;
          const div = document.createElement("div");
          div.className = "g-item";
          div.innerHTML = "<b>落書き " + fmtDate(g.date) + "</b>" +
            (d !== null ? " <span class=\"small\">約" + d + "m先</span>" : "") +
            "<div class=\"btn-row\" style=\"margin-top:6px\">" +
            "<button type=\"button\" data-act=\"show\">カメラで見る</button>" +
            "<button type=\"button\" data-act=\"del\">消す</button></div>";
          div.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", () => {
              const act = btn.getAttribute("data-act");
              if (act === "show") {
                if (mode !== "view") setMode("view");
                viewTarget = g; viewIsPreview = true;
                $("banner").textContent = "プレビュー中（" + fmtDate(g.date) + " の落書き）";
                $("banner").classList.add("on");
                window.scrollTo({ top: 0, behavior: "smooth" });
              } else if (act === "del") {
                if (window.confirm("この落書きを消しますか？")) {
                  graffiti = graffiti.filter((x) => x.id !== g.id);
                  saveStore();
                  if (viewTarget && viewTarget.id === g.id) { viewTarget = null; viewIsPreview = false; $("banner").classList.remove("on"); }
                  renderList();
                }
              }
            });
          });
          box.appendChild(div);
        });
      }

      renderList();
      status("「カメラ開始」を押してね。描くモードでは手をかざして描けます");
    </script>
  </body>
</html>
