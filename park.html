<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>ルート記録</title>
    <style>
      :root {
        --bg: #f4f6f3; --panel: #ffffff; --ink: #16211a; --ink-dim: #5c6a60;
        --line: #d9e0d8; --accent: #0f7a4d; --accent-ink: #ffffff; --accent-soft: #e3f2e9;
        --route: #e07b00; --prev: #8a8a8a;
        --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1511; --panel: #18221b; --ink: #e6efe8; --ink-dim: #9db3a4;
          --line: #2b3a2f; --accent: #2fbf7f; --accent-ink: #06231a; --accent-soft: #173828;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: var(--sans); -webkit-tap-highlight-color: transparent;
      }
      #app { display: flex; flex-direction: column; min-height: 100dvh; max-width: 640px; margin: 0 auto; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); gap: 10px; }
      h1 { font-size: 18px; margin: 2px 0 0; }
      .status { font-size: 13px; color: var(--ink-dim); line-height: 1.6; min-height: 1.6em; }
      .status b { color: var(--ink); }
      #stage {
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        width: 100%; aspect-ratio: 4 / 3; display: block; touch-action: manipulation;
      }
      .legend { font-size: 11.5px; color: var(--ink-dim); display: flex; gap: 14px; flex-wrap: wrap; }
      .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
      .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        font: inherit; font-size: 15px; font-weight: 600; min-height: 2.8rem;
        border: 1px solid var(--line); background: var(--panel); color: var(--ink);
        border-radius: 10px; padding: 8px 14px; cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      button:disabled { opacity: .45; }
      button:active { transform: translateY(1px); }
      .live { font-size: 15px; font-weight: 600; }
      .vbtn { min-height: 2.1rem; padding: 4px 12px; font-size: 13px; }
      .vbtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
      #routeList { display: flex; flex-direction: column; }
      .route-item { border-top: 1px solid var(--line); padding: 9px 2px; font-size: 13.5px; line-height: 1.65; }
      .route-item button { min-height: 2.1rem; padding: 4px 10px; font-size: 12.5px; font-weight: 600; }
      .small { font-size: 11.5px; color: var(--ink-dim); }
      h2 { font-size: 14px; margin: 6px 0 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>ルート記録</h1>
      <p class="status" id="status">「スタート」を押して歩くと、ルートが線で描かれます</p>

      <div class="btn-row">
        <span class="small" style="align-self:center">色の意味：</span>
        <button id="modeSpeed" class="vbtn on" type="button">スピード</button>
        <button id="modeTime" class="vbtn" type="button">時間</button>
      </div>
      <canvas id="stage" width="600" height="450"></canvas>
      <div class="legend" id="segLegend"></div>
      <div class="legend">
        <span><i style="background:var(--prev)"></i>前回（比較時・グレー破線）</span>
        <span>● 緑＝スタート　● 赤＝ゴール</span>
      </div>

      <div class="btn-row">
        <button id="startBtn" class="primary" type="button">スタート</button>
        <button id="goalBtn" type="button" disabled>ゴール（保存）</button>
        <button id="cancelBtn" type="button" disabled>やめる</button>
      </div>
      <p class="live" id="live"></p>

      <h2>記録一覧</h2>
      <div id="routeList"></div>
    </div>

    <script>
      "use strict";
      var $ = function (id) { return document.getElementById(id); };

      /* ================= storage ================= */
      var ROUTES_KEY = "gyosen-routes-v1";
      var routes = [];
      try {
        var savedRoutes = JSON.parse(localStorage.getItem(ROUTES_KEY) || "[]");
        if (Array.isArray(savedRoutes)) routes = savedRoutes;
      } catch (e) { routes = []; }
      function saveRoutes() {
        try { localStorage.setItem(ROUTES_KEY, JSON.stringify(routes)); } catch (e) { /* ignore */ }
      }

      /* ================= geo helpers ================= */
      function haversineM(a, b) {
        var R = 6371000, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
        var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
        return 2 * R * Math.asin(Math.sqrt(s));
      }
      function pad2(n) { return (n < 10 ? "0" : "") + n; }
      function fmtDur(sec) {
        sec = Math.max(0, Math.round(sec));
        var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        return h > 0 ? h + ":" + pad2(m) + ":" + pad2(s) : m + ":" + pad2(s);
      }
      function fmtPace(distM, sec) {
        if (!distM || distM < 10) return "—";
        var p = sec / (distM / 1000);
        return Math.floor(p / 60) + ":" + pad2(Math.round(p % 60)) + " /km";
      }
      function fmtDate(iso) {
        var d = new Date(iso);
        return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      /* ================= drawing ================= */
      var canvas = $("stage");
      var ctx = canvas.getContext("2d");
      var viewRoutes = [];   // [{pts:[[lat,lng]...], color, dash}]
      function smoothLine(lls) {
        var p = lls.map(function (a) { return [a[0], a[1]]; });
        for (var it = 0; it < 2; it++) {
          if (p.length < 3) break;
          var out = [p[0]];
          for (var i = 0; i < p.length - 1; i++) {
            var a = p[i], b = p[i + 1];
            out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
            out.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
          }
          out.push(p[p.length - 1]);
          p = out;
        }
        return p;
      }
      function draw() {
        var dpr = window.devicePixelRatio || 1;
        var w = canvas.clientWidth, h = canvas.clientHeight;
        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
          canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        var all = [];
        viewRoutes.forEach(function (vr) { all = all.concat(vr.pts); });
        if (!all.length) {
          ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink-dim");
          ctx.font = "13px sans-serif"; ctx.textAlign = "center";
          ctx.fillText("ここにルートの線が描かれます", w / 2, h / 2);
          return;
        }
        var lat0 = all[0][0], lng0 = all[0][1];
        var mLat = 111320, mLng = 111320 * Math.cos(lat0 * Math.PI / 180);
        var pts = all.map(function (a) { return { x: (a[1] - lng0) * mLng, y: (a[0] - lat0) * mLat }; });
        var minX = Math.min.apply(null, pts.map(function (p) { return p.x; }));
        var maxX = Math.max.apply(null, pts.map(function (p) { return p.x; }));
        var minY = Math.min.apply(null, pts.map(function (p) { return p.y; }));
        var maxY = Math.max.apply(null, pts.map(function (p) { return p.y; }));
        var spanX = Math.max(10, maxX - minX), spanY = Math.max(10, maxY - minY);
        var pad = 26;
        var scale = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanY);
        function proj(lat, lng) {
          var x = (lng - lng0) * mLng, y = (lat - lat0) * mLat;
          return [pad + (x - minX) * scale + (w - pad * 2 - spanX * scale) / 2,
                  h - (pad + (y - minY) * scale + (h - pad * 2 - spanY * scale) / 2)];
        }
        viewRoutes.forEach(function (vr) {
          if (vr.seg) {
            buildSegments(vr).forEach(function (sg) {
              var sm2 = smoothLine(sg.pts);
              ctx.beginPath();
              sm2.forEach(function (a, i) {
                var xy = proj(a[0], a[1]);
                if (i === 0) ctx.moveTo(xy[0], xy[1]); else ctx.lineTo(xy[0], xy[1]);
              });
              ctx.strokeStyle = segColor(sg); ctx.lineWidth = 5;
              ctx.setLineDash([]);
              ctx.lineJoin = "round"; ctx.lineCap = "round";
              ctx.stroke();
            });
          } else {
            var sm = smoothLine(vr.pts);
            ctx.beginPath();
            sm.forEach(function (a, i) {
              var xy = proj(a[0], a[1]);
              if (i === 0) ctx.moveTo(xy[0], xy[1]); else ctx.lineTo(xy[0], xy[1]);
            });
            ctx.strokeStyle = vr.color; ctx.lineWidth = vr.dash ? 3 : 4;
            ctx.setLineDash(vr.dash ? [7, 6] : []);
            ctx.lineJoin = "round"; ctx.lineCap = "round";
            ctx.stroke(); ctx.setLineDash([]);
          }
          var s = proj(vr.pts[0][0], vr.pts[0][1]);
          var g = proj(vr.pts[vr.pts.length - 1][0], vr.pts[vr.pts.length - 1][1]);
          ctx.beginPath(); ctx.arc(s[0], s[1], 6, 0, Math.PI * 2);
          ctx.fillStyle = "#0f7a4d"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
          ctx.beginPath(); ctx.arc(g[0], g[1], 6, 0, Math.PI * 2);
          ctx.fillStyle = "#b3261e"; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.stroke();
        });
      }
      window.addEventListener("resize", draw);

      /* ================= segment colors (every ~10 m) ================= */
      var colorMode = "speed";
      try { if (localStorage.getItem("gyosen-route-mode") === "time") colorMode = "time"; } catch (e) { /* ignore */ }
      function buildSegments(vr) {
        var pts = vr.pts;
        if (!pts || pts.length < 2) return [];
        var hasT = typeof pts[0][2] === "number";
        var cum = [0];
        for (var i = 1; i < pts.length; i++) {
          cum.push(cum[i - 1] + haversineM({ lat: pts[i - 1][0], lng: pts[i - 1][1] }, { lat: pts[i][0], lng: pts[i][1] }));
        }
        var totalD = vr.dist || cum[cum.length - 1];
        function tAt(i) { return hasT ? pts[i][2] : (totalD > 0 ? (vr.dur || 0) * cum[i] / totalD : 0); }
        var segs = [], cur = [pts[0]], acc = 0, tStart = tAt(0);
        for (var j = 1; j < pts.length; j++) {
          acc += cum[j] - cum[j - 1];
          cur.push(pts[j]);
          if (acc >= 10) {
            segs.push({ pts: cur, dist: acc, dur: Math.max(0.1, tAt(j) - tStart) });
            cur = [pts[j]]; acc = 0; tStart = tAt(j);
          }
        }
        if (cur.length > 1) {
          if (segs.length && acc < 5) {
            var lastS = segs[segs.length - 1];
            lastS.pts = lastS.pts.concat(cur.slice(1));
            lastS.dist += acc;
            lastS.dur += Math.max(0, tAt(pts.length - 1) - tStart);
          } else {
            segs.push({ pts: cur, dist: acc, dur: Math.max(0.1, tAt(pts.length - 1) - tStart) });
          }
        }
        return segs;
      }
      function segColor(sg) {
        var cols = ["#4169c9", "#2faf5f", "#e8c81a", "#ef8f1d", "#d93a2b"];
        var v, stops;
        if (colorMode === "speed") { v = (sg.dist / sg.dur) * 3.6; stops = [2.5, 4, 5.5, 7]; }
        else { v = sg.dur; stops = [6, 8, 10, 14]; cols = cols.slice().reverse(); }
        for (var i = 0; i < stops.length; i++) if (v < stops[i]) return cols[i];
        return cols[cols.length - 1];
      }
      function chip(c, t) { return "<span><i style=\"background:" + c + "\"></i>" + t + "</span>"; }
      function renderLegend() {
        var el = $("segLegend");
        if (!el) return;
        var body = colorMode === "speed"
          ? chip("#4169c9", "遅い 〜2.5km/h") + chip("#2faf5f", "2.5〜4") + chip("#e8c81a", "4〜5.5") + chip("#ef8f1d", "5.5〜7") + chip("#d93a2b", "7〜 速い")
          : chip("#d93a2b", "速い 〜6秒") + chip("#ef8f1d", "6〜8秒") + chip("#e8c81a", "8〜10秒") + chip("#2faf5f", "10〜14秒") + chip("#4169c9", "14秒〜 遅い");
        el.innerHTML = "<span>10mごとの" + (colorMode === "speed" ? "スピード" : "かかった時間") + "：</span>" + body;
      }
      function setMode(m) {
        colorMode = m;
        try { localStorage.setItem("gyosen-route-mode", m); } catch (e) { /* ignore */ }
        $("modeSpeed").classList.toggle("on", m === "speed");
        $("modeTime").classList.toggle("on", m === "time");
        renderLegend();
        draw();
      }
      $("modeSpeed").addEventListener("click", function () { setMode("speed"); });
      $("modeTime").addEventListener("click", function () { setMode("time"); });

      /* ================= recording ================= */
      var watchId = null;
      var rec = null;   // {startT, pts:[{lat,lng,t}], lastT, dist}
      var timer = null;

      function setButtons(on) {
        $("startBtn").disabled = on;
        $("goalBtn").disabled = !on;
        $("cancelBtn").disabled = !on;
      }
      function refreshLive() {
        if (!rec) { $("live").textContent = ""; return; }
        var sec = (Date.now() - rec.startT) / 1000;
        $("live").textContent = "記録中… 距離 " + Math.round(rec.dist) + " m ・ 時間 " + fmtDur(sec);
      }
      function liveViewRoute() {
        var t0 = rec.pts.length ? rec.pts[0].t : Date.now();
        return {
          seg: true, dist: rec.dist, dur: Math.max(1, (Date.now() - rec.startT) / 1000),
          pts: rec.pts.map(function (q) { return [q.lat, q.lng, Math.round((q.t - t0) / 1000)]; })
        };
      }
      function onPos(pos) {
        if (!rec) return;
        var c = pos.coords;
        if (c.accuracy > 40) return;
        var p = { lat: c.latitude, lng: c.longitude };
        var now = Date.now();
        var last = rec.pts[rec.pts.length - 1];
        if (last) {
          if (now - rec.lastT < 2000) return;
          var d = haversineM(last, p);
          if (d >= 1) rec.dist += d;
        }
        rec.pts.push({ lat: p.lat, lng: p.lng, t: now });
        rec.lastT = now;
        viewRoutes = [liveViewRoute()];
        draw();
        refreshLive();
      }
      function onErr(err) {
        var msg = "位置を取れなかった…";
        if (err.code === 1) msg = "位置情報が許可されてないみたい。Chromeの設定で許可してね";
        else if (err.code === 2) msg = "今は位置を取れないみたい。空が見える場所だと取りやすいよ";
        else if (err.code === 3) msg = "位置の取得が時間切れした…もう一回試してね";
        $("status").textContent = msg;
      }
      function startRec() {
        if (!("geolocation" in navigator)) { $("status").textContent = "このブラウザはGPSに未対応です。Chromeで開いてね"; return; }
        rec = { startT: Date.now(), pts: [], lastT: 0, dist: 0 };
        viewRoutes = [];
        draw();
        watchId = navigator.geolocation.watchPosition(onPos, onErr,
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
        setButtons(true);
        timer = setInterval(refreshLive, 1000);
        refreshLive();
        $("status").textContent = "記録中。歩くと線が伸びていきます";
      }
      function stopWatch() {
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        if (timer) { clearInterval(timer); timer = null; }
      }
      function suggestRouteName(r) {
        var s = r.pts[0], e = r.pts[r.pts.length - 1];
        for (var i = 0; i < routes.length; i++) {
          var q = routes[i];
          if (!q.pts || !q.pts.length) continue;
          var qs = { lat: q.pts[0][0], lng: q.pts[0][1] };
          var qe = { lat: q.pts[q.pts.length - 1][0], lng: q.pts[q.pts.length - 1][1] };
          if (haversineM(s, qs) < 30 && haversineM(e, qe) < 30) return q.name;
        }
        return "ルート" + (routes.length + 1);
      }
      function endRec(save) {
        var r = rec; rec = null;
        stopWatch();
        setButtons(false);
        $("live").textContent = "";
        if (!save) { $("status").textContent = "記録をやめました"; viewRoutes = []; draw(); return; }
        if (!r || r.pts.length < 2 || r.dist < 10) {
          $("status").textContent = "短すぎて保存できませんでした。もう少し歩いてからゴールしてね";
          viewRoutes = []; draw();
          return;
        }
        var dur = (r.pts[r.pts.length - 1].t - r.pts[0].t) / 1000;
        var name = window.prompt("ルートの名前（同じ名前だと前回と比較できます）", suggestRouteName(r));
        if (name === null) { $("status").textContent = "保存をやめました"; viewRoutes = []; draw(); return; }
        name = (name || "").trim() || suggestRouteName(r);
        var pts = r.pts;
        if (pts.length > 600) {
          var thin = [], step = Math.ceil(pts.length / 600);
          for (var i = 0; i < pts.length; i += step) thin.push(pts[i]);
          if (thin[thin.length - 1] !== pts[pts.length - 1]) thin.push(pts[pts.length - 1]);
          pts = thin;
        }
        var t0 = pts[0].t;
        routes.unshift({
          id: Date.now(), name: name, date: new Date().toISOString(),
          dist: Math.round(r.dist), dur: Math.round(dur),
          pts: pts.map(function (p) { return [Math.round(p.lat * 1e6) / 1e6, Math.round(p.lng * 1e6) / 1e6, Math.round((p.t - t0) / 1000)]; })
        });
        if (routes.length > 30) routes.length = 30;
        saveRoutes();
        renderList();
        viewRoutes = [{ pts: routes[0].pts, seg: true, dist: routes[0].dist, dur: routes[0].dur }];
        draw();
        $("status").innerHTML = "保存しました：<b>" + escapeHtml(name) + "</b> ・ " + Math.round(r.dist) + " m ・ " + fmtDur(dur) + " ・ ペース " + fmtPace(r.dist, dur);
      }
      $("startBtn").addEventListener("click", startRec);
      $("goalBtn").addEventListener("click", function () { endRec(true); });
      $("cancelBtn").addEventListener("click", function () { endRec(false); });

      /* ================= list & compare ================= */
      function renderList() {
        var box = $("routeList");
        box.innerHTML = "";
        if (!routes.length) {
          box.innerHTML = '<p class="small">まだ記録がありません。「スタート」を押して歩くと、ここに残ります。</p>';
          return;
        }
        routes.forEach(function (r, idx) {
          var prev = null;
          for (var i = idx + 1; i < routes.length; i++) {
            if (routes[i].name === r.name) { prev = routes[i]; break; }
          }
          var cmp = "";
          if (prev) {
            var dd = r.dur - prev.dur;
            cmp = " ・ 前回より <b>" + (dd === 0 ? "同じタイム" : (dd < 0 ? "−" + Math.abs(dd) + "秒（速い）" : "＋" + dd + "秒（遅い）")) + "</b>";
          }
          var div = document.createElement("div");
          div.className = "route-item";
          div.innerHTML = "<b>" + escapeHtml(r.name) + "</b> <span class=\"small\">" + fmtDate(r.date) + "</span><br>" +
            Math.round(r.dist) + " m ・ " + fmtDur(r.dur) + " ・ ペース " + fmtPace(r.dist, r.dur) + cmp +
            "<div class=\"btn-row\" style=\"margin-top:6px\">" +
            "<button type=\"button\" data-act=\"show\">線を見る</button>" +
            (prev ? "<button type=\"button\" data-act=\"cmp\">前回と比較</button>" : "") +
            "<button type=\"button\" data-act=\"del\">削除</button></div>";
          Array.prototype.forEach.call(div.querySelectorAll("button"), function (btn) {
            btn.addEventListener("click", function () {
              var act = btn.getAttribute("data-act");
              if (act === "show") {
                viewRoutes = [{ pts: r.pts, seg: true, dist: r.dist, dur: r.dur }];
                draw();
                $("status").textContent = r.name + "：" + Math.round(r.dist) + " m ・ " + fmtDur(r.dur);
                window.scrollTo({ top: 0, behavior: "smooth" });
              } else if (act === "cmp" && prev) {
                viewRoutes = [
                  { pts: prev.pts, color: "#8a8a8a", dash: true },
                  { pts: r.pts, seg: true, dist: r.dist, dur: r.dur }
                ];
                draw();
                var dd2 = r.dur - prev.dur;
                $("status").innerHTML = "比較：<b>" + escapeHtml(r.name) + "</b> 今回 " + fmtDur(r.dur) + " / 前回 " + fmtDur(prev.dur) +
                  " → " + (dd2 === 0 ? "同じタイム" : (dd2 < 0 ? Math.abs(dd2) + "秒 速くなった！" : dd2 + "秒 遅くなった")) +
                  "（グレー破線＝前回、オレンジ＝今回）";
                window.scrollTo({ top: 0, behavior: "smooth" });
              } else if (act === "del") {
                if (window.confirm("この記録を消しますか？")) {
                  routes = routes.filter(function (x) { return x.id !== r.id; });
                  saveRoutes();
                  renderList();
                  viewRoutes = []; draw();
                }
              }
            });
          });
          box.appendChild(div);
        });
      }

      renderList();
      setMode(colorMode);
    </script>
  </body>
</html>
