<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>MediaPipeテスト（手＋顔）</title>
    <style>
      :root {
        --bg: #101014; --panel: #1b1b21; --ink: #f2f2f5; --ink-dim: #a7a7b3;
        --line: #33333d; --accent: #ff2e88; --accent-ink: #ffffff;
        --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: var(--sans); -webkit-tap-highlight-color: transparent;
      }
      #app { display: flex; flex-direction: column; min-height: 100dvh; max-width: 640px; margin: 0 auto; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); gap: 10px; }
      h1 { font-size: 18px; margin: 2px 0 0; }
      .status { font-size: 13px; color: var(--ink-dim); line-height: 1.6; min-height: 1.6em; margin: 0; }
      .status b { color: var(--ink); }
      #stageWrap { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
      #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #draw { position: absolute; inset: 0; width: 100%; height: 100%; }
      .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button {
        font: inherit; font-size: 15px; font-weight: 600; min-height: 2.8rem;
        border: 1px solid var(--line); background: var(--panel); color: var(--ink);
        border-radius: 10px; padding: 8px 14px; cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      button.on { background: #2c2c35; border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: .45; }
      button:active { transform: translateY(1px); }
      .small { font-size: 11.5px; color: var(--ink-dim); line-height: 1.7; }
      #readout { font-size: 14px; line-height: 1.7; margin: 0; }
      #stage3d { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #050508; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
      #stage3d canvas { display: block; }
      input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent); }
      .item { border-top: 1px solid var(--line); padding: 9px 2px; font-size: 13.5px; line-height: 1.65; }
      .item button { min-height: 2.1rem; padding: 4px 10px; font-size: 12.5px; }
      h2 { font-size: 14px; margin: 6px 0 0; }
      .hidden { display: none !important; }
      .rec-on { background: #5c1226 !important; border-color: #ff2e4d !important; color: #ff8296 !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>MediaPipeテスト（手＋顔）</h1>
      <p class="status" id="status">読み込み中…</p>
      <div class="btn-row">
        <button id="tabCam" class="on" type="button">認識</button>
        <button id="tab3d" type="button">3D再生</button>
      </div>
      <div id="camPanel">

      <div id="stageWrap">
        <video id="cam" playsinline muted autoplay></video>
        <canvas id="draw"></canvas>
      </div>

      <div class="btn-row">
        <button id="camBtn" class="primary" type="button">カメラ開始</button>
        <button id="flipBtn" type="button">カメラ切替（内/外）</button>
      </div>
      <div class="btn-row">
        <button id="handBtn" class="on" type="button">手：ON</button>
        <button id="faceBtn" class="on" type="button">顔：ON</button>
      </div>

      <p id="readout">手：— ／ 顔：—</p>
      <p class="small">手は21点の骨格、顔は478点の点群（顔全体のランドマーク）を表示します。つまむ（親指と人差し指をくっつけ）ると「つまんでる！」と出ます。顔検知は自分の顔で試すなら「カメラ切替」で内カメラに。</p>

        <h2>手の動きを録画</h2>
        <div class="btn-row">
          <button id="recBtn" type="button">● 録画開始</button>
          <span class="small" id="recInfo">片手の21点（3D座標）を記録します</span>
        </div>
        <div id="recList"></div>
      </div>

      <div id="panel3d" class="hidden">
        <div id="stage3d"></div>
        <div class="btn-row" style="margin-top:8px">
          <button id="playBtn" class="primary" type="button">⏸ 一時停止</button>
          <button id="sampleBtn" type="button">サンプル再生</button>
          <button id="mirrorBtn" type="button">左右反転：OFF</button>
        </div>
        <div class="btn-row">
          <span class="small">速度</span>
          <button type="button" class="spdBtn" data-v="0.5">0.5x</button>
          <button type="button" class="spdBtn on" data-v="1">1x</button>
          <button type="button" class="spdBtn" data-v="2">2x</button>
        </div>
        <div class="btn-row">
          <input type="range" id="scrub" min="0" max="1000" value="0" />
        </div>
        <p class="small" id="playInfo">3Dの手を再生します。ドラッグで回転、ピンチで拡大縮小。</p>
      </div>
    </div>

    <script>
      "use strict";
      var $ = function (id) { return document.getElementById(id); };
      function status(t) { $("status").innerHTML = t; }

      var want = { hand: true, face: true };
      window.__mpWant = want;
      $("handBtn").addEventListener("click", function () {
        want.hand = !want.hand;
        $("handBtn").textContent = want.hand ? "手：ON" : "手：OFF";
        $("handBtn").classList.toggle("on", want.hand);
        if (!want.hand) latest.hands = [];
      });
      $("faceBtn").addEventListener("click", function () {
        want.face = !want.face;
        $("faceBtn").textContent = want.face ? "顔：ON" : "顔：OFF";
        $("faceBtn").classList.toggle("on", want.face);
        if (!want.face) latest.faces = [];
      });

      /* ================= camera ================= */
      var video = $("cam");
      var canvas = $("draw");
      var ctx = canvas.getContext("2d");
      var camStarted = false;
      var facing = "environment";
      var stream = null;
      var mpReady = false;

      function startCam() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          status("このブラウザではカメラが使えません。リンクをChromeで開いてね（アプリ内ブラウザでは動かないことがあります）");
          return;
        }
        status("カメラを起動中…");
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false
        }).then(function (s) {
          if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
          stream = s;
          video.srcObject = s;
          var pr = video.play();
          if (pr && pr.catch) pr.catch(function () { /* ignore */ });
          camStarted = true;
          $("camBtn").disabled = true;
          $("camBtn").textContent = "カメラ動作中";
          if (mpReady) {
            status("認識中。手をかざす／顔を映してみて");
          } else {
            status("カメラOK。認識モデルを読み込み中…");
          }
        }).catch(function (err) {
          var name = err && err.name ? err.name : "";
          var msg;
          if (name === "NotAllowedError") msg = "カメラの許可が拒否されました。Chromeのアドレスバー左端のアイコン→「権限」からカメラを許可して、もう一回押してね";
          else if (name === "NotFoundError" || name === "OverconstrainedError") msg = "使えるカメラが見つかりませんでした";
          else if (name === "NotReadableError") msg = "カメラが他のアプリに使用中かもしれません。他のカメラアプリを閉じてもう一回試してね";
          else if (name === "SecurityError") msg = "安全な接続（https）でないためカメラが使えません";
          else msg = "カメラを開けませんでした（" + (name || "不明なエラー") + "）。再読み込みしてもう一回試してね";
          status(msg);
        });
      }
      $("camBtn").addEventListener("click", startCam);
      $("flipBtn").addEventListener("click", function () {
        facing = facing === "environment" ? "user" : "environment";
        if (camStarted) {
          $("camBtn").disabled = false;
          startCam();
        } else {
          status(facing === "user" ? "内カメラに設定。カメラ開始を押してね" : "外カメラに設定。カメラ開始を押してね");
        }
      });

      function hookModule() {
        if (typeof window.__mpStart === "function") {
          window.__mpStart(video);
          return;
        }
        var tries = 0;
        var iv = setInterval(function () {
          tries++;
          if (typeof window.__mpStart === "function") {
            clearInterval(iv);
            window.__mpStart(video);
          } else if (tries > 24) {
            clearInterval(iv);
            if (!mpReady) status("認識ライブラリを読み込めませんでした。通信状態を確認して、再読み込みしてね");
          }
        }, 500);
      }

      var loadStep = "";
      var loadStart = null;
      var loadTimer = null;
      function stopLoadTimer() {
        loadStep = "";
        if (loadTimer) { clearInterval(loadTimer); loadTimer = null; }
      }
      window.__mpProgressCb = function (step) {
        loadStep = step;
        if (!loadStart) loadStart = Date.now();
        if (!loadTimer) {
          loadTimer = setInterval(function () {
            if (loadStep && !mpReady) {
              var s = Math.round((Date.now() - loadStart) / 1000);
              status(loadStep + "…（" + s + "秒経過）");
            }
          }, 1000);
        }
        status(step + "…");
      };
      window.__mpReadyCb = function (handOk, faceOk) {
        mpReady = true;
        stopLoadTimer();
        var parts = [];
        parts.push(handOk ? "手の認識OK" : "手の認識は読み込み失敗");
        parts.push(faceOk ? "顔検知OK" : "顔検知は読み込み失敗");
        if (camStarted) {
          status("認識中（" + parts.join("・") + "）。手をかざす／顔を映してみて");
        } else {
          status("モデルの準備OK（" + parts.join("・") + "）。「カメラ開始」を押してね");
        }
      };
      window.__mpErrorCb = function (err) {
        stopLoadTimer();
        if (!mpReady) {
          var detail = err && err.message ? err.message : (err ? String(err) : "");
          status("認識ライブラリを読み込めませんでした" + (detail ? "：" + detail : "") + "（再読み込みで直ることもあります）");
        }
      };

      /* ================= results + rendering ================= */
      var latest = { hands: [], faces: [] };
      var lastReadout = "";
      window.onMpFrame = function (r) {
        latest = r;
        var ht = "手：なし";
        if (r.hands.length) {
          var h0 = r.hands[0];
          ht = "手：" + (h0.handed === "Left" ? "左手" : h0.handed === "Right" ? "右手" : "検出") + (h0.pinch ? "（つまんでる！）" : "");
          if (r.hands.length > 1) ht += " ほか" + (r.hands.length - 1) + "つ";
        }
        var ft = r.faces.length ? "顔：" + r.faces.length + "つ検出（" + (r.faces[0].pts ? r.faces[0].pts.length : 0) + "点）" : "顔：なし";
        var txt = ht + " ／ " + ft;
        if (txt !== lastReadout) {
          lastReadout = txt;
          $("readout").textContent = txt;
        }
      };

      var CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
      function coverMap(nx, ny, W, H) {
        var vw = video.videoWidth || 4, vh = video.videoHeight || 3;
        var scale = Math.max(W / vw, H / vh);
        var dw = vw * scale, dh = vh * scale;
        return [nx * dw + (W - dw) / 2, ny * dh + (H - dh) / 2];
      }
      function render() {
        var W = canvas.clientWidth, H = canvas.clientHeight;
        if (!W) return;
        var dpr = window.devicePixelRatio || 1;
        if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
          canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);

        /* faces: full landmark point cloud (478 pts with refineLandmarks) */
        latest.faces.forEach(function (f) {
          ctx.fillStyle = "#ffd400";
          f.pts.forEach(function (p0) {
            var p = coverMap(p0[0], p0[1], W, H);
            ctx.fillRect(p[0] - 1.3, p[1] - 1.3, 2.6, 2.6);
          });
        });

        /* hands: skeleton */
        latest.hands.forEach(function (h) {
          var pts = h.pts.map(function (p) { return coverMap(p[0], p[1], W, H); });
          ctx.strokeStyle = h.pinch ? "#ff2e88" : "#2ee66b";
          ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.lineCap = "round";
          CONN.forEach(function (c) {
            ctx.beginPath();
            ctx.moveTo(pts[c[0]][0], pts[c[0]][1]);
            ctx.lineTo(pts[c[1]][0], pts[c[1]][1]);
            ctx.stroke();
          });
          pts.forEach(function (p, i) {
            ctx.beginPath();
            ctx.arc(p[0], p[1], i === 8 || i === 4 ? 6 : 4, 0, Math.PI * 2);
            ctx.fillStyle = i === 8 ? "#ff2e88" : "#ffffff";
            ctx.fill();
          });
        });
      }
      (function anim() { requestAnimationFrame(anim); render(); })();


      /* ================= tabs ================= */
      var appMode = "cam";
      function setAppMode(m) {
        appMode = m;
        $("tabCam").classList.toggle("on", m === "cam");
        $("tab3d").classList.toggle("on", m === "3d");
        $("camPanel").classList.toggle("hidden", m !== "cam");
        $("panel3d").classList.toggle("hidden", m !== "3d");
        if (m === "3d") initPlayer();
      }
      $("tabCam").addEventListener("click", function () { setAppMode("cam"); });
      $("tab3d").addEventListener("click", function () { setAppMode("3d"); });

      /* ================= recording ================= */
      var REC_KEY = "hand-records-v1";
      var records = [];
      try {
        var rs = JSON.parse(localStorage.getItem(REC_KEY) || "[]");
        if (Array.isArray(rs)) records = rs;
      } catch (e) { records = []; }
      function saveRecords() {
        try { localStorage.setItem(REC_KEY, JSON.stringify(records)); }
        catch (e) { status("保存容量がいっぱいで保存できませんでした"); }
      }
      var rec = null;
      window.onHandRecord = function (h) {
        if (!rec) return;
        var t = performance.now() - rec.start;
        rec.frames.push({ t: Math.round(t), p: h.wpts });
        $("recInfo").textContent = "録画中… " + (t / 1000).toFixed(1) + "秒・" + rec.frames.length + "フレーム";
        if (rec.frames.length >= 1800) stopRec();
      };
      function startRec() {
        if (!camStarted) { status("先にカメラ開始を押してね"); return; }
        if (!mpReady) { status("モデルの準備が終わってから録画してね"); return; }
        rec = { start: performance.now(), frames: [] };
        $("recBtn").textContent = "■ 録画停止";
        $("recBtn").classList.add("rec-on");
        $("recInfo").textContent = "録画中… 手を動かしてね";
      }
      function stopRec() {
        if (!rec) return;
        var frames = rec.frames;
        rec = null;
        $("recBtn").textContent = "● 録画開始";
        $("recBtn").classList.remove("rec-on");
        if (frames.length < 10) {
          $("recInfo").textContent = "短すぎたので保存しませんでした（手が映ってなかったかも）";
          return;
        }
        var dur = frames[frames.length - 1].t;
        var rounded = frames.map(function (f) {
          return { t: f.t, p: f.p.map(function (pt) {
            return [Math.round(pt[0] * 10000) / 10000, Math.round(pt[1] * 10000) / 10000, Math.round(pt[2] * 10000) / 10000];
          }) };
        });
        records.unshift({ id: Date.now(), date: new Date().toISOString(), dur: dur, frames: rounded });
        if (records.length > 10) records.length = 10;
        saveRecords();
        $("recInfo").textContent = "保存しました（" + (dur / 1000).toFixed(1) + "秒）。「3D再生」で見られます";
        renderRecList();
      }
      $("recBtn").addEventListener("click", function () { if (rec) stopRec(); else startRec(); });
      function renderRecList() {
        var box = $("recList");
        box.innerHTML = "";
        records.forEach(function (r) {
          var div = document.createElement("div");
          div.className = "item";
          div.innerHTML = "<b>録画 " + fmtDate(r.date) + "</b> <span class=\"small\">" +
            (r.dur / 1000).toFixed(1) + "秒・" + r.frames.length + "フレーム</span>" +
            "<div class=\"btn-row\" style=\"margin-top:6px\">" +
            "<button type=\"button\" data-act=\"play\">3Dで再生</button>" +
            "<button type=\"button\" data-act=\"del\">消す</button></div>";
          Array.prototype.forEach.call(div.querySelectorAll("button"), function (btn) {
            btn.addEventListener("click", function () {
              var act = btn.getAttribute("data-act");
              if (act === "play") {
                setAppMode("3d");
                initPlayer().then(function () { loadRecording(r); });
              } else if (act === "del") {
                if (window.confirm("この録画を消しますか？")) {
                  records = records.filter(function (x) { return x.id !== r.id; });
                  saveRecords(); renderRecList();
                }
              }
            });
          });
          box.appendChild(div);
        });
      }
      renderRecList();

      /* ================= 3D player ================= */
      var T = null, threePromise = null;
      function loadScriptP(url) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = url;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error("読み込み失敗: " + url)); };
          document.head.appendChild(s);
        });
      }
      async function loadPkgP(pkgPath) {
        var bases = ["https://cdn.jsdelivr.net/npm/", "https://unpkg.com/"];
        var err = null;
        for (var i = 0; i < bases.length; i++) {
          try { await loadScriptP(bases[i] + pkgPath); return; } catch (e) { err = e; }
        }
        throw err || new Error(pkgPath + " を読み込めませんでした");
      }
      var scene = null, camera3 = null, renderer3 = null, handGroup = null, mirrorGroup = null;
      var jointMeshes = [], boneMeshes = [], palmMesh = null;
      var RAD = [0.115, 0.100, 0.090, 0.082, 0.088, 0.092, 0.082, 0.072, 0.080, 0.095, 0.085, 0.075, 0.082, 0.092, 0.082, 0.072, 0.080, 0.080, 0.070, 0.062, 0.070];
      var play = { frames: null, dur: 0, t: 0, playing: true, speed: 1, mirror: false, lastTs: 0, label: "" };

      function initPlayer() {
        if (threePromise) return threePromise;
        threePromise = (async function () {
          $("playInfo").textContent = "3Dライブラリを読み込み中…";
          await loadPkgP("three@0.128.0/build/three.min.js");
          try { await loadPkgP("three@0.128.0/examples/js/controls/OrbitControls.js"); } catch (e) { /* orbit optional */ }
          T = window.THREE;
          buildScene();
          loadSample();
          requestAnimationFrame(playerLoop);
          $("playInfo").textContent = "サンプル再生中。ドラッグで回転、ピンチで拡大縮小。";
        })().catch(function (e) {
          $("playInfo").textContent = "3Dライブラリを読み込めませんでした：" + (e && e.message ? e.message : e);
          threePromise = null;
        });
        return threePromise;
      }
      function buildScene() {
        var wrap = $("stage3d");
        var W = wrap.clientWidth || 320, H = wrap.clientHeight || 240;
        scene = new T.Scene();
        scene.background = new T.Color(0x050508);
        camera3 = new T.PerspectiveCamera(42, W / H, 0.1, 100);
        camera3.position.set(0.6, 0.35, 3.6);
        renderer3 = new T.WebGLRenderer({ antialias: true });
        renderer3.setPixelRatio(window.devicePixelRatio || 1);
        renderer3.setSize(W, H);
        wrap.appendChild(renderer3.domElement);
        if (T.OrbitControls) {
          var oc = new T.OrbitControls(camera3, renderer3.domElement);
          oc.enableDamping = true;
          oc.target.set(0, 0, 0);
        }
        scene.add(new T.HemisphereLight(0xfff4e0, 0x223044, 0.95));
        var key = new T.DirectionalLight(0xffffff, 0.95); key.position.set(2, 3, 4); scene.add(key);
        var rim = new T.DirectionalLight(0xff9ec4, 0.5); rim.position.set(-3, 1.5, -2.5); scene.add(rim);
        var grid = new T.PolarGridHelper(1.6, 12, 6, 48, 0x2a2a35, 0x1c1c24);
        grid.position.y = -1.25; scene.add(grid);
        mirrorGroup = new T.Group(); scene.add(mirrorGroup);
        handGroup = new T.Group(); handGroup.position.y = -0.95; mirrorGroup.add(handGroup);
        var skin = new T.MeshStandardMaterial({ color: 0xe9b48c, roughness: 0.55, metalness: 0.0, side: T.DoubleSide });
        var sph = new T.SphereGeometry(1, 18, 14);
        var cyl = new T.CylinderGeometry(1, 1, 1, 12);
        for (var i = 0; i < 21; i++) {
          var jm = new T.Mesh(sph, skin); handGroup.add(jm); jointMeshes.push(jm);
        }
        CONN.forEach(function () {
          var bm = new T.Mesh(cyl, skin); handGroup.add(bm); boneMeshes.push(bm);
        });
        palmMesh = new T.Mesh(sph, skin); handGroup.add(palmMesh);
      }
      var UP = null, tmpA = null, tmpB = null, tmpM = null;
      function setBone(mesh, a, b, r) {
        tmpA.subVectors(b, a);
        var len = tmpA.length() || 0.0001;
        mesh.position.copy(a).addScaledVector(tmpA, 0.5);
        mesh.scale.set(r, len, r);
        mesh.quaternion.setFromUnitVectors(UP, tmpA.normalize());
      }
      function updateHand(pts) {
        if (!UP) { UP = new T.Vector3(0, 1, 0); tmpA = new T.Vector3(); tmpB = new T.Vector3(); tmpM = new T.Matrix4(); }
        for (var i = 0; i < 21; i++) {
          jointMeshes[i].position.copy(pts[i]);
          var r = RAD[i];
          jointMeshes[i].scale.set(r, r, r);
        }
        CONN.forEach(function (c, i) {
          setBone(boneMeshes[i], pts[c[0]], pts[c[1]], (RAD[c[0]] + RAD[c[1]]) / 2 * 0.92);
        });
        var O = pts[0];
        var a = pts[9].clone().sub(O); var lenA = a.length() || 1; a.normalize();
        var b = pts[5].clone().sub(pts[17]); var lenB = b.length() || 1; b.normalize();
        var n = new T.Vector3().crossVectors(b, a).normalize();
        var b2 = new T.Vector3().crossVectors(a, n).normalize();
        tmpM.makeBasis(b2, a, n);
        palmMesh.quaternion.setFromRotationMatrix(tmpM);
        palmMesh.position.copy(O).addScaledVector(a, lenA * 0.48);
        palmMesh.scale.set(lenB * 0.60, lenA * 0.58, lenB * 0.22);
      }
      function prepFrames(frames) {
        return frames.map(function (f) {
          var pts = f.p.map(function (a) { return new T.Vector3(a[0], -a[1], -a[2]); });
          var w = pts[0].clone();
          var s = pts[9].distanceTo(pts[0]) || 1;
          return { t: f.t, pts: pts.map(function (v) { return v.sub(w).divideScalar(s); }) };
        });
      }
      function loadRecording(r) {
        play.frames = prepFrames(r.frames);
        play.dur = r.dur || (r.frames.length ? r.frames[r.frames.length - 1].t : 0);
        play.t = 0; play.playing = true;
        $("playBtn").textContent = "⏸ 一時停止";
        play.label = "録画 " + fmtDate(r.date);
        $("playInfo").textContent = play.label + "（" + (play.dur / 1000).toFixed(1) + "秒）を再生中";
      }
      /* procedural sample: fingers curl in sequence (finger dance) */
      function chainPts(start, dir, lens, curls) {
        var AX = new T.Vector3(1, 0, 0);
        var pts = [start.clone()];
        var d = dir.clone();
        var p = start.clone();
        for (var i = 0; i < lens.length; i++) {
          d = d.clone().applyAxisAngle(AX, curls[i]);
          p = p.clone().addScaledVector(d, lens[i]);
          pts.push(p.clone());
        }
        return pts;
      }
      function samplePose(t) {
        var V = function (x, y, z) { return new T.Vector3(x, y, z); };
        var pts = new Array(21);
        pts[0] = V(0, 0, 0);
        var th = chainPts(V(0.38, 0.28, 0.02), V(0.75, 0.62, 0.2).normalize(), [0.34, 0.30, 0.26],
          [0.15 + 0.1 * Math.sin(t * 2.2), 0.2, 0.25]);
        pts[1] = th[0]; pts[2] = th[1]; pts[3] = th[2]; pts[4] = th[3];
        var fingers = [
          { s: V(0.40, 0.98, 0), d: V(0.06, 1, 0), l: [0.42, 0.26, 0.20], o: 5 },
          { s: V(0.14, 1.05, 0), d: V(0, 1, 0), l: [0.46, 0.30, 0.22], o: 9 },
          { s: V(-0.13, 1.00, 0), d: V(-0.06, 1, 0), l: [0.42, 0.27, 0.20], o: 13 },
          { s: V(-0.37, 0.88, 0), d: V(-0.12, 1, 0), l: [0.32, 0.20, 0.16], o: 17 }
        ];
        fingers.forEach(function (fg, fi) {
          var c = Math.max(0, Math.sin(t * 2.2 - fi * 0.8)) * 0.9;
          var cp = chainPts(fg.s, fg.d.clone().normalize(), fg.l, [c * 0.5, c * 0.75, c * 0.6]);
          for (var i = 0; i < 4; i++) pts[fg.o + i] = cp[i];
        });
        var sway = Math.sin(t * 0.9) * 0.05;
        var cs = Math.cos(sway), sn = Math.sin(sway);
        return pts.map(function (p) {
          return V(p.x * cs - p.y * sn, p.x * sn + p.y * cs + Math.sin(t * 1.7) * 0.03, p.z);
        });
      }
      function loadSample() {
        var frames = [];
        for (var i = 0; i <= 120; i++) {
          var t = i / 30;
          frames.push({ t: Math.round(t * 1000), pts: samplePose(t) });
        }
        play.frames = frames;
        play.dur = 4000; play.t = 0; play.playing = true;
        play.label = "サンプル";
      }
      var scratch = null;
      function playerLoop(ts) {
        requestAnimationFrame(playerLoop);
        if (!renderer3 || !play.frames || !play.frames.length) return;
        if (appMode !== "3d") { play.lastTs = ts; return; }
        if (!scratch) { scratch = []; for (var i = 0; i < 21; i++) scratch.push(new T.Vector3()); }
        if (play.playing) {
          var dt = play.lastTs ? (ts - play.lastTs) : 16;
          play.t += dt * play.speed;
          if (play.t > play.dur) play.t = play.t % (play.dur || 1);
        }
        play.lastTs = ts;
        var fr = play.frames;
        var idx = 0;
        while (idx < fr.length - 2 && fr[idx + 1].t <= play.t) idx++;
        var f0 = fr[idx], f1 = fr[Math.min(idx + 1, fr.length - 1)];
        var span = Math.max(1, f1.t - f0.t);
        var al = Math.min(1, Math.max(0, (play.t - f0.t) / span));
        for (var j = 0; j < 21; j++) scratch[j].lerpVectors(f0.pts[j], f1.pts[j], al);
        updateHand(scratch);
        if (document.activeElement !== $("scrub")) {
          $("scrub").value = play.dur ? Math.round(play.t / play.dur * 1000) : 0;
        }
        renderer3.render(scene, camera3);
      }
      $("playBtn").addEventListener("click", function () {
        play.playing = !play.playing;
        $("playBtn").textContent = play.playing ? "⏸ 一時停止" : "▶ 再生";
      });
      $("sampleBtn").addEventListener("click", function () {
        initPlayer().then(function () {
          loadSample();
          play.playing = true;
          $("playBtn").textContent = "⏸ 一時停止";
          $("playInfo").textContent = "サンプル再生中。ドラッグで回転、ピンチで拡大縮小。";
        });
      });
      $("mirrorBtn").addEventListener("click", function () {
        play.mirror = !play.mirror;
        if (mirrorGroup) mirrorGroup.scale.x = play.mirror ? -1 : 1;
        $("mirrorBtn").textContent = play.mirror ? "左右反転：ON" : "左右反転：OFF";
      });
      Array.prototype.forEach.call(document.querySelectorAll(".spdBtn"), function (b) {
        b.addEventListener("click", function () {
          play.speed = parseFloat(b.getAttribute("data-v"));
          Array.prototype.forEach.call(document.querySelectorAll(".spdBtn"), function (x) {
            x.classList.toggle("on", x === b);
          });
        });
      });
      $("scrub").addEventListener("input", function () {
        if (play.dur) play.t = parseInt($("scrub").value, 10) / 1000 * play.dur;
      });

      hookModule();
      status("「カメラ開始」を押してね（モデルは先読み中）");
    </script>

    <script>
      /* MediaPipe legacy solutions via classic script tags (no ES modules),
         per-file CDN fallback: jsdelivr -> unpkg. Errors are surfaced verbatim. */
      (function () {
        "use strict";
        var CDNS = ["https://cdn.jsdelivr.net/npm/", "https://unpkg.com/"];
        var videoEl = null;
        var hands = null, faceDet = null;
        var libsPromise = null;
        var baseHands = null, baseFace = null;
        var latestHands = [], latestFaces = [];
        var sending = false, lastVideoTime = -1, loopStarted = false;
        var lastErr = null;

        function prog(s) { if (window.__mpProgressCb) window.__mpProgressCb(s); }
        function loadScript(url) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = url;
            s.onload = function () { resolve(); };
            s.onerror = function () { reject(new Error("読み込み失敗: " + url)); };
            document.head.appendChild(s);
          });
        }
        async function loadPkg(pkg, file) {
          var err = null;
          for (var i = 0; i < CDNS.length; i++) {
            try { await loadScript(CDNS[i] + pkg + "/" + file); return CDNS[i] + pkg + "/"; }
            catch (e) { err = e; }
          }
          throw err || new Error(pkg + " を読み込めませんでした");
        }
        function pushFrame() {
          var want = window.__mpWant || { hand: true, face: true };
          if (window.onMpFrame) {
            window.onMpFrame({
              hands: want.hand ? latestHands : [],
              faces: want.face ? latestFaces : []
            });
          }
        }
        function onHands(r) {
          latestHands = (r.multiHandLandmarks || []).map(function (lms, i) {
            var hd = r.multiHandedness && r.multiHandedness[i] ? (r.multiHandedness[i].label || "") : "";
            var wl = r.multiHandWorldLandmarks && r.multiHandWorldLandmarks[i] ? r.multiHandWorldLandmarks[i] : lms;
            return {
              pts: lms.map(function (p) { return [p.x, p.y]; }),
              wpts: wl.map(function (p) { return [p.x, p.y, p.z]; }),
              handed: hd,
              pinch: Math.hypot(lms[8].x - lms[4].x, lms[8].y - lms[4].y) < 0.055
            };
          });
          if (window.onHandRecord && latestHands.length) window.onHandRecord(latestHands[0]);
          pushFrame();
        }
        function onFaces(r) {
          latestFaces = (r.multiFaceLandmarks || []).map(function (lms) {
            return { pts: lms.map(function (p) { return [p.x, p.y]; }) };
          });
          pushFrame();
        }
        function warmCanvas() {
          var c = document.createElement("canvas");
          c.width = 256; c.height = 256;
          var g = c.getContext("2d");
          g.fillStyle = "#000"; g.fillRect(0, 0, 256, 256);
          return c;
        }

        window.__mpStart = async function (video) {
          videoEl = video;
          try {
            if (!libsPromise) {
              libsPromise = (async function () {
                prog("ライブラリ読込中（手）");
                baseHands = await loadPkg("@mediapipe/hands", "hands.js");
                prog("ライブラリ読込中（顔）");
                baseFace = await loadPkg("@mediapipe/face_mesh", "face_mesh.js");
              })();
            }
            await libsPromise;
            var handOk = false, faceOk = false;
            var warm = warmCanvas();
            if (!hands) {
              prog("手のモデル読込中");
              try {
                hands = new Hands({ locateFile: function (f) { return baseHands + f; } });
                hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
                hands.onResults(onHands);
                await hands.send({ image: warm });
                handOk = true;
              } catch (e) { hands = null; lastErr = e; }
            } else { handOk = true; }
            if (!faceDet) {
              prog("顔のモデル読込中");
              try {
                faceDet = new FaceMesh({ locateFile: function (f) { return baseFace + f; } });
                faceDet.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
                faceDet.onResults(onFaces);
                await faceDet.send({ image: warm });
                faceOk = true;
              } catch (e) { faceDet = null; lastErr = lastErr || e; }
            } else { faceOk = true; }
            if (handOk || faceOk) {
              if (window.__mpReadyCb) window.__mpReadyCb(handOk, faceOk);
              if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }
            } else if (window.__mpErrorCb) {
              window.__mpErrorCb(lastErr || new Error("両モデルとも初期化に失敗しました"));
            }
          } catch (e) {
            if (window.__mpErrorCb) window.__mpErrorCb(e);
          }
        };

        async function loop() {
          requestAnimationFrame(loop);
          if (!videoEl || videoEl.readyState < 2 || sending) return;
          if (videoEl.currentTime === lastVideoTime) return;
          lastVideoTime = videoEl.currentTime;
          var want = window.__mpWant || { hand: true, face: true };
          sending = true;
          try {
            if (want.hand && hands) await hands.send({ image: videoEl });
            if (want.face && faceDet) await faceDet.send({ image: videoEl });
          } catch (e) { /* transient */ }
          sending = false;
        }
      })();
    </script>
  </body>
