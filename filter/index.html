<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8ecdf">
<title>フィルターさがし</title>
<style>
:root{
  --ink:#4a3426; --ink2:#8d6d58; --ink3:#b39883; --card:rgba(255,251,246,.8); --line:rgba(255,255,255,.85);
  --warm1:#f7b26e; --warm2:#ec7f45; --bg:#f8ecdf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:none;-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}

header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 2px 6px}
header h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:19px;font-weight:600;letter-spacing:.14em;
  text-shadow:0 0 14px rgba(255,180,110,.7)}
.hbtns{display:flex;gap:6px}
.pill{height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.75);font-size:12.5px;font-weight:700;box-shadow:0 2px 10px rgba(120,70,30,.1)}
.pill:active{transform:scale(.96)}

.lead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 8px;font-size:12px;color:var(--ink2)}
.lead b{font-size:13px;color:var(--ink)}
#gridBox{position:relative;display:flex;justify-content:center}
#gridIn{position:relative;transition:opacity .16s}
#gridIn.fade{opacity:.25}
#c{display:block}
.tile{position:absolute;padding:0;background:transparent;border-radius:12px;box-shadow:0 0 0 4px var(--bg);
  -webkit-touch-callout:none;touch-action:manipulation;transition:transform .12s}
.tile::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 0 rgba(236,127,69,0);transition:box-shadow .15s}
.tile.picked::after{box-shadow:inset 0 0 0 4px #ec7f45}
.tile:active{transform:scale(.985)}
.tile .rk{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:15px;display:none;place-items:center;
  background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff;font-size:15px;font-weight:900;box-shadow:0 3px 10px rgba(200,100,40,.4)}
.tile.ranked .rk{display:grid}
.tile.ranked::after{box-shadow:inset 0 0 0 3px #ec7f45}
.tile.last .rk{background:#b39883;box-shadow:none}
.tile.last::after{box-shadow:inset 0 0 0 3px #b39883}
.leadR{display:flex;align-items:center;gap:8px;flex:none}
.lead b{white-space:nowrap}
#topOnly{white-space:nowrap;height:26px;padding:0 10px;border-radius:13px;background:#fff;font-size:11.5px;font-weight:800;color:#d8692e;box-shadow:0 2px 8px rgba(120,70,30,.12)}
#topOnly[hidden]{display:none}

.tools{display:flex;gap:8px;margin-top:12px}
.tool{flex:1;height:46px;border-radius:23px;background:#fff;font-size:13.5px;font-weight:800;box-shadow:0 3px 12px rgba(120,70,30,.1)}
.tool.like{background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff;box-shadow:0 8px 20px rgba(236,127,69,.32)}
.tool:disabled{opacity:.4}
.tool:active{transform:scale(.97)}
#dna{display:block;width:100%;height:26px;margin-top:10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:12px;box-shadow:0 6px 24px rgba(120,70,30,.08)}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--ink2);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:600;letter-spacing:.02em;color:var(--ink3)}
.favs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{position:relative;flex:none;width:66px;height:66px;border-radius:14px;background:#ddd center/cover no-repeat;box-shadow:0 3px 10px rgba(120,70,30,.15)}
.fav span{position:absolute;left:4px;bottom:4px;padding:1px 6px;border-radius:8px;background:rgba(255,250,244,.85);font-size:10px;font-weight:800}
.fav .del{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;font-size:11px;font-weight:900;color:#b4462c;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18);font-style:normal}
.fav .del.sure{background:#b4462c;color:#fff}
.empty{font-size:12px;color:var(--ink3);padding:6px 2px}
.stats{font-size:12px;color:var(--ink2);line-height:1.8}
.stats b{color:var(--ink)}
.range{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);margin-top:2px}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(120,80,50,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#f8cfa2,#ee8a4a);transition:width .3s}
.subacts{display:flex;gap:8px;margin-top:10px}
.subacts button{flex:1;height:38px;border-radius:19px;background:#fff;font-size:12.5px;font-weight:800;box-shadow:0 3px 10px rgba(120,70,30,.1)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:10.5px;color:var(--ink3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:0}

#big{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));background:rgba(248,236,223,.94);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#big.open{display:flex}
#bigImg{position:relative;max-width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.bighint{font-size:11.5px;color:var(--ink2);margin-top:-6px}
#bigImg{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#bigImg canvas{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 14px 40px rgba(120,70,30,.25)}
.bbtns{display:flex;gap:8px;width:100%;max-width:460px}
.bbtns button{flex:1;height:48px;border-radius:24px;background:#fff;font-size:14px;font-weight:800;box-shadow:0 3px 12px rgba(120,70,30,.12);
  -webkit-touch-callout:none}
.bbtns .main{background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  padding:10px 18px;border-radius:20px;background:rgba(74,52,38,.92);color:#fff;font-size:13px;font-weight:700;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;white-space:normal;max-width:88vw;width:max-content;text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
input[type=file]{display:none}
.baseRow{display:flex;align-items:center;gap:10px;margin:-2px 2px 10px;font-size:12px;font-weight:800;color:var(--ink2)}
.baseRow[hidden]{display:none}
.seg2{flex:1;display:flex;padding:3px;border-radius:16px;background:rgba(255,255,255,.6);gap:2px}
.seg2 button{flex:1;height:28px;border-radius:13px;background:transparent;font-size:12px;font-weight:800;color:var(--ink2)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(150,90,40,.15)}
#mapCard[hidden]{display:none}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mapBox{min-width:0}
.mapBox.wide{margin-top:12px}
.mapT{font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mapT select{font:inherit;font-size:11.5px;font-weight:800;color:var(--ink);border:none;border-radius:10px;padding:3px 6px;background:#fff;box-shadow:0 2px 6px rgba(120,70,30,.1)}
#posMap,#colMap{width:100%;aspect-ratio:1;display:block;touch-action:none;border-radius:12px}
#pairMap{width:100%;aspect-ratio:2/1;display:block;touch-action:none;border-radius:12px}

.stage{display:flex;padding:3px;border-radius:18px;background:rgba(255,255,255,.6);gap:2px;margin:0 0 10px}
.stage button{flex:1;height:32px;border-radius:15px;background:transparent;font-size:12.5px;font-weight:800;color:var(--ink2)}
.stage button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(150,90,40,.15)}
.rank{font-size:12px;color:var(--ink2);margin:-2px 0 8px;line-height:1.6}
.rank b{color:#d8692e}
.krow{display:grid;grid-template-columns:100px 1fr 40px;align-items:center;gap:8px;height:42px}
.kname{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;background:none;padding:0;text-align:left;color:var(--ink)}
.kname svg{width:13px;height:13px;flex:none;opacity:.28;transition:opacity .2s}
.krow.locked .kname svg{opacity:1}
.krow.locked .kname{color:#d8692e}
.kcv{width:100%;height:36px;touch-action:none;display:block}
.kval{font-size:11px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--ink3);line-height:1.6;margin-top:8px}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>フィルターさがし</h1>
    <div class="hbtns">
      <button class="pill" id="pickBtn">画像</button>
      <button class="pill" id="saveBtn">保存</button>
    </div>
  </header>

  <div class="stage" id="stageSeg"><button data-v="macro" class="on">ざっくり</button><button data-v="fine">細かく</button><button data-v="leak">光漏れ</button></div>
  <div class="baseRow" id="baseRow" hidden><span>ベース</span><div class="seg2" id="baseSeg"><button data-v="orig" class="on">元の画像</button><button data-v="grade">今の色補正</button></div></div>
  <div class="lead"><span id="leadTxt">いちばん好きな1枚をタップ（長押しで拡大）</span><span class="leadR"><b id="roundNo">1回目</b></span></div>
  <div id="gridBox"><div id="gridIn"><canvas id="c"></canvas><div id="tiles"></div></div></div>

  <div class="tools">
    <button class="tool" id="undo">↶ 戻る</button>
    <button class="tool like" id="like">☆ 登録</button>
    <button class="tool" id="wide">↻ 広く探す</button>
  </div>
  <canvas id="dna"></canvas>

  <section class="card" id="anaCard">
    <h2>好みの分析 <small id="anaSub">AIが学んだ好き度</small></h2>
    <div class="rank" id="rank"></div>
    <div id="krows"></div>
    <div class="note">線はAIが予想する「好き度」（上ほど好き）、帯は自信のなさ。白い点が今のベストで、線の上をなぞると直接変えられます。左の名前をタップすると固定（探索で動かさない）。</div>
  </section>

  <section class="card" id="mapCard" hidden>
    <h2>光漏れの地図 <small>濃いほどAIの予想で好き</small></h2>
    <div class="maps">
      <div class="mapBox"><div class="mapT">どこから入るのが好き？</div><canvas id="posMap"></canvas></div>
      <div class="mapBox"><div class="mapT">色の組み合わせ（横：芯 / 縦：外）</div><canvas id="colMap"></canvas></div>
    </div>
    <div class="mapBox wide"><div class="mapT">相性 <select id="pairA"></select> × <select id="pairB"></select></div><canvas id="pairMap"></canvas></div>
    <div class="note">白い点が今のベスト。地図をタップすると、その値に直接変えられます。</div>
  </section>

  <section class="card">
    <h2>登録 <small id="favCount">0件</small></h2>
    <div class="favs" id="favs"></div>
  </section>

  <section class="card">
    <h2>AIの様子 <small>選好ベイズ最適化</small></h2>
    <div class="stats" id="stats"></div>
    <div class="range"><span>狭い</span><div class="bar"><i id="rangeBar"></i></div><span>広い</span></div>
    <div class="subacts">
      <button id="resetBtn">最初から</button>
      <button id="expBtn">書き出し</button>
      <button id="csvBtn">CSV</button>
      <button id="impBtn">読み込み</button>
    </div>
    <div class="legend">
      <span><i style="background:#ee8a4a"></i>色</span><span><i style="background:#6f8fb8"></i>細かさ</span>
      <span><i style="background:#e8b931"></i>光の滲み</span><span><i style="background:#a07cc0"></i>場所</span><span><i style="background:#9a8a7c"></i>粒子</span>
    </div>
  </section>
</div>

<div id="big">
  <div id="bigImg"></div>
  <div class="bighint">画像を押している間は元の画像</div>
  <div class="bbtns">
    <button id="bigClose">閉じる</button>
    <button id="bigLike">☆ 登録</button>
    <button class="main" id="bigPick">これを選ぶ</button>
  </div>
</div>

<input type="file" id="file" accept="image/*">
<input type="file" id="impFile" accept="application/json,.json">
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const toast = (t, ms = 1600) => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), ms); };

/* =====================================================================
   遺伝子（フィルターの設計図）: すべて 0〜1。n は「何もしない」値
   ===================================================================== */
const GENES = [
  // 色：トーンカーブ（全体） + RGBごとのずれ + 彩度
  { k:'black',  g:'c', n:0,  label:'黒の浮き' },
  { k:'white',  g:'c', n:0,  label:'白の沈み' },
  { k:'mS',     g:'c', n:.5, label:'暗部' },
  { k:'mM',     g:'c', n:.5, label:'中間' },
  { k:'mH',     g:'c', n:.5, label:'明部' },
  { k:'rS', g:'c', n:.5 }, { k:'rM', g:'c', n:.5 }, { k:'rH', g:'c', n:.5 },
  { k:'gS', g:'c', n:.5 }, { k:'gM', g:'c', n:.5 }, { k:'gH', g:'c', n:.5 },
  { k:'bS', g:'c', n:.5 }, { k:'bM', g:'c', n:.5 }, { k:'bH', g:'c', n:.5 },
  { k:'sat',    g:'c', n:.6, label:'彩度' },
  // 細かさ：ラプラシアンピラミッドの各帯域の倍率（細かい→粗い）
  { k:'f0', g:'f', n:.5 }, { k:'f1', g:'f', n:.5 }, { k:'f2', g:'f', n:.5 },
  { k:'f3', g:'f', n:.5 }, { k:'f4', g:'f', n:.5 }, { k:'f5', g:'f', n:.5 },
  // 光の滲み
  { k:'bloom',  g:'b', n:0 }, { k:'bThr', g:'b', n:.5 }, { k:'bSpr', g:'b', n:.5 }, { k:'bTint', g:'b', n:.5 },
  // 場所（中心からの距離）
  { k:'vig',    g:'p', n:0 }, { k:'haze', g:'p', n:0 }, { k:'eBlur', g:'p', n:0 }, { k:'eRad', g:'p', n:.5 },
  // 粒子
  { k:'grain',  g:'n', n:0 }, { k:'gSize', g:'n', n:.3 },
];
const D = GENES.length;
const NEUTRAL = GENES.map(g => g.n);
const GROUP_COLOR = { c:'#ee8a4a', f:'#6f8fb8', b:'#e8b931', p:'#a07cc0', n:'#9a8a7c' };
const idx = Object.fromEntries(GENES.map((g, i) => [g.k, i]));

// 遺伝子 → 実際の数値
function decode(z) {
  const G = k => z[idx[k]];
  const off = v => (v - .5) * .24;
  const m = [G('black') * .22, .25 + off(G('mS')), .5 + off(G('mM')), .75 + off(G('mH')), 1 - G('white') * .22];
  const ch = c => {
    const s = off(G(c + 'S')), mi = off(G(c + 'M')), h = off(G(c + 'H'));
    const y = [m[0] + s * .6, m[1] + s, m[2] + mi, m[3] + h, m[4] + h * .6].map(v => clamp(v, 0, 1));
    for (let i = 1; i < 5; i++) y[i] = Math.max(y[i], y[i - 1] + .004);
    return y.map(v => Math.min(v, 1));
  };
  const tintZ = G('bTint');
  const tint = tintZ >= .5
    ? [1, 1 - (tintZ - .5) * .8, 1 - (tintZ - .5) * 1.3]
    : [1 - (.5 - tintZ) * .6, 1 - (.5 - tintZ) * .3, 1];
  return {
    curves: [ch('r'), ch('g'), ch('b')],
    sat: .25 + G('sat') * 1.25,
    gains: [0, 1, 2, 3, 4, 5].map(i => Math.pow(2, (G('f' + i) - .5) * 2 * (i === 0 ? 1.1 : 1.3))),
    bloom: G('bloom') * 3, bThr: .9 - G('bThr') * .55, bSpr: .45 + G('bSpr') * .43, tint,
    vig: G('vig') * .6, haze: G('haze') * .7, eBlur: G('eBlur'), eRad: .3 + G('eRad') * .6,
    grain: G('grain') * .14, gSize: 1 + G('gSize') * 2,
  };
}

// 単調な3次補間で256段のLUTを作る
const LUTDATA = new Uint8Array(256 * 4);
function buildLUT(curves) {
  const xs = [0, .25, .5, .75, 1];
  for (let c = 0; c < 3; c++) {
    const y = curves[c], n = 5, d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (xs[i + 1] - xs[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    for (let k = 0; k < 256; k++) {
      const x = k / 255; let i = Math.min(3, Math.floor(x * 4));
      const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h;
      const h00 = 2*t*t*t - 3*t*t + 1, h10 = t*t*t - 2*t*t + t, h01 = -2*t*t*t + 3*t*t, h11 = t*t*t - t*t;
      const v = h00 * y[i] + h10 * h * m[i] + h01 * y[i + 1] + h11 * h * m[i + 1];
      LUTDATA[k * 4 + c] = Math.round(clamp(v, 0, 1) * 255);
    }
  }
  for (let k = 0; k < 256; k++) LUTDATA[k * 4 + 3] = 255;
}

/* =====================================================================
   WebGL
   ===================================================================== */
const canvas = $('#c');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:true, depth:false, stencil:false, premultipliedAlpha:false, preserveDrawingBuffer:false });
if (!gl) { document.body.innerHTML = '<p style="padding:40px;text-align:center">この端末ではWebGL2が使えないため動かせません</p>'; return; }
const LV = 6;           // 細かさの帯域の数
const BL = 7;           // 滲みの段数
let FMT, ENC = 1;

const VS = `#version 300 es
layout(location=0) in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*.5+.5; gl_Position = vec4(aPos,0.,1.); }`;
const HEAD = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
const vec3 LUMA = vec3(.2126,.7152,.0722);
`;
const TENT = `
vec3 tent(sampler2D t, vec2 uv, vec2 tx){
  vec4 d = vec4(1.,1.,-1.,0.)*tx.xyxy;
  vec3 s = texture(t, uv - d.xy).rgb + texture(t, uv - d.zy).rgb + texture(t, uv + d.zy).rgb + texture(t, uv + d.xy).rgb;
  s += (texture(t, uv - d.wy).rgb + texture(t, uv + d.zw).rgb + texture(t, uv + d.xw).rgb + texture(t, uv + d.wy).rgb)*2.;
  s += texture(t, uv).rgb*4.;
  return s/16.;
}`;
const FS_SRC = HEAD + `uniform sampler2D uImg; void main(){ o = vec4(texture(uImg, vUv).rgb, 1.); }`;
const FS_DOWN = HEAD + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 s = texture(uTex, vUv)*4.;
  s += texture(uTex, vUv - uTexel); s += texture(uTex, vUv + uTexel);
  s += texture(uTex, vUv + vec2(uTexel.x,-uTexel.y)); s += texture(uTex, vUv + vec2(-uTexel.x, uTexel.y));
  o = s/8.;
}`;
// 再構成：R_k = up(R_{k+1}) + gain * (G_k - up(G_{k+1}))
const FS_REC = HEAD + TENT + `

  { k:'warm',     label:'暖かさ',     two:true },
  { k:'tint',     label:'色かぶり',   two:true },
  { k:'sat',      label:'彩度',       two:true },
  { k:'soft',     label:'柔らかさ',   two:true },

  if (!imgTex) return;
  const z = zIn.map(r4), lk = leak ? leak.map(r4) : null;
  if (store.favs.some(f => distPlain(f.z, z) < 1e-3 && (!!f.leak === !!lk) && (!lk || distPlain(f.leak, lk) < 1e-3))) { toast('もう登録されています'); return; }
  const f = { id: nextId++, z, u: u ? u.slice() : null, leak: lk, thumb: thumbOf(z, lk), t: Date.now() };
  store.favs.push(f); persist(); renderFavs(); toast(`★${f.id} を登録しました`);
}
function addFavFromTile(t) { addFav(t.z, S.stage === 'macro' ? t.x : null, t.leak); }
$('#like').addEventListener('click', () => addFav(bestZ(), S.stage === 'macro' ? S.uBest : null, bestLeak()));
let delArmed = null;
function renderFavs() {
  const box = $('#favs'); box.innerHTML = '';
  $('#favCount').textContent = store.favs.length + '件';
  if (!store.favs.length) { box.innerHTML = '<div class="empty">気に入ったら「☆ 登録」（直前に選んだ1枚）か、長押しして「☆ 登録」。消すまで残ります。タップするとそこから探し直せます</div>'; return; }
  for (const f of store.favs.slice().reverse()) {
    const b = document.createElement('button'); b.className = 'fav';
    b.style.backgroundImage = `url(${f.thumb})`;
    b.innerHTML = `<span>★${f.id}${f.leak ? ' 光' : ''}</span><i class="del${delArmed === f.id ? ' sure' : ''}">${delArmed === f.id ? '消す' : '✕'}</i>`;
    b.addEventListener('click', e => {
      if (e.target.classList.contains('del')) {
        if (delArmed === f.id) { store.favs = store.favs.filter(x => x.id !== f.id); delArmed = null; persist(); renderFavs(); toast(`★${f.id} を消しました`); }
        else { delArmed = f.id; renderFavs(); }
        return;
      }
      delArmed = null;
      if (f.leak) {
        // 光漏れの★：光漏れモードでそこから探す（ベースも★の色補正にする）
        S.lBest = f.leak.slice(); S.zBest = f.z.slice(); S.base = distPlain(f.z, NEUTRAL) < 1e-3 ? 'orig' : 'grade'; S.stage = 'leak';
        toast(`★${f.id} の光漏れから探します`);
      } else if (S.stage === 'leak') {
        // 色補正の★を光漏れのベースにする
        S.zBest = f.z.slice(); if (f.u) S.uBest = f.u.slice(); S.base = 'grade';
        toast(`★${f.id} の色補正をベースにしました`);
      } else {
        if (f.u && f.u.length === KD) S.uBest = f.u.slice();
        S.zBest = f.z.slice();
        if (!f.u && S.stage === 'macro') { S.stage = 'fine'; toast(`★${f.id} は細かく調整したものなので「細かく」で探します`); }
        else toast(`★${f.id} から探します`);
      }
      SPACE[S.stage].sigma = S.stage === 'fine' ? .06 : .15; undoStack = [];
      updateStageUI(); makeRound(); computeAnalysis(); persist(); renderFavs();
    });
    box.appendChild(b);
  }
}

// 最初から・書き出し・読み込み・CSV
let resetArmed = false;
$('#resetBtn').addEventListener('click', () => {
  if (!resetArmed) { resetArmed = true; $('#resetBtn').textContent = 'もう一度で消去'; setTimeout(() => { resetArmed = false; $('#resetBtn').textContent = '最初から'; }, 2500); return; }
  resetArmed = false; $('#resetBtn').textContent = '最初から';
  const k = S.stage;
  SPACE[k].gp.X = []; SPACE[k].gp.C = []; SPACE[k].gp.fit();
  if (k === 'macro') { SPACE.macro.sigma = .25; S.uBest = U0.slice(); S.zBest = knobsToGenes(U0); S.locks = KNOBS.map(() => false); }
  else if (k === 'fine') { SPACE.fine.sigma = .07; }
  else { SPACE.leak.sigma = .25; S.lBest = LEAK0.slice(); S.lLocks = LEAKS.map(l => !!l.extra); }
  log = log.filter(e => e.st !== k); undoStack = [];
  rowsFor = null; makeRound(); computeAnalysis(); persist();
  toast(`「${{ macro: 'ざっくり', fine: '細かく', leak: '光漏れ' }[k]}」の学習をリセットしました（登録は残ります）`);
});
const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
$('#expBtn').addEventListener('click', () => {
  const data = { app: 'filtlab', v: 4, knobs: KNOBS.map(k => k.k), leaks: LEAKS.map(l => l.k), genes: GENES.map(g => g.k), favs: store.favs, ...snapshot() };
  download(new Blob([JSON.stringify(data)], { type: 'application/json' }), 'filter-data.json');
});
$('#csvBtn').addEventListener('click', () => {
  // 1行＝表示された1枚。chosen=1位なら1、was_best=そのときのベストなら1
  const head = ['round', 'stage', 'tile', 'chosen', 'was_best', ...KNOBS.map(k => k.label), ...LEAKS.map(l => '光漏れ_' + l.label), ...GENES.map(g => g.k)];
  const rows = [head.join(',')];
  for (const e of log) e.t.forEach((t, k) => {
    const u = e.st === 'macro' ? t.x : KNOBS.map(() => '');
    const L = e.st === 'leak' ? t.x : LEAKS.map(() => '');
    const z = e.st === 'macro' ? knobsToGenes(t.x) : e.st === 'fine' ? t.x : GENES.map(() => '');
    rows.push([e.r, e.st, k + 1, t.c === 1 ? 1 : 0, t.b, ...u, ...L, ...z].join(','));
  });
  download(new Blob(['﻿' + rows.join('\n')], { type: 'text/csv' }), 'filter-choices.csv');
});
$('#impBtn').addEventListener('click', () => $('#impFile').click());
$('#impFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (!d.favs) throw 0;
    store.favs = d.favs; nextId = store.favs.reduce((m, x) => Math.max(m, x.id), 0) + 1;
    loadState(d);
    for (const k of ['macro', 'fine', 'leak']) SPACE[k].gp.fit();
    undoStack = []; rowsFor = null; updateStageUI(); makeRound(); computeAnalysis(); persist(); renderFavs(); toast('読み込みました');
  } catch (err) { toast('読み込めませんでした'); }
});

// 保存（ベストを元の解像度で）
$('#saveBtn').addEventListener('click', async () => {
  if (!imgTex) return;
  const s = Math.min(1, 3000 / Math.max(imgW, imgH)), w = Math.round(imgW * s), h = Math.round(imgH * s);
  const c = renderToCanvas(bestZ(), w, h, 3, false, bestLeak()); dirty = true;
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .92));
  const name = `filter_${Date.now()}.jpg`, file = new File([blob], name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  download(blob, name);
});

/* ---------- ループと起動 ---------- */
function frame() {
  requestAnimationFrame(frame);
  if (dirty && imgTex && geo) { drawGrid(); dirty = false; }
}
(function boot() {
  buildTiles(); buildPairSelects(); updateStageUI();
  const saved = localStorage.getItem('filtlab-img');
  const go = src => {
    setImage(src);
    for (const k of ['macro', 'fine', 'leak']) SPACE[k].gp.fit();
    makeRound(); computeAnalysis(); renderFavs(); updateStats(); requestAnimationFrame(frame);
  };
  if (saved) { const img = new Image(); img.onload = () => go(img); img.onerror = () => go(sampleImage()); img.src = saved; }
  else { go(sampleImage()); setTimeout(() => toast('右上の「画像」から好きな写真を選べます', 2600), 600); }
})();

// テスト用
window.__lab = { SPACE, S, KNOBS, LEAKS, LEAK0, knobsToGenes, get tiles() { return tiles; }, choose, undo, distPlain, distLeak, makeRound,
  computeAnalysis, get curves() { return curves; }, get maps() { return maps; }, U0, renderToCanvas, NEUTRAL };
})();
</script>
</body>
</html>
