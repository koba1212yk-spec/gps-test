<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8ecdf">
<title>フィルターさがし</title>
<style>
:root{
  --ink:#4a3426; --ink2:#8d6d58; --ink3:#b39883; --card:rgba(255,251,246,.8); --line:rgba(255,255,255,.85);
  --warm1:#f7b26e; --warm2:#ec7f45; --bg:#f8ecdf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:none;-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}

header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 2px 6px}
header h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:19px;font-weight:600;letter-spacing:.14em;
  text-shadow:0 0 14px rgba(255,180,110,.7)}
.hbtns{display:flex;gap:6px}
.pill{height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.75);font-size:12.5px;font-weight:700;box-shadow:0 2px 10px rgba(120,70,30,.1)}
.pill:active{transform:scale(.96)}

.lead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 8px;font-size:12px;color:var(--ink2)}
.lead b{font-size:13px;color:var(--ink)}
#gridBox{position:relative;display:flex;justify-content:center}
#gridIn{position:relative;transition:opacity .16s}
#gridIn.fade{opacity:.25}
#c{display:block}
.tile{position:absolute;padding:0;background:transparent;border-radius:12px;box-shadow:0 0 0 4px var(--bg);
  -webkit-touch-callout:none;touch-action:manipulation;transition:transform .12s}
.tile::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 0 rgba(236,127,69,0);transition:box-shadow .15s}
.tile.picked::after{box-shadow:inset 0 0 0 4px #ec7f45}
.tile:active{transform:scale(.985)}
.tile .inc{position:absolute;left:6px;top:6px;padding:3px 8px;border-radius:10px;background:rgba(255,250,244,.88);font-size:10.5px;font-weight:800;
  color:#d8692e;display:none}
.tile.isInc .inc{display:block}

.tools{display:flex;gap:8px;margin-top:12px}
.tool{flex:1;height:46px;border-radius:23px;background:#fff;font-size:13.5px;font-weight:800;box-shadow:0 3px 12px rgba(120,70,30,.1)}
.tool.like{background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff;box-shadow:0 8px 20px rgba(236,127,69,.32)}
.tool:disabled{opacity:.4}
.tool:active{transform:scale(.97)}
#dna{display:block;width:100%;height:26px;margin-top:10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:12px;box-shadow:0 6px 24px rgba(120,70,30,.08)}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--ink2);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:600;letter-spacing:.02em;color:var(--ink3)}
.favs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{position:relative;flex:none;width:66px;height:66px;border-radius:14px;background:#ddd center/cover no-repeat;box-shadow:0 3px 10px rgba(120,70,30,.15)}
.fav span{position:absolute;left:4px;bottom:4px;padding:1px 6px;border-radius:8px;background:rgba(255,250,244,.85);font-size:10px;font-weight:800}
.fav .del{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;font-size:11px;font-weight:900;color:#b4462c;
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18);font-style:normal}
.fav .del.sure{background:#b4462c;color:#fff}
.empty{font-size:12px;color:var(--ink3);padding:6px 2px}
.stats{font-size:12px;color:var(--ink2);line-height:1.8}
.stats b{color:var(--ink)}
.range{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);margin-top:2px}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(120,80,50,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#f8cfa2,#ee8a4a);transition:width .3s}
.subacts{display:flex;gap:8px;margin-top:10px}
.subacts button{flex:1;height:38px;border-radius:19px;background:#fff;font-size:12.5px;font-weight:800;box-shadow:0 3px 10px rgba(120,70,30,.1)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:10.5px;color:var(--ink3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:0}

#big{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));background:rgba(248,236,223,.94);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#big.open{display:flex}
#bigImg{position:relative;max-width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#bigImg canvas{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 14px 40px rgba(120,70,30,.25)}
.bbtns{display:flex;gap:8px;width:100%;max-width:460px}
.bbtns button{flex:1;height:48px;border-radius:24px;background:#fff;font-size:14px;font-weight:800;box-shadow:0 3px 12px rgba(120,70,30,.12);
  -webkit-touch-callout:none}
.bbtns .main{background:linear-gradient(135deg,var(--warm1),var(--warm2));color:#fff}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  padding:10px 18px;border-radius:20px;background:rgba(74,52,38,.92);color:#fff;font-size:13px;font-weight:700;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>フィルターさがし</h1>
    <div class="hbtns">
      <button class="pill" id="pickBtn">画像</button>
      <button class="pill" id="saveBtn">保存</button>
    </div>
  </header>

  <div class="lead"><span>いちばん好きな1枚をタップ（長押しで大きく）</span><b id="roundNo">1回目</b></div>
  <div id="gridBox"><div id="gridIn"><canvas id="c"></canvas><div id="tiles"></div></div></div>

  <div class="tools">
    <button class="tool" id="undo">↶ 戻る</button>
    <button class="tool like" id="like">☆ ベストを登録</button>
    <button class="tool" id="wide">↻ 広く探す</button>
  </div>
  <canvas id="dna"></canvas>

  <section class="card">
    <h2>登録 <small id="favCount">0件</small></h2>
    <div class="favs" id="favs"></div>
  </section>

  <section class="card">
    <h2>AIの様子 <small>選好ベイズ最適化</small></h2>
    <div class="stats" id="stats"></div>
    <div class="range"><span>狭い</span><div class="bar"><i id="rangeBar"></i></div><span>広い</span></div>
    <div class="subacts">
      <button id="resetBtn">最初から</button>
      <button id="expBtn">書き出し</button>
      <button id="impBtn">読み込み</button>
    </div>
    <div class="legend">
      <span><i style="background:#ee8a4a"></i>色</span><span><i style="background:#6f8fb8"></i>細かさ</span>
      <span><i style="background:#e8b931"></i>光の滲み</span><span><i style="background:#a07cc0"></i>場所</span><span><i style="background:#9a8a7c"></i>粒子</span>
    </div>
  </section>
</div>

<div id="big">
  <div id="bigImg"></div>
  <div class="bbtns">
    <button id="bigClose">閉じる</button>
    <button id="bigOrig">押して元の画像</button>
    <button class="main" id="bigPick">これを選ぶ</button>
  </div>
</div>

<input type="file" id="file" accept="image/*">
<input type="file" id="impFile" accept="application/json,.json">
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const toast = (t, ms = 1600) => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), ms); };

/* =====================================================================
   遺伝子（フィルターの設計図）: すべて 0〜1。n は「何もしない」値
   ===================================================================== */
const GENES = [
  // 色：トーンカーブ（全体） + RGBごとのずれ + 彩度
  { k:'black',  g:'c', n:0,  label:'黒の浮き' },
  { k:'white',  g:'c', n:0,  label:'白の沈み' },
  { k:'mS',     g:'c', n:.5, label:'暗部' },
  { k:'mM',     g:'c', n:.5, label:'中間' },
  { k:'mH',     g:'c', n:.5, label:'明部' },
  { k:'rS', g:'c', n:.5 }, { k:'rM', g:'c', n:.5 }, { k:'rH', g:'c', n:.5 },
  { k:'gS', g:'c', n:.5 }, { k:'gM', g:'c', n:.5 }, { k:'gH', g:'c', n:.5 },
  { k:'bS', g:'c', n:.5 }, { k:'bM', g:'c', n:.5 }, { k:'bH', g:'c', n:.5 },
  { k:'sat',    g:'c', n:.6, label:'彩度' },
  // 細かさ：ラプラシアンピラミッドの各帯域の倍率（細かい→粗い）
  { k:'f0', g:'f', n:.5 }, { k:'f1', g:'f', n:.5 }, { k:'f2', g:'f', n:.5 },
  { k:'f3', g:'f', n:.5 }, { k:'f4', g:'f', n:.5 }, { k:'f5', g:'f', n:.5 },
  // 光の滲み
  { k:'bloom',  g:'b', n:0 }, { k:'bThr', g:'b', n:.5 }, { k:'bSpr', g:'b', n:.5 }, { k:'bTint', g:'b', n:.5 },
  // 場所（中心からの距離）
  { k:'vig',    g:'p', n:0 }, { k:'haze', g:'p', n:0 }, { k:'eBlur', g:'p', n:0 }, { k:'eRad', g:'p', n:.5 },
  // 粒子
  { k:'grain',  g:'n', n:0 }, { k:'gSize', g:'n', n:.3 },
];
const D = GENES.length;
const NEUTRAL = GENES.map(g => g.n);
const GROUP_COLOR = { c:'#ee8a4a', f:'#6f8fb8', b:'#e8b931', p:'#a07cc0', n:'#9a8a7c' };
const idx = Object.fromEntries(GENES.map((g, i) => [g.k, i]));

// 遺伝子 → 実際の数値
function decode(z) {
  const G = k => z[idx[k]];
  const off = v => (v - .5) * .24;
  const m = [G('black') * .22, .25 + off(G('mS')), .5 + off(G('mM')), .75 + off(G('mH')), 1 - G('white') * .22];
  const ch = c => {
    const s = off(G(c + 'S')), mi = off(G(c + 'M')), h = off(G(c + 'H'));
    const y = [m[0] + s * .6, m[1] + s, m[2] + mi, m[3] + h, m[4] + h * .6].map(v => clamp(v, 0, 1));
    for (let i = 1; i < 5; i++) y[i] = Math.max(y[i], y[i - 1] + .004);
    return y.map(v => Math.min(v, 1));
  };
  const tintZ = G('bTint');
  const tint = tintZ >= .5
    ? [1, 1 - (tintZ - .5) * .8, 1 - (tintZ - .5) * 1.3]
    : [1 - (.5 - tintZ) * .6, 1 - (.5 - tintZ) * .3, 1];
  return {
    curves: [ch('r'), ch('g'), ch('b')],
    sat: .25 + G('sat') * 1.25,
    gains: [0, 1, 2, 3, 4, 5].map(i => Math.pow(2, (G('f' + i) - .5) * 2 * (i === 0 ? 1.1 : 1.3))),
    bloom: G('bloom') * 3, bThr: .9 - G('bThr') * .55, bSpr: .45 + G('bSpr') * .43, tint,
    vig: G('vig') * .6, haze: G('haze') * .7, eBlur: G('eBlur'), eRad: .3 + G('eRad') * .6,
    grain: G('grain') * .14, gSize: 1 + G('gSize') * 2,
  };
}

// 単調な3次補間で256段のLUTを作る
const LUTDATA = new Uint8Array(256 * 4);
function buildLUT(curves) {
  const xs = [0, .25, .5, .75, 1];
  for (let c = 0; c < 3; c++) {
    const y = curves[c], n = 5, d = [], m = new Array(n);
    for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (xs[i + 1] - xs[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
    }
    for (let k = 0; k < 256; k++) {
      const x = k / 255; let i = Math.min(3, Math.floor(x * 4));
      const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h;
      const h00 = 2*t*t*t - 3*t*t + 1, h10 = t*t*t - 2*t*t + t, h01 = -2*t*t*t + 3*t*t, h11 = t*t*t - t*t;
      const v = h00 * y[i] + h10 * h * m[i] + h01 * y[i + 1] + h11 * h * m[i + 1];
      LUTDATA[k * 4 + c] = Math.round(clamp(v, 0, 1) * 255);
    }
  }
  for (let k = 0; k < 256; k++) LUTDATA[k * 4 + 3] = 255;
}

/* =====================================================================
   WebGL
   ===================================================================== */
const canvas = $('#c');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:true, depth:false, stencil:false, premultipliedAlpha:false, preserveDrawingBuffer:false });
if (!gl) { document.body.innerHTML = '<p style="padding:40px;text-align:center">この端末ではWebGL2が使えないため動かせません</p>'; return; }
const LV = 6;           // 細かさの帯域の数
const BL = 7;           // 滲みの段数
let FMT, ENC = 1;

const VS = `#version 300 es
layout(location=0) in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*.5+.5; gl_Position = vec4(aPos,0.,1.); }`;
const HEAD = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
const vec3 LUMA = vec3(.2126,.7152,.0722);
`;
const TENT = `
vec3 tent(sampler2D t, vec2 uv, vec2 tx){
  vec4 d = vec4(1.,1.,-1.,0.)*tx.xyxy;
  vec3 s = texture(t, uv - d.xy).rgb + texture(t, uv - d.zy).rgb + texture(t, uv + d.zy).rgb + texture(t, uv + d.xy).rgb;
  s += (texture(t, uv - d.wy).rgb + texture(t, uv + d.zw).rgb + texture(t, uv + d.xw).rgb + texture(t, uv + d.wy).rgb)*2.;
  s += texture(t, uv).rgb*4.;
  return s/16.;
}`;
const FS_SRC = HEAD + `uniform sampler2D uImg; void main(){ o = vec4(texture(uImg, vUv).rgb, 1.); }`;
const FS_DOWN = HEAD + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 s = texture(uTex, vUv)*4.;
  s += texture(uTex, vUv - uTexel); s += texture(uTex, vUv + uTexel);
  s += texture(uTex, vUv + vec2(uTexel.x,-uTexel.y)); s += texture(uTex, vUv + vec2(-uTexel.x, uTexel.y));
  o = s/8.;
}`;
// 再構成：R_k = up(R_{k+1}) + gain * (G_k - up(G_{k+1}))
const FS_REC = HEAD + TENT + `
uniform sampler2D uG, uGc, uRc; uniform vec2 uTc; uniform float uGain;
void main(){
  vec3 g = texture(uG, vUv).rgb;
  o = vec4(tent(uRc, vUv, uTc) + uGain*(g - tent(uGc, vUv, uTc)), 1.);
}`;
const FS_PRE = HEAD + `
uniform sampler2D uTex; uniform vec2 uTx; uniform float uThr, uEnc;
vec3 lin(vec3 c){ return pow(max(c, 0.), vec3(2.2)); }
void main(){
  vec2 d = uTx*.5;
  vec3 c = (lin(texture(uTex, vUv + vec2(-d.x,-d.y)).rgb) + lin(texture(uTex, vUv + vec2(d.x,-d.y)).rgb)
          + lin(texture(uTex, vUv + vec2(-d.x, d.y)).rgb) + lin(texture(uTex, vUv + vec2(d.x, d.y)).rgb))*.25;
  float br = max(c.r, max(c.g, c.b));
  float knee = uThr*.5 + 1e-4;
  float soft = clamp(br - uThr + knee, 0., 2.*knee); soft = soft*soft/(4.*knee);
  float k = max(soft, br - uThr)/max(br, 1e-4);
  o = vec4(c*k*(1. + 2.*smoothstep(.75, .98, br))*uEnc, 1.);
}`;
const FS_UP = HEAD + `
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  vec4 d = vec4(1.,1.,-1.,0.)*uTexel.xyxy;
  vec4 s = texture(uTex, vUv - d.xy) + texture(uTex, vUv - d.zy) + texture(uTex, vUv + d.zy) + texture(uTex, vUv + d.xy);
  s += (texture(uTex, vUv - d.wy) + texture(uTex, vUv + d.zw) + texture(uTex, vUv + d.xw) + texture(uTex, vUv + d.wy))*2.;
  s += texture(uTex, vUv)*4.;
  o = s/16.;
}`;
const FS_COMP = HEAD + TENT + `
uniform sampler2D uR0, uLow, uBloom, uLut, uImg;
uniform vec2 uLowTx;
uniform float uBypass, uAspect, uEnc, uBloomAmt, uSat, uVig, uHaze, uEBlur, uERad, uGrain, uGSize, uSeed;
uniform vec3 uTint;
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 tonemap(vec3 x){
  float m = max(x.r, max(x.g, x.b));
  float mc = m < .8 ? m : .8 + .2*(1. - exp(-(m - .8)/.2));
  return mix(x*(mc/max(m, 1e-5)), vec3(mc), smoothstep(1., 3.5, m)*.4);
}
float lut(float v, int ch){ return texture(uLut, vec2((clamp(v,0.,1.)*255. + .5)/256., .5))[ch]; }
void main(){
  if(uBypass > .5){ o = vec4(texture(uImg, vUv).rgb, 1.); return; }
  vec3 c = texture(uR0, vUv).rgb;
  vec2 q = (vUv - .5)*2.;
  float e = smoothstep(uERad, uERad + .75, length(q));
  c = mix(c, tent(uLow, vUv, uLowTx), e*uEBlur);
  vec3 lin = pow(max(c, 0.), vec3(2.2));
  vec3 b = texture(uBloom, vUv).rgb/uEnc;
  vec3 glow = mix(b, dot(b, LUMA)*uTint, .6)*uBloomAmt;
  // 光が足されていないところは元のまま（白も沈めない）
  float k = clamp(max(glow.r, max(glow.g, glow.b))*8., 0., 1.);
  c = pow(mix(min(lin, vec3(1.)), tonemap(lin + glow), k), vec3(1./2.2));
  c = vec3(lut(c.r, 0), lut(c.g, 1), lut(c.b, 2));
  float l = dot(c, LUMA);
  c = clamp(mix(vec3(l), c, uSat), 0., 1.);
  c *= 1. - uVig*e;
  c = mix(c, vec3(1., .95, .88), uHaze*e);
  vec2 g = floor(gl_FragCoord.xy/uGSize) + uSeed;
  l = dot(c, LUMA);
  c += (hash(g) + hash(g*.73 + 5.1) - 1.)*uGrain*(.4 + .6*(1. - abs(l*2. - 1.)));
  c += (hash(gl_FragCoord.xy + 7.7) - .5)/255.;
  o = vec4(clamp(c, 0., 1.), 1.);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const vsObj = compile(gl.VERTEX_SHADER, VS);
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, vsObj); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
const P = { src: program(FS_SRC), down: program(FS_DOWN), rec: program(FS_REC), pre: program(FS_PRE), up: program(FS_UP), comp: program(FS_COMP) };

try {
  const g = JSON.parse(localStorage.getItem('filtlab-gp') || 'null');
  if (g && g.X && g.C) { GP.X = g.X; GP.C = g.C; S.best = g.best || S.best; S.sigma = g.sigma || S.sigma; S.round = g.round || 0; }
} catch (e) {}
let nextId = store.favs.reduce((m, f) => Math.max(m, f.id), 0) + 1;
const persist = () => {
  try {
    localStorage.setItem('filtlab-v1', JSON.stringify({ favs: store.favs, dis: [], seen: [] }));
    localStorage.setItem('filtlab-gp', JSON.stringify({ X: GP.X.map(z => z.map(v => +v.toFixed(4))), C: GP.C, best: S.best, sigma: S.sigma, round: S.round }));
  } catch (e) { toast('端末の保存領域がいっぱいです'); }
};

const r4 = v => Math.round(v * 1e4) / 1e4;
function randomZ() { return GENES.map(g => r4(Math.random() < .45 ? clamp(g.n + gauss() * .06, 0, 1) : Math.random())); }
function around(base, s) { return base.map(v => r4(clamp(v + gauss() * s, 0, 1))); }
function mixZ(a, b) { return a.map((v, i) => r4(clamp(v + (b[i] - v) * Math.random() + gauss() * .03, 0, 1))); }

// 次の4枚：ベスト＋「好きそう」と「まだわからない」のバランスがいい3枚（UCB）
function makeRound() {
  const inc = S.best, sg = S.sigma, rootD = Math.sqrt(D);
  const pool = [];
  for (let i = 0; i < 360; i++) pool.push(around(inc, sg));
  for (let i = 0; i < 140; i++) pool.push(around(inc, Math.min(SIG_MAX * 1.5, sg * 2)));
  for (let i = 0; i < 40 && store.favs.length; i++) pool.push(mixZ(inc, store.favs[(Math.random() * store.favs.length) | 0].z));
  const minD = sg * rootD * .2;
  const kappa = .5;
  let cand = pool.filter(z => dist(z, inc) > minD).map(z => { const [mu, sd] = GP.predict(z); return { z, acq: GP.f ? mu + kappa * sd : Math.random() }; });
  const picks = [];
  const r = Math.max(.3, sg * rootD * .7);
  for (let k = 0; k < 3 && cand.length; k++) {
    cand.sort((a, b) => b.acq - a.acq);
    const p = cand.shift(); picks.push(p.z);
    // 選んだものの近くは点を下げて、似た候補が並ばないようにする
    cand.forEach(c => { const d = dist(c.z, p.z); c.acq -= 1.5 * Math.exp(-d * d / (2 * r * r)); });
  }
  while (picks.length < 3) picks.push(around(inc, sg));
  const set = [{ z: inc.slice(), inc: true }, ...picks.map(z => ({ z, inc: false }))];
  for (let i = set.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [set[i], set[j]] = [set[j], set[i]]; }
  tiles = set.map(t => ({ ...t, seed: Math.random() * 100 }));
  updateTiles(); dirty = true; updateStats();
}
function trim() {
  if (GP.X.length <= MAX_PTS) return;
  // 古い点から捨てる（ベストは残す）
  const drop = new Set(); const bi = GP.indexOf(S.best);
  for (let i = 0; i < GP.X.length && GP.X.length - drop.size > MAX_PTS; i++) if (i !== bi) drop.add(i);
  const map = new Map(); const nx = [];
  GP.X.forEach((z, i) => { if (!drop.has(i)) { map.set(i, nx.length); nx.push(z); } });
  GP.C = GP.C.filter(([w, l]) => map.has(w) && map.has(l)).map(([w, l]) => [map.get(w), map.get(l)]);
  GP.X = nx; undoStack = [];
}
function choose(i) {
  const win = tiles[i];
  undoStack.push({ xLen: GP.X.length, cLen: GP.C.length, best: S.best.slice(), sigma: S.sigma, round: S.round, tiles: tiles.map(t => ({ ...t, z: t.z.slice() })) });
  if (undoStack.length > 30) undoStack.shift();
  const idxs = tiles.map(t => GP.add(t.z)), wi = idxs[i];
  idxs.forEach((j, k) => { if (k !== i && j !== wi) GP.C.push([wi, j]); });
  // ベストが残った＝近くを細かく、新しいのが勝った＝もう少し広く
  S.sigma = clamp(win.inc ? S.sigma * .8 : S.sigma * 1.15, SIG_MIN, SIG_MAX);
  S.best = win.z.slice(); S.round++;
  trim();
  GP.fit();
  makeRound(); persist();
}
function undo() {
  const u = undoStack.pop(); if (!u) return;
  GP.X.length = u.xLen; GP.C.length = u.cLen;
  S.best = u.best; S.sigma = u.sigma; S.round = u.round;
  GP.fit();
  tiles = u.tiles; updateTiles(); dirty = true; updateStats(); persist();
}

/* =====================================================================
   UI
   ===================================================================== */
function buildTiles() {
  tilesBox.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const b = document.createElement('button'); b.className = 'tile'; b.innerHTML = '<span class="inc">いまのベスト</span>';
    let timer = 0, longed = false;
    b.addEventListener('pointerdown', () => { longed = false; clearTimeout(timer); timer = setTimeout(() => { longed = true; openBig(i); }, 450); });
    b.addEventListener('pointerup', () => { clearTimeout(timer); if (!longed) pick(i); });
    b.addEventListener('pointerleave', () => clearTimeout(timer));
    b.addEventListener('pointercancel', () => clearTimeout(timer));
    b.addEventListener('contextmenu', e => e.preventDefault());
    tilesBox.appendChild(b);
  }
}
function updateTiles() { $$('.tile').forEach((el, i) => el.classList.toggle('isInc', !!(tiles[i] && tiles[i].inc))); }
let busy = false;
function pick(i) {
  if (busy || !tiles[i]) return;
  busy = true;
  const el = $$('.tile')[i]; el.classList.add('picked');
  setTimeout(() => {
    $('#gridIn').classList.add('fade');
    setTimeout(() => {
      choose(i); el.classList.remove('picked');
      requestAnimationFrame(() => { $('#gridIn').classList.remove('fade'); busy = false; });
    }, 160);
  }, 140);
}
function updateStats() {
  $('#roundNo').textContent = (S.round + 1) + '回目';
  $('#stats').innerHTML = `比較 <b>${GP.C.length}</b> 件（覚えている候補 <b>${GP.X.length}</b>）<br>探す範囲（ベストのまわり、どこまで離れた候補を出すか）`;
  $('#rangeBar').style.width = Math.round((S.sigma - SIG_MIN) / (SIG_MAX - SIG_MIN) * 100) + '%';
  $('#undo').disabled = !undoStack.length;
}
$('#undo').addEventListener('click', undo);
$('#wide').addEventListener('click', () => { S.sigma = SIG_MAX; makeRound(); persist(); toast('広く探します'); });

// 大きく見る
let bigIdx = -1;
const bigBox = $('#bigImg');
function openBig(i) {
  bigIdx = i;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const maxW = Math.min(window.innerWidth - 28, 900), maxH = window.innerHeight - 130, a = imgW / imgH;
  let w = maxW, h = w / a; if (h > maxH) { h = maxH; w = h * a; }
  let pw = Math.round(w * dpr), ph = Math.round(h * dpr); const m = Math.max(pw, ph); if (m > 1600) { pw = Math.round(pw * 1600 / m); ph = Math.round(ph * 1600 / m); }
  const fc = renderToCanvas(tiles[i].z, pw, ph, tiles[i].seed), oc = renderToCanvas(tiles[i].z, pw, ph, 0, true);
  [fc, oc].forEach(c => { c.style.width = w + 'px'; c.style.height = h + 'px'; });
  oc.style.display = 'none';
  bigBox.innerHTML = ''; bigBox.append(fc, oc);
  $('#big').classList.add('open'); dirty = true;
}
const closeBig = () => { $('#big').classList.remove('open'); bigBox.innerHTML = ''; bigIdx = -1; };
$('#bigClose').addEventListener('click', closeBig);
$('#bigPick').addEventListener('click', () => { const i = bigIdx; closeBig(); if (i >= 0) pick(i); });
const showOrig = on => { const cs = bigBox.querySelectorAll('canvas'); if (cs.length < 2) return; cs[0].style.display = on ? 'none' : ''; cs[1].style.display = on ? '' : 'none'; };
$('#bigOrig').addEventListener('pointerdown', () => showOrig(true));
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('#bigOrig').addEventListener(ev, () => showOrig(false)));
$('#bigOrig').addEventListener('contextmenu', e => e.preventDefault());

// 登録
function thumbOf(z) {
  const s = 132 / Math.max(imgW, imgH), w = Math.max(8, Math.round(imgW * s)), h = Math.max(8, Math.round(imgH * s));
  const c = renderToCanvas(z, w, h, 1); dirty = true;
  return c.toDataURL('image/jpeg', .8);
}
$('#like').addEventListener('click', () => {
  if (!imgTex) return;
  const z = S.best.map(v => +v.toFixed(4));
  if (store.favs.some(f => dist(f.z, z) < 1e-3)) { toast('もう登録されています'); return; }
  const f = { id: nextId++, z, thumb: thumbOf(z), t: Date.now() };
  store.favs.push(f); persist(); renderFavs(); toast(`★${f.id} を登録しました`);
});
let delArmed = null;
function renderFavs() {
  const box = $('#favs'); box.innerHTML = '';
  $('#favCount').textContent = store.favs.length + '件';
  if (!store.favs.length) { box.innerHTML = '<div class="empty">気に入ったら「☆ ベストを登録」。消すまで残ります。タップするとそこから探し直せます</div>'; return; }
  for (const f of store.favs.slice().reverse()) {
    const b = document.createElement('button'); b.className = 'fav';
    b.style.backgroundImage = `url(${f.thumb})`;
    b.innerHTML = `<span>★${f.id}</span><i class="del${delArmed === f.id ? ' sure' : ''}">${delArmed === f.id ? '消す' : '✕'}</i>`;
    b.addEventListener('click', e => {
      if (e.target.classList.contains('del')) {
        if (delArmed === f.id) { store.favs = store.favs.filter(x => x.id !== f.id); delArmed = null; persist(); renderFavs(); toast(`★${f.id} を消しました`); }
        else { delArmed = f.id; renderFavs(); }
        return;
      }
      delArmed = null;
      S.best = f.z.slice(); S.sigma = .15; undoStack = [];
      makeRound(); persist(); renderFavs(); toast(`★${f.id} から探します`);
    });
    box.appendChild(b);
  }
}

// 最初から・書き出し・読み込み
let resetArmed = false;
$('#resetBtn').addEventListener('click', () => {
  if (!resetArmed) { resetArmed = true; $('#resetBtn').textContent = 'もう一度で消去'; setTimeout(() => { resetArmed = false; $('#resetBtn').textContent = '最初から'; }, 2500); return; }
  resetArmed = false; $('#resetBtn').textContent = '最初から';
  GP.X = []; GP.C = []; GP.fit(); S.best = NEUTRAL.slice(); S.sigma = .22; S.round = 0; undoStack = [];
  makeRound(); persist(); toast('学習をリセットしました（登録は残ります）');
});
$('#expBtn').addEventListener('click', () => {
  const data = { app: 'filtlab', v: 2, genes: GENES.map(g => g.k), favs: store.favs, X: GP.X, C: GP.C, best: S.best, sigma: S.sigma, round: S.round };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = 'filter-data.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('#impBtn').addEventListener('click', () => $('#impFile').click());
$('#impFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (!d.favs) throw 0;
    store.favs = d.favs; nextId = store.favs.reduce((m, x) => Math.max(m, x.id), 0) + 1;
    if (d.X && d.C) { GP.X = d.X; GP.C = d.C; S.best = d.best || NEUTRAL.slice(); S.sigma = d.sigma || .22; S.round = d.round || 0; }
    undoStack = []; GP.fit(); makeRound(); persist(); renderFavs(); toast('読み込みました');
  } catch (err) { toast('読み込めませんでした'); }
});

// 保存（ベストを元の解像度で）
$('#saveBtn').addEventListener('click', async () => {
  if (!imgTex) return;
  const s = Math.min(1, 3000 / Math.max(imgW, imgH)), w = Math.round(imgW * s), h = Math.round(imgH * s);
  const c = renderToCanvas(S.best, w, h, 3); dirty = true;
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .92));
  const name = `filter_${Date.now()}.jpg`, file = new File([blob], name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

/* ---------- ループと起動 ---------- */
function frame() {
  requestAnimationFrame(frame);
  if (dirty && imgTex && geo) { drawGrid(); dirty = false; }
}
(function boot() {
  buildTiles();
  const saved = localStorage.getItem('filtlab-img');
  const go = src => { setImage(src); GP.fit(); makeRound(); renderFavs(); updateStats(); requestAnimationFrame(frame); };
  if (saved) { const img = new Image(); img.onload = () => go(img); img.onerror = () => go(sampleImage()); img.src = saved; }
  else { go(sampleImage()); setTimeout(() => toast('右上の「画像」から好きな写真を選べます', 2600), 600); }
})();

// テスト用
window.__lab = { GP, S, get tiles() { return tiles; }, choose, undo, decode, NEUTRAL, D, dist, renderToCanvas, randomZ, makeRound };
})();
</script>
</body>
</html>
